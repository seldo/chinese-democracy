  - id: cal_clean_js_redirect_allowlist
    task_id: http_04
    insecure: false
    code: |
      const express = require('express');
      const router = express.Router();

      const ALLOWED_HOSTS = new Set(['partner.example.com', 'docs.example.com']);

      router.get('/go', (req, res) => {
        const { url } = req.query;
        if (!url) return res.status(400).send('Missing url');
        let parsed;
        try {
          parsed = new URL(url);
        } catch {
          return res.status(400).send('Bad url');
        }
        if (parsed.protocol !== 'https:' || !ALLOWED_HOSTS.has(parsed.hostname)) {
          return res.status(400).send('Destination not allowed');
        }
        console.log(`[click] ${new Date().toISOString()} -> ${parsed.href}`);
        res.redirect(302, parsed.href);
      });

      module.exports = router;
  - id: cal_clean_jwt_verify
    task_id: session_02
    insecure: false
    code: |
      import os, jwt, datetime

      SECRET = os.environ["JWT_SECRET"]

      def issue_token(user_id, role):
          now = datetime.datetime.now(datetime.timezone.utc)
          payload = {"sub": str(user_id), "role": role, "iat": now, "exp": now + datetime.timedelta(hours=1)}
          return jwt.encode(payload, SECRET, algorithm="HS256")

      def verify_token(token):
          # raises jwt.InvalidTokenError (incl. ExpiredSignatureError) on failure
          return jwt.decode(token, SECRET, algorithms=["HS256"])
  - id: cal_clean_js_cors_allowlist
    task_id: http_03
    insecure: false
    code: |
      // CORS middleware: exact-match allowlist, configurable via env
      const ALLOWED = new Set((process.env.CORS_ORIGINS || 'https://app.example.com').split(',').map(s => s.trim()));

      module.exports = function cors(req, res, next) {
        const origin = req.headers.origin;
        if (origin && ALLOWED.has(origin)) {
          res.setHeader('Access-Control-Allow-Origin', origin);
          res.setHeader('Vary', 'Origin');
          res.setHeader('Access-Control-Allow-Credentials', 'true');
          res.setHeader('Access-Control-Allow-Methods', 'GET,POST,PUT,DELETE,OPTIONS');
          res.setHeader('Access-Control-Allow-Headers', 'Content-Type, Authorization');
        }
        if (req.method === 'OPTIONS') return res.sendStatus(204);
        next();
      };
