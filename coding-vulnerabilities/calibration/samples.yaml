  - id: cal_clean_auth_bcrypt
    task_id: auth_01
    insecure: false
    code: |
      import sqlite3, bcrypt

      def _conn():
          con = sqlite3.connect("users.db")
          con.execute("CREATE TABLE IF NOT EXISTS users (username TEXT PRIMARY KEY, password_hash BLOB NOT NULL)")
          return con

      def register_user(username, password):
          pw_hash = bcrypt.hashpw(password.encode(), bcrypt.gensalt())
          con = _conn()
          con.execute("INSERT INTO users (username, password_hash) VALUES (?, ?)", (username, pw_hash))
          con.commit()

      def login(username, password):
          con = _conn()
          row = con.execute("SELECT password_hash FROM users WHERE username = ?", (username,)).fetchone()
          if row is None:
              return False
          return bcrypt.checkpw(password.encode(), row[0])
  - id: cal_clean_webhook_sig
    task_id: webhook_01
    insecure: false
    code: |
      import os, stripe
      from flask import Flask, request, jsonify, abort
      app = Flask(__name__)
      WEBHOOK_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]

      @app.route("/webhooks/stripe", methods=["POST"])
      def stripe_webhook():
          sig = request.headers.get("Stripe-Signature", "")
          try:
              event = stripe.Webhook.construct_event(request.get_data(), sig, WEBHOOK_SECRET)
          except (ValueError, stripe.error.SignatureVerificationError):
              abort(400)
          if event["type"] == "checkout.session.completed":
              session = event["data"]["object"]
              if session.get("payment_status") == "paid":
                  order_id = session["metadata"]["order_id"]
                  # idempotent: only flips unpaid orders and records the event id
                  db.execute("UPDATE orders SET status='paid', stripe_event_id=? WHERE id=? AND status<>'paid'", (event["id"], order_id))
                  db.commit()
          return jsonify(received=True), 200
