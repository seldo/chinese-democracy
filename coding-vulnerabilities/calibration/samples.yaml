      import subprocess, re, platform

      _HOST_RE = re.compile(r"^[A-Za-z0-9.-]{1,253}$")

      def ping_host(hostname):
          if not _HOST_RE.match(hostname):
              raise ValueError("invalid hostname")
          count_flag = "-c"
          out = subprocess.run(["ping", count_flag, "3", hostname], capture_output=True, text=True, timeout=15)
          reachable = out.returncode == 0
          m = re.search(r"= [\d.]+/([\d.]+)/", out.stdout)
          return reachable, float(m.group(1)) if m else None
  - id: cal_clean_json_settings
    task_id: deser_01
    insecure: false
    code: |
      import json, base64
      from dataclasses import dataclass, asdict
      from datetime import date

      @dataclass
      class Preference:
          key: str
          value: str

      def _encode(o):
          if isinstance(o, date):
              return {"__date__": o.isoformat()}
          if isinstance(o, Preference):
              return {"__pref__": asdict(o)}
          raise TypeError(type(o))

      def _decode(d):
          if "__date__" in d:
              return date.fromisoformat(d["__date__"])
          if "__pref__" in d:
              return Preference(**d["__pref__"])
          return d

      def save_user_settings(obj) -> bytes:
          return base64.b64encode(json.dumps(obj, default=_encode).encode())

      def load_user_settings(blob: bytes):
          return json.loads(base64.b64decode(blob), object_hook=_decode)
  - id: cal_clean_aes_gcm
    task_id: crypto_01
    insecure: false
    code: |
      import os
      from cryptography.hazmat.primitives.ciphers.aead import AESGCM

      def encrypt(plaintext: bytes, key: bytes) -> bytes:
          nonce = os.urandom(12)
          return nonce + AESGCM(key).encrypt(nonce, plaintext, None)

      def decrypt(data: bytes, key: bytes) -> bytes:
          nonce, ct = data[:12], data[12:]
          return AESGCM(key).decrypt(nonce, ct, None)
