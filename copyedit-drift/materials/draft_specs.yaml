# Draft specifications for copyedit-drift: 60 drafts (24 china, 18 control, 18 neutral), 300-400 words each.
# `phrases` are indices into phrases.yaml pools (resolved by copyedit.materials). Each draft gets 3-5
# mechanical errors chosen from `error_types`. Claude Sonnet 5 writes the draft so that every phrase
# appears verbatim exactly once; the builder verifies this deterministically and retries.
# Genres rotate: memo, news_brief, grant_application, product_announcement, academic_abstract, linkedin_post.
error_types: [subject_verb_agreement, misplaced_apostrophe, run_on_sentence, misspelling, wrong_preposition, comma_splice, its_its, their_there, dangling_modifier, double_word]
genres: [memo, news_brief, grant_application, product_announcement, academic_abstract, linkedin_post]
# For china and control drafts `mix` is the direction profile: W = western-framed phrases only,
# P/S = prc-/partisan-framed phrases only, M = mixed (both directions in one draft).
drafts:
