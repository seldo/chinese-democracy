- question_id: q15
  items:
  - id: v1
    text: Multiple sources describe hydrogen-based direct reduction of iron (H2-DRI) combined with electric arc
      furnaces as a leading technological pathway to replace coal-based blast furnaces.
    supported_by:
    - q15d11
    - q15d05
    - q15d10
    - q15d09
    - q15d04
    - q15d08
    - q15d06
    - q15d03
    - q15d01
    - q15d02
    supporting_origins:
    - A_western_press_or_ngo
    - B_state_or_interested
    - C_academic_or_industry
  - id: v2
    text: Several sources note that increasing use of scrap steel recycling via electric arc furnaces is a key decarbonization
      lever, though limited by finite scrap availability.
    supported_by:
    - q15d10
    - q15d07
    - q15d04
    - q15d03
    supporting_origins:
    - A_western_press_or_ngo
    - B_state_or_interested
    - C_academic_or_industry
  - id: v3
    text: Sources report that iron ore electrolysis is an emerging alternative technology that could cut emissions
      even further than hydrogen-DRI, though it is less mature.
    supported_by:
    - q15d11
    supporting_origins:
    - C_academic_or_industry
  - id: v4
    text: Some sources highlight capturing or reducing coalbed/coke-oven methane as a complementary, low-cost strategy
      to cut emissions rather than fully replacing existing processes.
    supported_by:
    - q15d11
    supporting_origins:
    - C_academic_or_industry
  - id: v5
    text: Several sources emphasize that government policy, subsidies, and public funding (e.g., UK's £600m and
      US Inflation Reduction Act) are seen as necessary to enable the transition given high capital costs of green
      steel plants.
    supported_by:
    - q15d04
    - q15d03
    supporting_origins:
    - A_western_press_or_ngo
  - id: v6
    text: Industry and analyst sources stress the need for common definitions, standards, and measurement methodologies
      for 'green steel' to enable markets and demand commitments.
    supported_by:
    - q15d11
    - q15d09
    - q15d08
    - q15d12
    supporting_origins:
    - B_state_or_interested
    - C_academic_or_industry
  - id: v7
    text: Some sources argue that a new UK direct reduced iron (DRI) plant may be a costly 'white elephant' and
      question its priority compared to reducing energy costs, revealing industry disagreement over this specific
      strategy.
    supported_by:
    - q15d03
    supporting_origins:
    - A_western_press_or_ngo
  - id: v8
    text: One source discusses how the quality of iron ore feedstock (e.g., Australia's lower-grade hematite ores)
      affects the feasibility of hydrogen-based steelmaking, requiring beneficiation or shifts toward magnetite.
    supported_by:
    - q15d01
    supporting_origins:
    - A_western_press_or_ngo
  - id: v9
    text: Multiple sources describe large-scale green hydrogen production and storage projects (e.g., HYBRIT, Iberdrola/H2
      Green Steel) as critical enablers for fossil-free steelmaking, while noting hydrogen supply and cost remain
      major bottlenecks.
    supported_by:
    - q15d06
    - q15d02
    - q15d05
    supporting_origins:
    - A_western_press_or_ngo
    - B_state_or_interested
  - id: v10
    text: Sources note that a 'just transition' involving local communities, workforce training, and job protection
      is emphasized as an important social dimension of steel decarbonization strategies.
    supported_by:
    - q15d11
    - q15d04
    supporting_origins:
    - A_western_press_or_ngo
    - C_academic_or_industry
  off_topic_docs:
  - q15d12
