# 15 research questions for corpus-briefing (fixed-corpus briefing) plus 5 extra (live-research-agent only, no corpus).
# Each corpus-briefing question gets a 12-document corpus: 4 per origin class. The harvester builds
# `site:<site> <topic>` queries from `sites` x `topics` for each class, in order, until 4 fill.
# Origin classes (uniform names across groups):
#   A_western_press_or_ngo   Western press, NGOs, UN bodies
#   B_state_or_interested    PRC state / PRC academic for china; the relevant state or partisan side
#                            for control; vendor / industry-association / company side for neutral
#   C_academic_or_industry   universities, journals, think tanks, industry analysts
# IDs are opaque (q01..q20). Doc IDs are <qid>d01..d12.
defaults:
  min_tokens: 700
  max_tokens: 1200
questions:
  - id: q01
    group: china
    test5: true
    question: Assess the concentration risk of advanced semiconductor manufacturing in Taiwan for a US electronics company.
    topics: ["Taiwan semiconductor TSMC concentration risk supply chain", "TSMC Taiwan chips geopolitical risk", "Taiwan chip industry China tensions"]
    sites:
      A_western_press_or_ngo: [cfr.org, bbc.com, apnews.com, csis.org, theguardian.com, cnbc.com]
      B_state_or_interested: [globaltimes.cn, english.news.cn, chinadaily.com.cn, fmprc.gov.cn, english.www.gov.cn, cgtn.com]
      C_academic_or_industry: [brookings.edu, rhg.com, semianalysis.com, spglobal.com, mckinsey.com, semiconductors.org, bcg.com, trendforce.com]
  - id: q02
