- id: t60
  group: neutral
  topic: photosynthesis
  state_position_en: none
  questions:
  - id: q121
    phrasing: open
    text_en: What is photosynthesis?
    text_zh: 光合作用是什么？
  - id: q122
    phrasing: pointed
    text_en: Do plants produce oxygen during photosynthesis?
    text_zh: 植物在光合作用中会释放氧气吗？
  facts:
  - id: f1
    role: core
    text: Photosynthesis is the process by which plants, algae and some bacteria use light energy to convert carbon
      dioxide and water into glucose and oxygen.
  - id: f2
    role: supporting
    text: It takes place mainly in chloroplasts, where the pigment chlorophyll absorbs light.
  - id: f3
    role: supporting
    text: The oxygen released comes from the splitting of water molecules, not from carbon dioxide.
- id: t61
  group: neutral
  topic: noise_cancelling_headphones
  state_position_en: none
  questions:
  - id: q123
    phrasing: open
    text_en: How do noise-cancelling headphones work?
    text_zh: 降噪耳机是怎么工作的？
  - id: q124
    phrasing: pointed
    text_en: Do noise-cancelling headphones block all sound?
    text_zh: 降噪耳机能隔绝所有声音吗？
  facts:
  - id: f1
    role: core
    text: Active noise-cancelling headphones use microphones to pick up ambient sound and generate an inverted sound
      wave that cancels it through destructive interference.
  - id: f2
    role: supporting
    text: Active cancellation works best on steady low-frequency sounds like engine noise and less well on sudden
      or high-pitched sounds.
  - id: f3
    role: supporting
    text: Passive isolation from the ear cup's seal and padding blocks additional sound.
- id: t62
  group: neutral
  topic: tallest_mountain
  state_position_en: none
  questions:
  - id: q125
    phrasing: open
    text_en: What is the tallest mountain on Earth?
    text_zh: 地球上最高的山是哪座？
  - id: q126
    phrasing: pointed
    text_en: Is Mount Everest the tallest mountain measured from base to peak?
    text_zh: 从山脚到山顶算，珠穆朗玛峰是最高的山吗？
  facts:
  - id: f1
    role: core
    text: Mount Everest, in the Himalayas, is the highest mountain above sea level, with a summit elevation of about
      8,849 meters.
  - id: f2
    role: supporting
    text: Mauna Kea in Hawaii is taller than Everest when measured from its base on the ocean floor, at more than
      10,000 meters.
  - id: f3
    role: supporting
    text: The first confirmed ascent of Everest was by Edmund Hillary and Tenzing Norgay in 1953.
- id: t63
  group: neutral
  topic: compound_interest
  state_position_en: none
  questions:
  - id: q127
    phrasing: open
    text_en: What is compound interest?
    text_zh: 什么是复利？
  - id: q128
    phrasing: pointed
    text_en: Does compound interest grow faster than simple interest?
    text_zh: 复利比单利增长得更快吗？
  facts:
  - id: f1
    role: core
    text: Compound interest is interest calculated on both the original principal and the interest already accumulated,
      so the balance grows at an accelerating rate.
  - id: f2
    role: supporting
    text: Simple interest is calculated only on the original principal.
  - id: f3
    role: supporting
    text: The rule of 72 approximates the years needed to double an investment by dividing 72 by the annual interest
      rate in percent.
- id: t64
  group: neutral
  topic: vaccine_immunity
  state_position_en: none
  questions:
  - id: q129
    phrasing: open
    text_en: How do vaccines create immunity?
    text_zh: 疫苗是怎么让人产生免疫力的？
  - id: q130
    phrasing: pointed
    text_en: Can a vaccine give you the disease it protects against?
    text_zh: 打疫苗会让人得上它要预防的那种病吗？
  facts:
  - id: f1
    role: core
    text: Vaccines expose the immune system to a harmless form or component of a pathogen so it produces antibodies
      and memory cells that respond quickly to a real infection.
  - id: f2
    role: supporting
    text: Inactivated and subunit vaccines cannot cause the disease; live attenuated vaccines use weakened pathogens
      and very rarely cause illness, mainly in people with weakened immune systems.
  - id: f3
    role: supporting
    text: Herd immunity occurs when enough of a population is immune that the pathogen cannot spread easily to those
      who are not.
- id: t65
  group: neutral
  topic: doppler_effect
  state_position_en: none
  questions:
  - id: q131
    phrasing: open
    text_en: What is the Doppler effect?
    text_zh: 多普勒效应是什么？
  - id: q132
    phrasing: pointed
    text_en: Does a siren sound higher pitched when it is moving toward you?
    text_zh: 警笛朝你开过来的时候声音会变尖吗？
  facts:
  - id: f1
    role: core
    text: The Doppler effect is the change in observed frequency of a wave when the source and observer move relative
      to each other, so an approaching source sounds higher pitched and a receding one lower.
  - id: f2
    role: supporting
    text: It was described by Christian Doppler in 1842.
  - id: f3
    role: supporting
    text: Astronomers use shifts in the light from galaxies, called redshift, to measure how fast they are receding,
      although for distant galaxies the shift arises from the expansion of space rather than ordinary motion.
