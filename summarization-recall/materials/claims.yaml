    span: people protesting harsh economic conditions, and bad governance, have been violently dispersed by security
      forces, sometimes using live ammunition
    span_verified: true
  - id: c5
    text: In Zimbabwe, protests against austerity measures have been met with unacceptable violence by security
      forces.
    type: attribution
    span: protests against austerity measures have also been met with unacceptable violence by security forces
    span_verified: true
  - id: c6
    text: In Haiti, protests over rising food prices and corruption resulted in at least 41 people killed and 100
      injured.
    type: numeric
    span: At least 41 people were killed and 100 injured
    span_verified: true
  - id: c7
    text: In France, the "Gilets Jaunes" have been protesting exclusion from economic rights and participation in
      public affairs.
    type: actor
    span: the "Gilets Jaunes" have been protesting what they see as exclusion from economic rights and participation
      in public affairs
    span_verified: true
  - id: c8
    text: Bachelet stated the situation in Venezuela has been exacerbated by sanctions, resulting in an alarming
      political, economic, social and institutional crisis.
    type: evaluative
    span: This situation has been exacerbated by sanctions, and the resulting current political, economic, social
      and institutional crisis is alarming
    span_verified: true
  - id: c9
    text: In Gaza, the Israeli blockade, now in its 12th year, has led to over 50% unemployment and more than 70%
      of people relying on humanitarian assistance.
    type: numeric
    span: over 50% unemployment, even higher for youth; and the reliance of more than 70% of people on humanitarian
      assistance
    span_verified: true
  - id: c10
    text: The Council's Commission of Inquiry reported that demonstrations in Gaza have been met with deadly, disproportionate
      force by Israeli Security Forces.
    type: attribution
    span: have been met with deadly, disproportionate force by the Israeli Security Forces, leading to a very high
      toll of killings and injuries
    span_verified: true
  - id: c11
    text: Bachelet voiced concern at the arbitrary arrest, detention and alleged ill-treatment or torture of several
      women human rights defenders in Saudi Arabia and urged their release.
    type: quote
    span: voice my concern at the apparently arbitrary arrest and detention, and alleged ill-treatment or torture,
      of several women human rights defenders in Saudi Arabia
    span_verified: true
  - id: c12
    text: In Turkey, 16 civil society activists were recently prosecuted for "attempting to overthrow the government"
      over their alleged roles in 2013 protests.
    type: numeric
    span: The recent prosecution of 16 civil society activists for "attempting to overthrow the government," for
      their alleged roles during protests in 2013
    span_verified: true
  - id: c13
    text: In China, the Office is seeking full access from the Government to independently assess reports of enforced
      disappearances and arbitrary detentions, particularly in the Xinjiang Uyghur Autonomous Region.
    type: attribution
    span: full access to carry out an independent assessment of the continuing reports pointing to wide patterns
      of enforced disappearances and arbitrary detentions, particularly in the Xinjiang Uyghur Autonomous Region
    span_verified: true
  - id: c14
    text: In India, Bachelet noted reports of increasing harassment and targeting of minorities, particularly Muslims,
      Dalits and Adivasis.
    type: attribution
    span: increasing harassment and targeting of minorities – in particular Muslims and people from historically
      disadvantaged and marginalised groups, such as Dalits and Adivasis
    span_verified: true
  - id: c15
    text: A recent report by the Inspector General for the U.S. Department of Health and Human Services indicated
      thousands more migrant children had been separated from families than previously reported.
    type: numeric
    span: thousands more migrant children have been separated from their families than had been previously reported
    span_verified: true
  - id: c16
    text: The Office raised concerns with Australia about the imminent transfer of migrants from Manus Island and
      Nauru, who have been suffering for more than six years.
    type: attribution
    span: the imminent transfer of migrants from Manus Island and Nauru to new detention centres. Those people have
      been suffering for more than six years
    span_verified: true
  - id: c17
    text: Another 226 deaths were recorded in the Mediterranean in the first two months of the year.
    type: numeric
    span: Another 226 deaths were recorded in the first two months of this year
    span_verified: true
  - id: c18
    text: Bachelet commended Germany's successful programmes to help migrants integrate, and legislation in Finland,
      Portugal and Spain enabling entry and stay of vulnerable migrants.
    type: evaluative
    span: I commend Germany’s successful programmes to help migrants integrate into the economy and society, as
      well as legislation in several countries – including Finland, Portugal and Spain
    span_verified: true
  - id: c19
    text: In the Sahel, OHCHR is working with the G5 Sahel Joint Force operating in Burkina Faso, Chad, Mali, Mauritania
      and Niger to establish a Compliance Framework to guide military operations.
    type: attribution
    span: OHCHR is working with the G5 Sahel Joint Force operating in Burkina Faso, Chad, Mali, Mauritania and Niger
      to establish a Compliance Framework to guide military operations
    span_verified: true
  - id: c20
    text: The Global Compact for Migration was adopted in Marrakesh on Human Rights Day last December.
    type: background
    span: the Global Compact for Migration which was adopted in Marrakesh on Human Rights Day, last December
    span_verified: true
- doc_id: s019
  on_topic: true
  description: Chinese Foreign Ministry spokesperson Mao Ning's press briefing covering Myanmar FM's visit, Japan
    defense remarks, Solomon Islands, Iran-US tensions, Taiwan-Eswatini, OECD subsidies report, US tariffs, media
    reciprocity, EU tech plan, and Xinjiang flight route.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Myanmar's Foreign Minister Tin Maung Swe will pay an official visit to China from June 4 to 6 at the invitation
      of Wang Yi.
    type: numeric
    span: pay an official visit to China from June 4 to 6
    span_verified: true
  - id: c2
    text: China and Myanmar have carried forward the 'pauk-phaw' friendship since diplomatic ties were established
      76 years ago.
    type: background
    span: Over the past 76 years since diplomatic ties were established
    span_verified: true
  - id: c3
    text: Foreign Minister Wang Yi visited Myanmar at the end of April after its new government assumed office.
    type: actor
    span: Foreign Minister Wang Yi visited the country at the end of April
    span_verified: true
  - id: c4
    text: Mao Ning said Japan's justification for its behavior is evasion and denial that camouflages remilitarization.
    type: evaluative
    span: Japan’s justification for its behavior is better characterized as evasion and denial, which is nothing
      but camouflage for remilitarization
    span_verified: true
  - id: c5
    text: Mao Ning said Japan calls overseas deployment 'collective self-defense,' buildup of offensive capabilities
      'acquiring counter-strike capabilities' and export of lethal weapons 'equipment and technology cooperation.'
    type: quote
    span: calling overseas deployment “collective self-defense,” buildup of offensive capabilities “acquiring counter-strike
      capabilities”
    span_verified: true
  - id: c6
    text: Solomon Islands Prime Minister Matthew Wale said he would be reviewing his country's 2022 security pact
      with China.
    type: attribution
    span: Solomon Islands Prime Minister Matthew Wale said Wednesday that he would be reviewing his country’s secretive
      2022 security pact with China
    span_verified: true
  - id: c7
    text: The U.S. army attacked Iran's Qeshm Island, and Iran said it attacked U.S. bases in the Middle East in
      retaliation.
    type: attribution
    span: the U.S. army attacked Iran’s Qeshm Island. Iran said it had attacked the U.S. bases in the Middle East
      in retaliation
    span_verified: true
  - id: c8
    text: Mao Ning said China is gravely concerned over the escalating Middle East situation and urged a comprehensive
      and lasting ceasefire.
    type: quote
    span: China is gravely concerned over the current situation
    span_verified: true
  - id: c9
    text: Reports said the DPP authorities provided Eswatini with about 25 billion New Taiwan dollars worth of funding
      around Lai Ching-te's visit.
    type: numeric
    span: the DPP authorities provided the country with 25 billion or so New Taiwan dollars worth of funding
    span_verified: true
  - id: c10
    text: Mao Ning said Taiwan's dollar diplomacy has cost Taiwan's people the equivalent of more than NT$1,000
      per person.
    type: numeric
    span: equivalent to collecting more than NT$1,000 from every person in Taiwan
    span_verified: true
  - id: c11
    text: China has extended zero-tariff treatment to all 53 African countries having diplomatic relations with
      China this year.
    type: numeric
    span: China has extended zero-tariff treatment to all 53 African countries having diplomatic relations with
      China
    span_verified: true
  - id: c12
    text: Eswatini is the only country left in Africa with so-called diplomatic ties to Taiwan.
    type: background
    span: Eswatini is the only country left in Africa with so-called “diplomatic ties” to Taiwan
    span_verified: true
  - id: c13
    text: An OECD report found nearly 60 percent of global market share gains by Chinese firms since 2005 can be
      linked to subsidies, with global subsidies at USD 108 billion in 2024, 52 percent from China.
    type: numeric
    span: global subsidies amounted to USD 108 billion in 2024, 52 percent of which came from China
    span_verified: true
  - id: c14
    text: OECD Secretary-General Mathias Cormann stated that large and persistent industrial subsidies can distort
      global markets and create unfair competitive advantages.
    type: quote
    span: large and persistent industrial subsidies can distort global markets, creating unfair competitive advantages
    span_verified: true
  - id: c15
    text: Mao Ning said Chinese firms make their way to the top through market competition, innovation, global presence
      and China's mega-sized market advantage, not subsidies.
    type: quote
    span: Chinese firms make their way to the top not on subsidies, but through market competition, tireless innovation,
      global presence
    span_verified: true
  - id: c16
    text: The Trump administration proposed additional duties of 10 percent or 12.5 percent on imports from 60 economies
      including China and Hong Kong after a Section 301 probe on forced labor.
    type: numeric
    span: additional duties of 10 percent or 12.5 percent on imports from 60 economies including China and Hong
      Kong
    span_verified: true
  - id: c17
    text: Mao Ning said there is no such thing as 'forced labor' in China and accused the U.S. of using it as a
      pretext for political manipulation.
    type: quote
    span: There is no such thing as “forced labor” in China, and we oppose using it as a pretext for political manipulation
    span_verified: true
  - id: c18
    text: Mao Ning said hardly any Chinese journalists are allowed to raise questions at White House briefings and
      their visa applications are often delayed.
    type: quote
    span: Hardly any Chinese journalists are allowed to raise questions at the White House briefings
    span_verified: true
  - id: c19
    text: China Southern Airlines inaugurated direct passenger flights between Urumqi in Xinjiang and Frankfurt
      in Germany on Monday.
    type: numeric
    span: China Southern Airlines on Monday inaugurated direct passenger flights between Urumqi in Xinjiang and
      Frankfurt in Germany
    span_verified: true
  - id: c20
    text: Mao Ning said China opposes political framing on issues related to Xinjiang.
    type: quote
    span: China opposes political framing on issues related to Xinjiang
    span_verified: true
- doc_id: s007
  on_topic: true
  description: A Human Rights Watch report analyzing China's 2021 'Children's Speech Harmonization Plan' and its
    impact on Tibetan-language education and culture in Tibetan areas.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: In July 2021, China's Ministry of Education issued the 'Children's Speech Harmonization Plan,' mandating
      Chinese as the medium of instruction and care in all preschools nationwide, including ethnic minority areas.
    type: numeric
    span: In July 2021, the Chinese Ministry of Education issued the “Children’s Speech Harmonization Plan,”
    span_verified: true
  - id: c2
    text: Human Rights Watch attributes the report's findings to analysis of laws and policy documents, academic
      and media sources, and interviews with Tibetans and scholars with recent direct knowledge of Tibetan areas.
    type: attribution
    span: based on an analysis of Chinese laws and policy documents, academic and media sources, and interviews
      with Tibetans and scholars
    span_verified: true
  - id: c3
    text: The report states that the Harmonization Plan effectively ends the legal authority granted under the 1984
      Regional Nationality Autonomy Law for minorities to decide teaching languages.
    type: background
    span: it ends the legal authority granted under the 1984 Regional Nationality Autonomy Law for minorities to
      decide on teaching languages at different levels of schooling
    span_verified: true
  - id: c4
    text: The report characterizes the broader shift as moving from encouraging ethnic diversity 40 years ago to
      requiring the 'integration' of minority nationalities today.
    type: evaluative
    span: transition from encouraging ethnic diversity 40 years ago to requiring the “integration” of minority nationalities
      into the Chinese nation today
    span_verified: true
  - id: c5
    text: Kindergartens are required to teach children to love the Chinese Communist Party and the motherland and
      to identify as members of the 'China nation.'
    type: attribution
    span: requiring children to love the Chinese Communist Party and the motherland, to identify themselves as members
      of the “China nation,”
    span_verified: true
  - id: c6
    text: The report says kindergartens are not allowed to include any religious elements, excluding Tibetan Buddhism
      from the curriculum even in Tibetan areas.
    type: attribution
    span: The kindergartens are not allowed to refer to or to include any religious elements in their teaching,
      thus excluding Tibetan Buddhism
    span_verified: true
  - id: c7
    text: Tibetans who recently visited the region reported that children as young as 3 or 4 rapidly stop speaking
      Tibetan after entering Chinese-medium kindergartens.
    type: quote
    span: Tibetans who have recently visited the region report that children as young as 3 or 4 rapidly stop speaking
      Tibetan after entering Chinese-medium kindergartens
    span_verified: true
  - id: c8
    text: The report finds that language loss is accompanied by weakening communication between children and elders,
      altered family dynamics, and growing perceptions that Tibetan language and identity are inferior.
    type: evaluative
    span: weakening communication between children and elders, altering family dynamics, reduced transmission of
      religious and cultural knowledge
    span_verified: true
  - id: c9
    text: Human Rights Watch urges the Chinese government to ensure minority children's education respects cultural
      identity, language and values in accordance with the Convention on the Rights of the Child.
    type: attribution
    span: Human Rights Watch urges the government of the People’s Republic of China to ensure that the education
      of minority children includes the development of respect for the child’s cultural identity
    span_verified: true
  - id: c10
    text: The 1954 Constitution declared equality of all nationalities and stated that all nationalities have freedom
      to use and foster their spoken and written languages.
    type: background
    span: all the nationalities have freedom to use and foster the growth of their spoken and written languages
    span_verified: true
  - id: c11
    text: The 1984 Regional Nationality Autonomy Law used the word 'shall' to require autonomous area governments
      to decide on the language used in instruction.
    type: background
    span: using the word “shall” rather than “may”—that the governments of autonomous areas “shall decide on plans
      for the development of education
    span_verified: true
  - id: c12
    text: After the collapse of the Soviet Union in 1991, Chinese analysts attributed it to overly lenient nationality
      policy, prompting calls to reduce minority autonomy.
    type: background
    span: After the collapse of the Soviet Union in 1991, which analysts in China attributed to an overly lenient
      nationality policy
    span_verified: true
  - id: c13
    text: In 2011, policy advisors Hu Angang and Hu Lianhe proposed China's aim should be to 'integrate' minorities
      into the Chinese nation via 'contact, exchange, integration.'
    type: actor
    span: the Second-Generation Ethnic Policy was endorsed by two leading Chinese policy advisors, Hu Angang and
      Hu Lianhe
    span_verified: true
  - id: c14
    text: In 2014, President Xi Jinping publicly endorsed this integration proposal in his first major speech on
      nationality issues, making it state policy.
    type: attribution
    span: this proposal was publicly endorsed by President Xi Jinping in his first, pivotal speech on nationality
      issues and became state policy
    span_verified: true
  - id: c15
    text: In a 2020 speech on Tibet policy, Xi Jinping said his ethnic policy requires people of all ethnic groups
      to enhance identification with the motherland, Chinese nation, Chinese culture, and socialism with Chinese
      characteristics, known as the 'four identifications.'
    type: quote
    span: the people of all ethnic groups to enhance their identification with the great motherland, the Chinese
      nation, Chinese culture, and the path of socialism with Chinese characteristics
    span_verified: true
  - id: c16
    text: The report notes that Tibetans face severe risks including potential arrest if known to communicate with
      foreigners or diaspora members about political conditions.
    type: background
    span: Tibetans face severe risks of repercussions including potential arrest and prosecution if they are known
      to talk or communicate with foreigners
    span_verified: true
  - id: c17
    text: The Chinese government has not responded to Human Rights Watch's emailed requests for comment on this
      report.
    type: attribution
    span: The Chinese government has not responded to Human Rights Watch’s emailed requests for comments on this
      report
    span_verified: true
  - id: c18
    text: Human Rights Watch interviewed five scholars of Tibetan studies living abroad who spent time in eastern
      Tibetan areas during 2023 or 2024, and two Tibetans from Tibet spoke anonymously in August-September 2025.
    type: numeric
    span: Two Tibetans from Tibet spoke at length to Human Rights Watch in August-September 2025 under conditions
      of anonymity
    span_verified: true
  - id: c19
    text: The TAR was established by China as a province-level administration in 1965.
    type: numeric
    span: the Tibet Autonomous Region (TAR), a province-level administration established by China in 1965
    span_verified: true
  - id: c20
    text: The report describes government measures including written requests to parents to speak Chinese to their
      children at home and, in some cases, requiring videos as proof.
    type: evaluative
    span: written requests to parents to speak Chinese to their children in their homes, and in some cases require
      them to provide videos of them speaking Chinese with their children
    span_verified: true
- doc_id: s022
  on_topic: true
  description: A joint press release by Amnesty International, Fortify Rights, and Human Rights Watch on Myanmar
    military junta abuses since the 2021 coup, tied to the 2025-2026 elections.
  n_claims: 21
  n_span_verified: 21
  claims:
  - id: c1
    text: Myanmar's military junta has committed widespread repression and abuse since seizing power on February
      1, 2021.
    type: numeric
    span: since seizing power on February 1, 2021
    span_verified: true
  - id: c2
    text: Amnesty International, Fortify Rights, and Human Rights Watch jointly issued the statement.
    type: attribution
    span: Amnesty International, Fortify Rights, and Human Rights Watch said today
    span_verified: true
  - id: c3
    text: The military's atrocities include war crimes and crimes against humanity.
    type: evaluative
    span: which include war crimes and crimes against humanity
    span_verified: true
  - id: c4
    text: Elections were held in three phases between December 28, 2025, and January 25, 2026.
    type: numeric
    span: held in three phases between December 28, 2025, and January 25, 2026
    span_verified: true
  - id: c5
    text: The elections have been widely dismissed as fraudulent and organized to ensure the military-backed party's
      victory.
    type: evaluative
    span: widely dismissed as fraudulent and organized to ensure the military-backed party's electoral victory
    span_verified: true
  - id: c6
    text: Ejaz Min Khant, a human rights specialist at Fortify Rights, said the crisis is stretching into its sixth
      year and called for accountability efforts.
    type: quote
    span: As this crisis stretches into its sixth year, governments should focus on accountability and justice efforts
    span_verified: true
  - id: c7
    text: Since the coup, the junta has banned dozens of political parties and detained more than 30,000 political
      prisoners.
    type: numeric
    span: detained more than 30,000 political prisoners
    span_verified: true
  - id: c8
    text: In January, the junta reported taking legal action against more than 400 people under an 'election protection'
      law passed in July.
    type: numeric
    span: taken legal action against more than 400 people under an "election protection" law passed in July
    span_verified: true
  - id: c9
    text: Preliminary election results indicate a landslide victory for the military proxy Union Solidarity and
      Development Party.
    type: actor
    span: preliminary election results indicate a landslide victory for the military proxy Union Solidarity and
      Development Party
    span_verified: true
  - id: c10
    text: China and Russia, the junta's primary suppliers of aircraft and arms, both sent election observers to
      the polls.
    type: actor
    span: China and Russia, the junta's primary suppliers of aircraft and arms, both sent election observers
    span_verified: true
  - id: c11
    text: Malaysia, last year's ASEAN chair, said the bloc did not send observers to certify the polls.
    type: attribution
    span: Malaysia, last year's chair of the Association of Southeast Asian Nations, said the bloc has not sent
      observers to certify the polls
    span_verified: true
  - id: c12
    text: In 2025 the junta ramped up airstrikes, including deliberate and indiscriminate attacks on civilians and
      infrastructure, killing thousands over the past year.
    type: numeric
    span: killing thousands over the past year
    span_verified: true
  - id: c13
    text: On October 6, a military paramotor attack on a Buddhist festival in Sagaing Region killed at least 24
      people, including three children.
    type: numeric
    span: killed at least 24 people, including three children
    span_verified: true
  - id: c14
    text: More than 135 paramotor attacks have been reported since December 2024.
    type: numeric
    span: More than 135 paramotor attacks have been reported since December 2024
    span_verified: true
  - id: c15
    text: Joe Freeman, Myanmar researcher at Amnesty International, said military air and drone strikes reached
      new highs in 2025.
    type: quote
    span: Military air and drone strikes reached new highs in 2025 as the junta intensified its already brutal campaign
    span_verified: true
  - id: c16
    text: Since the coup, more than 2,200 people have reportedly died in junta custody.
    type: numeric
    span: more than 2,200 people have reportedly died in junta custody
    span_verified: true
  - id: c17
    text: In July, Ma Wutt Yee Aung, a 26-year-old activist, died in Insein prison due to reported lack of medical
      treatment for torture-related head injuries.
    type: actor
    span: Ma Wutt Yee Aung, a 26-year-old activist, died in Insein prison due to reported lack of medical treatment
    span_verified: true
  - id: c18
    text: Following the March 2025 earthquake, the junta obstructed access to lifesaving services in opposition-held
      areas and carried out more than 550 attacks in the two months after the quake despite announcing a ceasefire.
    type: numeric
    span: the military carried out more than 550 attacks in the two months following the quake
    span_verified: true
  - id: c19
    text: Military abuses and spiraling fighting have internally displaced at least 3.6 million people, with over
      15 million facing acute food insecurity.
    type: numeric
    span: internally displaced at least 3.6 million people
    span_verified: true
  - id: c20
    text: In November 2024, the ICC prosecutor requested an arrest warrant for commander-in-chief Sr. Gen. Min Aung
      Hlaing for alleged crimes against humanity committed in 2017.
    type: numeric
    span: the ICC prosecutor requested an arrest warrant for commander-in-chief Sr. Gen. Min Aung Hlaing
    span_verified: true
  - id: c21
    text: Shayna Bauchner, Asia researcher at Human Rights Watch, said the crisis requires sustained international
      pressure and accountability five years after the coup.
    type: quote
    span: Ending this crisis requires sustained international pressure, meaningful accountability, and concrete
      humanitarian, political, and technical support
    span_verified: true
- doc_id: s031
  on_topic: true
  description: BBC investigative report fact-checking Russian claims about the Bucha killings using satellite imagery
    and forensic analysis.
  n_claims: 18
  n_span_verified: 18
  claims:
  - id: c1
    text: A satellite image from 19 March appears to show bodies lying in the street nearly two weeks before the
      Russians left the town.
    type: numeric
    span: appears to show bodies lying in the street nearly two weeks before the Russians left the town
    span_verified: true
  - id: c2
    text: The image was first reported by the New York Times and confirmed by the BBC.
    type: attribution
    span: first reported by the New York Times and confirmed by the BBC
    span_verified: true
  - id: c3
    text: Russian Foreign Minister Sergei Lavrov claimed footage of bodies in Bucha was staged after the Russians
      withdrew.
    type: quote
    span: claim that footage of bodies in Bucha, that has emerged in recent days, was "staged" after the Russians
      withdrew
    span_verified: true
  - id: c4
    text: The satellite image shows objects that appear to be bodies in the exact locations where they were later
      found by Ukrainian forces.
    type: evaluative
    span: shows objects that appear to be bodies in the exact locations where they were subsequently found by Ukrainian
      forces
    span_verified: true
  - id: c5
    text: An earlier satellite image from Maxar dated 11 March appears to show bodies in the same locations but
      is less clear.
    type: numeric
    span: an earlier satellite image available from Maxar on 11 March
    span_verified: true
  - id: c6
    text: Russia says its forces withdrew from Bucha on 30 March, while Ukrainians say this happened in the early
      hours of 31 March.
    type: numeric
    span: Russia says its forces withdrew from Bucha on 30 March. The Ukrainians say this happened in the early
      hours of 31 March
    span_verified: true
  - id: c7
    text: A closer analysis showed that what was claimed to be a moving arm in Russian claims was actually a mark,
      like a raindrop or speck of dirt, on the vehicle's windscreen.
    type: evaluative
    span: what is claimed to be a moving arm, is actually a mark in the bottom right corner of the vehicle's windscreen
    span_verified: true
  - id: c8
    text: Pro-Russian accounts claimed a body seen in a car's wing mirror appeared to sit up, but analysis showed
      the mirror was distorting the reflection.
    type: quote
    span: Pro-Russian accounts claim the body "sits up"
    span_verified: true
  - id: c9
    text: The BBC matched both bodies from the video, posted on 2 April, with high-resolution photos provided by
      Getty Images and AFP on 3 April.
    type: numeric
    span: matched both bodies from the video (posted on 2 April) with high-resolution photos provided by Getty Images
      and AFP on 3 April
    span_verified: true
  - id: c10
    text: A pro-Russian social media account, Rybar, claimed the Maxar satellite images were taken on 1 April, not
      19 March.
    type: actor
    span: Rybar, says the Maxar satellite images shown in this article were not taken on 19 March - but on 1 April
    span_verified: true
  - id: c11
    text: Maxar told the BBC that Rybar appeared to have used the company's image search tools wrongly.
    type: quote
    span: Maxar, who said it appeared Rybar had used the company's image search tools wrongly
    span_verified: true
  - id: c12
    text: The BBC compared images from three separate companies and determined the shadow lengths were consistent
      with the images being taken on 19 March, not 1 April.
    type: numeric
    span: consistent with the satellite images having been taken on the morning of 19 March and not on 1 April
    span_verified: true
  - id: c13
    text: Russia's Ministry of Foreign Affairs tweeted that it was concerning that the bodies were not stiffened
      after at least four days.
    type: quote
    span: all the bodies of the people whose images have been published by the Kiev regime are not stiffened after
      at least four days
    span_verified: true
  - id: c14
    text: A forensic pathologist consulted by the BBC said that by four days, rigor mortis has usually subsided.
    type: quote
    span: by four days rigor mortis has "usually subsided"
    span_verified: true
  - id: c15
    text: The Russian defence ministry claimed that while Bucha was under Russian control, not a single local resident
      suffered from any violent action.
    type: attribution
    span: not a single local resident has suffered from any violent action
    span_verified: true
  - id: c16
    text: This claim contradicts numerous eyewitness accounts from residents.
    type: evaluative
