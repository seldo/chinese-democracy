  on_topic: true
  description: BBC News article on the James Webb Space Telescope's confirmation of the earliest known galaxy, JADES-GS-z13-0,
    and the science behind measuring cosmic distances.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: JADES-GS-z13-0 is described as the most distant galaxy so far confirmed by gold-standard measurement.
    type: evaluative
    span: most distant galaxy" so far confirmed by gold-standard measurement
    span_verified: true
  - id: c2
    text: The galaxy is seen as it was about 325 million years after the Big Bang.
    type: numeric
    span: a mere 325 million years after the Big Bang
    span_verified: true
  - id: c3
    text: The observation corresponds to when the cosmos was only 2% of its current age, given a 13.8 billion year
      old Universe.
    type: numeric
    span: the Universe is 13.8 billion years old, it means we're observing JADES-GS-z13-0 when the cosmos was only
      2% of its current age
    span_verified: true
  - id: c4
    text: The previous record holder for most distant galaxy was GN-z11, detected by the Hubble Space Telescope.
    type: background
    span: Our previous "most distant galaxy" was detected by Webb's predecessor telescope, the veteran Hubble space
      observatory
    span_verified: true
  - id: c5
    text: GN-z11 was seen at a time when the Universe was only 400 million years old.
    type: numeric
    span: This galaxy was seen to be a little closer to us, at a time when the Universe was only 400 million years
      old
    span_verified: true
  - id: c6
    text: NASA's Webb observatory has been given the primary objective of finding the very first stars to light
      up the cosmos.
    type: attribution
    span: the US space agency Nasa's recently launched Webb observatory has been given the primary objective of
      finding the very first stars to light up the cosmos
    span_verified: true
  - id: c7
    text: The JADES galaxy has a redshift of 13.2.
    type: numeric
    span: the JADES galaxy has a redshift of 13.2
    span_verified: true
  - id: c8
    text: Astronomers use redshift as a measure of how light from a distant galaxy has been stretched to longer
      wavelengths by the expansion of the Universe.
    type: background
    span: It's essentially a measure of how the light coming from a far-off galaxy has been stretched to longer
      wavelengths by the expansion of the Universe
    span_verified: true
  - id: c9
    text: Photometry is a technique that estimates distance by studying the brightness and colour of galaxies using
      specific camera filters, but it is not always reliable.
    type: background
    span: Scientists can get reasonably good estimates by studying, in broad terms, the brightness and colour of
      their targets using a few specific filters
    span_verified: true
  - id: c10
    text: Spectroscopy is considered the gold-standard, more detailed technique in which light is split into component
      wavelengths to determine distance.
    type: evaluative
    span: astronomers prefer to use spectroscopy, a more detailed technique in which the light signal is split up
      into its component wavelengths
    span_verified: true
  - id: c11
    text: Both JADES-GS-z13-0 and GN-z11 have been confirmed through spectroscopy, while higher redshift numbers
      reported in recent months are based on photometry.
    type: attribution
    span: Both JADES-GS-z13-0 and GN-z11 have been confirmed through spectroscopy, the gold-standard approach
    span_verified: true
  - id: c12
    text: Webb's mirror is 6.5 metres wide.
    type: numeric
    span: its giant, 6.5m-wide mirror
    span_verified: true
  - id: c13
    text: Dr Curtis-Lake and her JADES colleagues spent hours collecting a mosaic of images in an old Hubble field
      of view.
    type: actor
    span: Dr Curtis-Lake and her JADES (JWST Advanced Deep Extragalactic Survey) colleagues spent hours collecting
      a mosaic of images in an old Hubble field of view
    span_verified: true
  - id: c14
    text: Dr Renske Smit of Liverpool John Moores University said the observed patch of sky is equivalent to viewing
      the eye of the Queen on a pound coin held at arm's length, and that within it Webb sees tens of thousands
      of galaxies.
    type: quote
    span: It's an incredibly small patch of sky - equivalent to viewing the eye of the Queen on a pound coin held
      at arm's length
    span_verified: true
  - id: c15
    text: Webb's NIRSpec instrument, provided by the European Space Agency, performs detailed analysis of faint
      light signals.
    type: attribution
    span: an incredibly powerful near-infrared spectrometer (NIRSpec) provided by the European Space Agency
    span_verified: true
  - id: c16
    text: NIRSpec uses a shutter array of 250,000 tiny doors, each only a few human hairs in width, to select objects
      for study.
    type: numeric
    span: a collection of 250,000 tiny doors, each only a few human hairs in width
    span_verified: true
  - id: c17
    text: The team chose 250 promising candidates within the observed patch, four of which turned out to be at stupendous
      distances.
    type: numeric
    span: the team chose 250 promising candidates, four of which turned out to be at stupendous distances
    span_verified: true
  - id: c18
    text: The four distant galaxies identified were JADES-GS-z13-0, JADES-GS-z12-0, JADES-GS-z11-0 and JADES-GS-z10-0.
    type: actor
    span: JADES-GS-z13-0 was the furthest away, but JADES-GS-z12-0, JADES-GS-z11-0 and JADES-GS-z10-0 weren't that
      far short
    span_verified: true
  - id: c19
    text: Prof Mark McCaughrean, ESA's senior scientific advisor, said this is what JWST was built to do and that
      the NIRSpec instrument lies at the heart of it.
    type: quote
    span: This is what JWST was built to do and the European-assembled NIRSpec instrument lies at the heart of it
    span_verified: true
  - id: c20
    text: McCaughrean said NIRSpec brings a kind of cosmic magnet to the haystack by efficiently examining hundreds
      of targets at a time.
    type: quote
    span: NIRSpec brings a kind of cosmic magnet to the haystack
    span_verified: true
