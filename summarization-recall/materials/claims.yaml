- doc_id: s024
  on_topic: true
  description: A Human Rights Watch report documenting apparent war crimes committed by Russian forces during their
    occupation of Bucha, Ukraine, from March 4-31, 2022.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Russian forces occupied Bucha, a town about 30 kilometers northwest of Kyiv, from March 4 to 31, 2022.
    type: numeric
    span: occupation of Bucha, a town about 30 kilometers northwest of Ukraine’s capital, Kyiv, from March 4 to
      31, 2022
    span_verified: true
  - id: c2
    text: Human Rights Watch researcher Richard Weir said 'Nearly every corner in Bucha is now a crime scene, and
      it felt like death was everywhere.'
    type: quote
    span: “Nearly every corner in Bucha is now a crime scene, and it felt like death was everywhere,” said Richard
      Weir
    span_verified: true
  - id: c3
    text: Human Rights Watch interviewed 32 Bucha residents in person and 5 others by phone.
    type: numeric
    span: interviewed 32 Bucha residents in person and 5 others by phone
    span_verified: true
  - id: c4
    text: The chief regional prosecutor in Bucha, Ruslan Kravchenko, told Human Rights Watch that 278 bodies had
      been found in the town since Russian forces withdrew.
    type: attribution
    span: 278 bodies had been found in the town since Russian forces withdrew, the vast majority of them civilians
    span_verified: true
  - id: c5
    text: Prior to the conflict, Bucha had a population of about 36,000.
    type: background
    span: Prior to the conflict, Bucha had a population of about 36,000
    span_verified: true
  - id: c6
    text: Funeral home worker Serhii Matiuk said he personally collected about 200 bodies from the streets, most
      with bullet wounds, and around 50 with hands tied and signs of torture.
    type: numeric
    span: he had personally collected about 200 bodies from the streets since the Russian invasion began
    span_verified: true
  - id: c7
    text: Human Rights Watch documented 16 apparently unlawful killings in Bucha, including nine summary executions
      and seven indiscriminate killings of civilians.
    type: numeric
    span: Human Rights Watch documented the details of 16 apparently unlawful killings in Bucha, including nine
      summary executions and seven indiscriminate killings of civilians
    span_verified: true
  - id: c8
    text: The Russian Defense Ministry denied that its forces killed civilians in Bucha, calling the evidence a
      'hoax, a staged production and provocation' by Kyiv authorities.
    type: quote
    span: claiming instead that the evidence of crimes was a “hoax, a staged production and provocation” by authorities
      in Kyiv
    span_verified: true
  - id: c9
    text: Russian forces first entered Bucha on February 27 but were pushed out, then returned on March 4 and largely
      took control by March 5.
    type: numeric
    span: On March 4, Russian forces returned, and largely took control of the town by March 5
    span_verified: true
  - id: c10
    text: Russian forces went door to door searching homes, claiming they were 'hunting Nazis.'
    type: evaluative
    span: Russian forces went door to door, searching residential buildings, claiming they were “hunting Nazis”
    span_verified: true
  - id: c11
    text: Family members of detained men were not told where their relatives were taken, which the report says amounts
      to an enforced disappearance under international law.
    type: attribution
    span: This amounts to an enforced disappearance, a crime under international law in all circumstances
    span_verified: true
  - id: c12
    text: Ukrainian de-mining authorities said they found victim-activated booby traps placed on at least two dead
      bodies.
    type: attribution
    span: Ukrainian de-mining authorities said they found victim-activated booby traps placed on at least two dead
      bodies
    span_verified: true
  - id: c13
    text: A senior Ukrainian police official announced on April 15 that authorities had identified 900 Ukrainian
      citizens across the Kyiv region killed by Russian forces during the occupation.
    type: numeric
    span: the authorities had identified 900 Ukrainian citizens across the Kyiv region who had been killed by Russian
      forces
    span_verified: true
  - id: c14
    text: Bucha's chief regional prosecutor told Human Rights Watch that over 600 bodies had been found across Bucha
      district, which has a population of about 362,000.
    type: numeric
    span: over 600 bodies had been found across Bucha district, which is within the Kyiv region and has a population
      of about 362,000
    span_verified: true
  - id: c15
    text: Human Rights Watch said Ukraine should urgently ratify the International Criminal Court treaty and become
      a formal member of the court.
    type: attribution
    span: Ukraine should urgently ratify the International Criminal Court (ICC) treaty and formally become a member
      of the court
    span_verified: true
  - id: c16
    text: Richard Weir said the victims of apparent war crimes in Bucha deserve justice and that authorities should
      prioritize preserving evidence.
    type: quote
    span: “The victims of apparent war crimes in Bucha deserve justice,” Weir said
    span_verified: true
  - id: c17
    text: Iryna described Russian soldiers taking her husband Oleh Abramov, then finding his body on the sidewalk
      with severe head wounds.
    type: quote
    span: I saw that he was lying with his face down, and blood was pumping out of his left ear
    span_verified: true
  - id: c18
    text: Russian forces detained Vasily Nedashkivskyi and his wife Tanya on or around March 17 after finding weapons
      in their home, and Vasily's body was later found showing signs of torture.
    type: actor
    span: Russian forces detained Vasily Nedashkivskyi, 47, and his wife Tanya, 57, on or around March 17
    span_verified: true
  - id: c19
    text: Human Rights Watch has also documented and received reports about other apparent war crimes in towns such
      as Andriivka, Hostomel, and Motyzhyn.
    type: background
    span: other apparent war crimes in other towns occupied by Russian forces, such as Andriivka, Hostomel, and
      Motyzhyn
    span_verified: true
  - id: c20
    text: Local authorities had exhumed more than 70 bodies from the church site as of April 14.
    type: numeric
    span: As of April 14, local authorities had exhumed more than 70 bodies from the church site
    span_verified: true
- doc_id: s025
  on_topic: true
  description: Amnesty International Q&A report on the December 2025–January 2026 Iranian protests and the government's
    deadly crackdown, internet shutdown, mass arrests, and executions.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Protests erupted in Iran on 28 December 2025.
    type: numeric
    span: Protests erupted in Iran on 28 December 2025
    span_verified: true
  - id: c2
    text: Since 8 January 2026, Iranian authorities cut all internet access to conceal their crimes.
    type: attribution
    span: since 8 January 2026, cut all internet access to conceal their crimes
    span_verified: true
  - id: c3
    text: Security forces involved in the crackdown include the IRGC (including Basij battalions), FARAJA police,
      and plain-clothes agents.
    type: actor
    span: security forces involved in the deadly crackdown include the Islamic Revolutionary Guard Corps (IRGC),
      including its Basij battalions and various divisions of Iran’s police force
    span_verified: true
  - id: c4
    text: Massacres of protesters occurred primarily on 8 and 9 January, when the death toll rose into the thousands.
    type: numeric
    span: massacres of protesters, primarily on 8 and 9 January, when the death toll rose into thousands
    span_verified: true
  - id: c5
    text: The protests began after a sharp collapse of Iran's currency amid soaring inflation and worsening living
      conditions.
    type: background
    span: a sharp collapse of Iran’s currency. This happened amid soaring inflation, state mismanagement of essential
      services, and worsening living conditions
    span_verified: true
  - id: c6
    text: The protests started with shopkeepers in Tehran's Grand Bazaar going on strike and closing shops.
    type: background
    span: The protests started with shopkeepers in Tehran’s Grand Bazaar going on strike and closing shops
    span_verified: true
  - id: c7
    text: According to the UN Fact-Finding Mission on Iran, protests reached all of Iran's 31 provinces.
    type: attribution
    span: According to the UN Fact-Finding Mission on Iran, protests reached all of Iran’s 31 provinces
    span_verified: true
  - id: c8
    text: On 3 January 2026, Iran's Supreme Leader Ali Khamenei denounced protesters as 'rioters' who should be
      'put in their place'.
    type: quote
    span: Ali Khamenei, denounced protesters as “rioters” who should be “put in their place”
    span_verified: true
  - id: c9
    text: Amnesty International identified at least 205 distinct body bags at a makeshift morgue in Kahrizak.
    type: numeric
    span: Amnesty International analysis of this evidence identified at least 205 distinct body bags at the site
    span_verified: true
  - id: c10
    text: A video showed a screen with a changing numerical counter of the deceased that reached 250.
    type: numeric
    span: In the video the counter reaches 250
    span_verified: true
  - id: c11
    text: On 17 January, Ali Khamenei said in a public speech that 'thousands of people' were killed.
    type: quote
    span: in a public speech, Ali Khamenei, the Supreme Leader, said “thousands of people” were killed
    span_verified: true
  - id: c12
    text: On 21 January, Iran's Supreme Council of National Security issued a statement that 3,117 people were killed
      during the uprising.
    type: numeric
    span: Supreme Council of National Security issued a statement that 3,117 people were killed during the uprising
    span_verified: true
  - id: c13
    text: On 16 January 2026, UN Special Rapporteur on Iran Mai Sato said at least 5,000 people had been killed,
      with the toll possibly as high as 20,000.
    type: quote
    span: the UN Special Rapporteur on Iran, Mai Sato, said in a media interview that at least 5,000 people had
      been killed
    span_verified: true
  - id: c14
    text: The current internet shutdown is the longest ever imposed by the authorities.
    type: evaluative
    span: The current internet shutdown is the longest ever imposed by the authorities
    span_verified: true
  - id: c15
    text: Tens of thousands of people, including children, have been arbitrarily detained according to independent
      reports received by Amnesty International.
    type: numeric
    span: tens of thousands of people, including children, have been arbitrarily detained
    span_verified: true
  - id: c16
    text: In September 2022, Jina Mahsa Amini, a 22-year-old woman, died in custody after being arrested by Iran's
      morality police.
    type: background
    span: In September 2022, 22-year-old woman, Jina Mahsa Amini, died in custody
    span_verified: true
  - id: c17
    text: Authorities have executed at least 11 people in connection with the Woman Life Freedom uprising, including
      Mojahed (Abbas) Kourkouri in June 2025.
    type: numeric
    span: Authorities have executed at least 11 people in connection with the Woman Life Freedom uprising, including
      Mojahed (Abbas) Kourkouri in June 2025
    span_verified: true
  - id: c18
    text: On 5 January 2026, the Head of the Judiciary ordered prosecutors to show 'no leniency' to protesters and
      to expedite their trials.
    type: quote
    span: the Head of the Judiciary ordered prosecutors to show “no leniency” to protesters and to expedite their
      trials
    span_verified: true
  - id: c19
    text: Amnesty International is urging UN member states to refer the situation in Iran to the International Criminal
      Court.
    type: attribution
    span: urging UN member states to refer the situation in Iran to the International Criminal Court
    span_verified: true
  - id: c20
    text: In November 2019, security forces unlawfully killed hundreds of protesters and bystanders during five
      days of protests amid a near-total internet shutdown.
    type: background
    span: security forces unlawfully killed hundreds of protesters and bystanders during five days of protests while
      authorities imposed a near total internet shutdown
    span_verified: true
