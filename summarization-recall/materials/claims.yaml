      Tour so it's never easy to play against him.'
    type: quote
    span: He's probably one of my best friends on Tour so it's never easy to play against him
    span_verified: true
  - id: c13
    text: Berrettini said on facing Hurkacz, 'It will be the first time for both of us on grass at Wimbledon...
      but I'm feeling confident.'
    type: quote
    span: It will be the first time for both of us on grass at Wimbledon. He beat Federer which means he's playing
      well but I'm feeling confident
    span_verified: true
  - id: c14
    text: Teenager Emma Raducanu, who reached the last 16 and was the last British player in singles action, was
      among 60,000 fans at Wembley for a football game.
    type: numeric
    span: Emma Raducanu, who reached the last 16 and was the last British player in singles' action, is among the
      60,000 cheering on the Three Lions
    span_verified: true
  - id: c15
    text: A journalist asked Roger Federer whether this would be his last Wimbledon and whether he would retire
      in the immediate future.
    type: quote
    span: A journalist has asked Roger Federer whether not only would this be his last Wimbledon, but whether he
      would be retiring in the immediate future
    span_verified: true
  - id: c16
    text: Federer said, 'No, it's just about having perspective. You need a goal when you're going through rehab
      with what I did.'
    type: quote
    span: No, it's just about having perspective. You need a goal when you're going through rehab with what I did
    span_verified: true
  - id: c17
    text: Federer said his initial goal was to play Wimbledon last year, but that never happened, plus the pandemic
      hit.
    type: background
    span: The initial goal, was to play last year, but that was never going to happen, plus the pandemic hit
    span_verified: true
  - id: c18
    text: BBC Sport commentator Andrew Cotter described Berrettini's win as 'his day' as he moved into the semi-finals.
    type: evaluative
    span: This was Berrettini's day and he moves on into the semi-finals
    span_verified: true
  - id: c19
    text: Berrettini held serve from 0-30 with strong serving, standing one game from the Wimbledon semi-finals.
    type: numeric
    span: From 0-30, Berrettini holds. The Italian stands one game from the Wimbledon semi-finals
    span_verified: true
