- doc_id: s001
  on_topic: true
  description: Human Rights Watch opinion piece urging Brazilian President Lula to raise human rights concerns during
    his planned trip to China.
  n_claims: 19
  n_span_verified: 13
  claims:
  - id: c1
    text: Foreign Affairs Minister Mauro Vieira called China 'an indispensable partner of Brazil' when asked about
      Lula's planned March visit.
    type: quote
    span: China is an indispensable partner of Brazil
    span_verified: true
  - id: c2
    text: Vieira said an important part of the trip would be the political signal it sends.
    type: quote
    span: political signal that will be given
    span_verified: true
  - id: c3
    text: During Lula's first terms in office, from 2003 to 2010, he embraced China as central to reforming what
      he considered an unjust global order.
    type: background
    span: from 2003 to 2010, he embraced China as central to reforming what he considered an unjust global order
    span_verified: true
  - id: c4
    text: Lula has pledged to strengthen BRICS and construct 'a new global order committed to multilateralism.'
    type: quote
    span: a new global order committed to multilateralism
    span_verified: true
  - id: c5
    text: The Brazilian constitution obligates the government to defend human rights as a pillar of foreign policy.
    type: background
    span: The Brazilian constitution obligates the government to defend human rights as a pillar of foreign policy
    span_verified: true
  - id: c6
    text: Under President Xi Jinping's leadership since 2013, the Chinese government has deepened repression across
      China.
    type: attribution
    span: Under President Xi Jinping\u2019s leadership since 2013, the Chinese government has deepened repression
      across China
    span_verified: false
  - id: c7
    text: In Xinjiang, authorities have arbitrarily detained and imprisoned an estimated one million Uyghurs in
      political education camps and prisons, where some are tortured.
    type: numeric
    span: arbitrarily detained and imprisoned an estimated one million Uyghurs in \u201cpolitical education camps\u201d
      and prisons
    span_verified: false
  - id: c8
    text: The UN human rights office says the abuses in Xinjiang 'may constitute international crimes, in particular
      crimes against humanity.'
    type: quote
    span: may constitute international crimes, in particular crimes against humanity
    span_verified: true
  - id: c9
    text: In February, Hong Kong authorities began the largest trial yet under a national security law, involving
      47 prominent former legislators, elected officials, and activists facing up to life in prison.
    type: numeric
    span: 47 prominent former legislators, elected officials, and activists face up to life in prison
    span_verified: true
  - id: c10
    text: The Chinese government has long prohibited independent labor unions, and in 2019 authorities arrested
      scores of young labor rights activists.
    type: numeric
    span: in 2019, the authorities arrested scores of young labor rights activists, including students
    span_verified: true
  - id: c11
    text: Brazil's previous administration under President Jair Bolsonaro did not speak out against China's deteriorating
      human rights record.
    type: attribution
    span: Brazil\u2019s previous administration of President Jair Bolsonaro did not speak out against China\u2019s
      deteriorating human rights record
    span_verified: false
  - id: c12
    text: In 2019, Bolsonaro's government declined to sign a joint statement at the UN condemning abuses in Xinjiang.
    type: numeric
    span: In 2019, it declined to sign on to a joint statement at the UN to condemn the abuses in Xinjiang
    span_verified: true
  - id: c13
    text: In 2022, Brazil abstained on a UN Human Rights Council resolution about discussing Xinjiang, which was
      defeated 17 votes for to 19 against.
    type: numeric
    span: The resolution was defeated by a narrow margin of 17 for to 19 against
    span_verified: true
  - id: c14
    text: The article states China is Brazil's most important trading partner.
    type: background
    span: China is Brazil\u2019s most important trading partner
    span_verified: false
  - id: c15
    text: The article states China has become the biggest lender and trading partner for many developing countries.
    type: background
    span: China has become the biggest lender and trading partner
    span_verified: true
  - id: c16
    text: China threatened to withhold Covid-19 vaccines if Ukraine voted for more scrutiny of rights abuses in
      Xinjiang at the Human Rights Council.
    type: attribution
    span: threatening to withhold Covid-19 vaccines if Ukraine voted for more scrutiny of rights abuses in Xinjiang
    span_verified: true
  - id: c17
    text: The article characterizes Hong Kong's national security law as 'draconian.'
    type: evaluative
    span: the largest trial yet under a draconian national security law
    span_verified: true
  - id: c18
    text: The article urges Lula, as someone who recently survived efforts to overthrow Brazil's democracy, to stand
      up for those who fight for democracy elsewhere.
    type: evaluative
    span: As someone who recently survived efforts to overthrow Brazil\u2019s democracy, President Lula should stand
      up for those who fight for democracy elsewhere
    span_verified: false
  - id: c19
    text: The article states Beijing is hollowing out Tibetans' language, culture, and religion and has rapidly
      dismantled Hong Kong's freedoms.
    type: attribution
    span: Beijing is also hollowing out Tibetans\u2019 language, culture, and religion, and has rapidly dismantled
      Hong Kong\u2019s freedoms
    span_verified: false
- doc_id: s002
  on_topic: true
  description: Amnesty International report/statement on the third anniversary of the UN's 2022 report on human
    rights violations against Uyghurs in Xinjiang, China.
  n_claims: 19
  n_span_verified: 18
  claims:
  - id: c1
    text: Families of detainees in the Xinjiang Uyghur Autonomous Region told Amnesty International of continued
      suffering three years after a major UN report.
    type: attribution
    span: Families of detainees in the Xinjiang Uyghur Autonomous Region have told Amnesty International of their
      continued suffering
    span_verified: true
  - id: c2
    text: On 31 August 2022, the UN Office of the High Commissioner for Human Rights released an assessment on the
      Uyghur region.
    type: numeric
    span: On 31 August 2022, the UN Office of the High Commissioner for Human Rights (OHCHR) released a historic
      assessment
    span_verified: true
  - id: c3
    text: The UN report concluded that serious human rights violations may constitute crimes against humanity.
    type: evaluative
    span: serious human rights violations in the Uyghur region “may constitute international crimes, in particular
      crimes against humanity”
    span_verified: true
  - id: c4
    text: In a 2021 report, Amnesty International found that China's treatment of Muslim ethnic minorities amounted
      to crimes against humanity.
    type: actor
    span: In a major report published in 2021, Amnesty International also found that China’s treatment of Muslim
      ethnic minorities in the Uyghur region amounted to crimes against humanity
    span_verified: true
  - id: c5
    text: The international community and the UN have yet to act on the report's findings.
    type: attribution
    span: the international community and the UN has yet to act on these findings
    span_verified: true
  - id: c6
    text: The Chinese government continues to intimidate and silence victims' families and maintain repressive laws
      and policies.
    type: attribution
    span: The Chinese government also continues to intimidate and silence victims’ families, and maintain repressive
      laws and policies in the region
    span_verified: true
  - id: c7
    text: Sarah Brooks, Amnesty International's China Director, said it is shameful that the international community
      has failed to act three years after the UN report.
    type: quote
    span: “Three years after the UN report concluded that China was responsible for grave human rights violations
      in Xinjiang, it is shameful that the international community has failed to act,” said Sarah Brooks
    span_verified: true
  - id: c8
    text: Sarah Brooks said lives have been ruined, families separated and communities dismantled by the Chinese
      authorities' continuing cruelty.
    type: quote
    span: Lives have been ruined, families separated and communities dismantled by the Chinese authorities’ continuing
      cruelty
    span_verified: true
  - id: c9
    text: In 2021, Amnesty International's global petition was signed by more than 323,000 people across 184 countries
      and territories.
    type: numeric
    span: a global petition – signed by more than 323,000 people across 184 countries and territories
    span_verified: false
  - id: c10
    text: The petition called for the release of hundreds of thousands of Muslim minority men and women arbitrarily
      detained in the Uyghur region.
    type: evaluative
    span: called for the release of the hundreds of thousands of Muslim minority men and women arbitrarily detained
      and subjected to mass internment, torture and persecution
    span_verified: true
  - id: c11
    text: 'From January to August 2025, Amnesty International contacted families and sources for 126 individuals
      featured in its #FreeXinjiangDetainees campaign.'
    type: numeric
    span: 'Amnesty International contacted families and sources for 126 individuals featured in the organization’s
      #FreeXinjiangDetainees campaign'
    span_verified: true
  - id: c12
    text: Patime said global attention that peaked around the UN report has faded and China has faced little meaningful
      consequence.
    type: quote
    span: The global attention that peaked around the report has faded, and China has faced little meaningful consequence
    span_verified: true
  - id: c13
    text: Patime said her family has been completely cut off from her relative in prison since June 2018.
    type: quote
    span: We have been completely cut off from him since June 2018
    span_verified: true
  - id: c14
    text: Mamatjan Juma said his brother Ahmetjan is still in prison and he doesn't know if he is safe, healthy,
      or alive.
    type: quote
    span: whose brother Ahmetjan is still in prison, said the lack of updates makes everyday life difficult
    span_verified: true
  - id: c15
    text: Nefise Oğuz, whose uncle Alim remains in prison, called for real, concrete action from the international
      community.
    type: quote
    span: I want real, concrete action from the international community, not just words
    span_verified: true
  - id: c16
    text: Medine Nazimi, whose sister Mevlüde remains deprived of her liberty, said what is happening to Uyghurs
      is a human rights crisis and a crime against humanity.
    type: quote
    span: What is happening to Uyghurs is not a domestic matter, it is a human rights crisis and a crime against
      humanity
    span_verified: true
  - id: c17
    text: Amnesty International calls on the High Commissioner to provide a public update on the report and urges
      UN member states to condemn China's violations.
    type: attribution
    span: Amnesty International calls on the High Commissioner to provide a public update on the report, and once
      again urges UN member states to condemn China’s serious human rights violations
    span_verified: true
  - id: c18
    text: Amnesty urges establishing an independent, international investigative mechanism to ensure accountability.
    type: evaluative
    span: reiterate the critical importance of establishing an independent, international investigative mechanism
      to ensure accountability
    span_verified: true
  - id: c19
    text: Member states must support effective access to justice and remedies, including reparations for victims
      and survivors.
    type: background
    span: Member states must also support effective access to justice and remedies, including reparations for victims
      and survivors
    span_verified: true
- doc_id: s005
  on_topic: true
  description: AP news article about Hong Kong pro-independence activist Tony Chung fleeing to Britain to seek asylum
    after imprisonment under the national security law.
  n_claims: 20
  n_span_verified: 19
  claims:
  - id: c1
    text: Tony Chung fled to Britain to seek political asylum, according to his social media posts on Friday.
    type: actor
    span: has fled to Britain to seek political asylum, according to his social media posts on Friday
    span_verified: true
  - id: c2
    text: Chung was among the first people convicted under the Beijing-imposed national security law.
    type: background
    span: was among the first people convicted under the Beijing-imposed law introduced after the 2019 pro-democracy
      protests
    span_verified: true
  - id: c3
    text: He was found guilty of secession and money laundering in 2020 and sentenced to 43 months in prison.
    type: numeric
    span: found guilty of secession and money laundering in 2020 and sentenced to 43 months in prison
    span_verified: true
  - id: c4
    text: The article characterizes the treatment of dissidents like Chung as reflecting a drastic erosion of freedoms
      promised to Hong Kong when it returned to China in 1997.
    type: evaluative
    span: reflects the drastic erosion of the freedoms promised to the former British colony when it returned to
      China in 1997
    span_verified: true
  - id: c5
    text: Both Beijing and Hong Kong have hailed the security law as bringing stability to the city.
    type: evaluative
    span: both Beijing and Hong Kong have hailed the security law as bringing stability to the city
    span_verified: true
  - id: c6
    text: Chung was under a supervision order after release from prison and was banned from public speaking.
    type: attribution
    span: he was under a supervision order after his release from prison, banned from public speaking
    span_verified: true
  - id: c7
    text: Authorities offered to pay Chung for information about others to prove he had reformed himself.
    type: attribution
    span: The authorities offered to pay him for information about others to prove he had reformed himself
    span_verified: true
  - id: c8
    text: Chung was made to sign a document barring him from disclosing his conversations with authorities.
    type: attribution
    span: Chung said he was made to sign a document that barred him from disclosing his conversations with the authorities
    span_verified: true
  - id: c9
    text: Chung said, 'Under enormous stress and fear, I can only endure silently.'
    type: quote
    span: Under enormous stress and fear, I can only endure silently
    span_verified: true
  - id: c10
    text: Chung began getting sick in October and doctors told him his immune system was compromised due to massive
      mental stress.
    type: numeric
    span: He started getting sick in October and doctors told him his immune system was compromised due to massive
      mental stress
    span_verified: true
  - id: c11
    text: Chung arrived in Britain from Japan on Wednesday to seek asylum.
    type: numeric
    span: He arrived in Britain from Japan on Wednesday to seek asylum
    span_verified: true
  - id: c12
    text: Chung was convenor of the now-dissolved pro-independence student organization Studentlocalism before his
      2020 arrest near the U.S. Consulate in Hong Kong.
    type: actor
    span: Chung was convenor of the now-dissolved pro-independence student organization Studentlocalism before being
      arrested in 2020 near the United States Consulate
    span_verified: true
  - id: c13
    text: Leung Kin-ip, Hong Kong's deputy commissioner of the Correctional Services Department, condemned Chung
      for 'evading responsibility' and publishing comments 'endangering national security.'
    type: quote
    span: condemned Chung for “evading responsibility” and publishing comments “endangering national security”
    span_verified: true
  - id: c14
    text: A recall order has been issued for Chung to be brought back to prison to serve his remaining sentence.
    type: attribution
    span: a recall order has been issued for Chung to be brought back to prison to serve his remaining sentence
    span_verified: true
  - id: c15
    text: Leung said, 'This is a breach of trust. He lied to us that he would travel. This is very bad.'
    type: quote
    span: This is a breach of trust. He lied to us that he would travel. This is very bad
    span_verified: true
  - id: c16
    text: Hong Kong police said in an email that fleeing individuals have 'shamefully begged for assistance from
      foreign anti-China forces under the guise of being victims.'
    type: quote
    span: they have also shamefully begged for assistance from foreign anti-China forces under the guise of being
      victims
    span_verified: true
  - id: c17
    text: Hong Kong police offered rewards for data leading to the arrests of 13 overseas-based activists, drawing
      criticism from Western governments.
    type: numeric
    span: Hong Kong police offered rewards for data leading to the arrests of 13 overseas-based activities and drew
      criticism from Western governments
    span_verified: true
  - id: c18
    text: Pro-democracy activist Agnes Chow, who left Hong Kong for Canada, reported similar pressure from authorities
      earlier in December.
    type: actor
    span: prominent pro-democracy activist Agnes Chow, who left Hong Kong for Canada, doesn’t plan to return to
      fulfill her bail conditions, reported similar pressure from authorities
    span_verified: false
  - id: c19
    text: Hong Kong police said Agnes Chow failed to show up at a police station on Thursday as required and violated
      her bail terms, and that police would 'spare no effort in bringing her to justice.'
    type: quote
    span: the police would “spare no effort in bringing her to justice”
    span_verified: true
  - id: c20
    text: Chung said he would devote himself to his city as a 'Hong Konger in exile' and believes 'the seeds of
      freedom and democracy will sprout again one day.'
    type: quote
    span: I believe only when Hong Kong people don’t give up, the seeds of freedom and democracy will sprout again
      one day
    span_verified: true
- doc_id: s006
  on_topic: true
  description: A Human Rights Watch report ('Locked Doors') on HIV/AIDS in China, documenting the epidemic's scale,
    government cover-ups, discrimination, and human rights abuses against people living with HIV/AIDS.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: A foreign tourist visiting southeast China in 1985 became the first person in the country diagnosed with
      HIV/AIDS.
    type: numeric
    span: In 1985, a foreign tourist visiting southeast China became the first person in the country to be diagnosed
    span_verified: true
  - id: c2
    text: China faces what could be the largest AIDS epidemic in the world, affecting at least 1.5 million men,
      women, and children.
    type: numeric
    span: affecting at least 1.5 million men, women, and children
    span_verified: true
  - id: c3
    text: Local authorities minimized the epidemic in order to protect external investment in local economies.
    type: attribution
    span: local authorities have minimized the epidemic in order to protect external investment in local economies
    span_verified: true
  - id: c4
    text: During the 1990s, local authorities were complicit in transmitting HIV to hundreds of thousands or millions
      of villagers through an unsanitary but profitable blood collection industry.
    type: attribution
    span: local authorities were also complicit in the transmission of HIV to hundreds of thousands or even millions
      of villagers through an unsanitary but highly profitable blood collection industry
    span_verified: true
  - id: c5
    text: In Henan province in the 1990s, perhaps one million people were infected with HIV through shoddy practices
      at blood collection centers.
    type: numeric
    span: In Henan province in the 1990s, perhaps one million people were infected with HIV through shoddy practices
      at blood collection centers
    span_verified: true
  - id: c6
    text: Infections occurred when blood remaining after plasma extraction was combined and reinjected into the
      original donors.
    type: background
    span: Infections occurred when the blood remaining after extraction of the plasma was combined and reinjected
      into the original donors
    span_verified: true
  - id: c7
    text: Journalists, doctors, and AIDS activists who tried to reveal the truth about Henan were harassed, expelled,
      or detained and interrogated by police.
    type: attribution
    span: Journalists, doctors, and AIDS activists who subsequently tried to reveal the truth were harassed, expelled
      from the province, or detained and interrogated by police
    span_verified: true
  - id: c8
    text: Chinese government documents reveal that Henan was just one of seven central Chinese provinces where similar
      blood collection practices fuelled the spread of HIV/AIDS.
    type: numeric
    span: Henan was justone of seven central Chinese provinces where similar blood collection practices fuelled
      the spread of HIV/AIDS
    span_verified: true
  - id: c9
    text: To date, no government official has been prosecuted for the blood-collection scandal.
    type: attribution
    span: To date no government official has been prosecuted for the scandal
    span_verified: true
  - id: c10
    text: China estimates that 260,000 children may be orphaned by HIV/AIDS by 2010.
    type: numeric
    span: China also estimates that 260,000 children11 may be orphaned by HIV/AIDS by 2010
    span_verified: true
  - id: c11
    text: AIDS activists and NGO workers in Henan estimate that as many as a million children in that province alone
      are or will become orphans as a result of the blood collection disaster.
    type: numeric
    span: AIDS activists and NGO workers in Henan estimate that as many as a million children in that province alone
      are or will become orphans
    span_verified: true
  - id: c12
    text: In Yunnan, Human Rights Watch discovered that the door to a hospital AIDS ward was actually closed and
      padlocked.
    type: actor
    span: In Yunnan, Human Rights Watch discovered that the door to a hospital AIDS ward was actually closed and
      padlocked
    span_verified: true
  - id: c13
    text: The report, titled 'Locked Doors,' draws on fieldwork in Yunnan province, Beijing, and Hong Kong, as well
      as archival research.
    type: background
    span: It draws on fieldwork in Yunnan province, Beijing, and Hong Kong, as well as archival research, to document
      human rights issues related to China's HIV/AIDS epidemic
    span_verified: true
  - id: c14
    text: Public security officials have the authority to consign a suspected drug user without trial to a prison-like
      forced detoxification center.
    type: attribution
    span: Public security officials have the authority to consign a suspected user without trial to a prison-like
      forced detoxification center
    span_verified: true
  - id: c15
    text: Detainees in detoxification centers are tested for HIV without their knowledge and without being informed
      of the results or given appropriate counseling.
    type: attribution
    span: Detainees are tested for HIV without their knowledge and, perhaps most disturbing, without being informed
      of the results and given appropriate counseling
    span_verified: true
  - id: c16
    text: Zhang, a person living with HIV and an AIDS activist, said that people living with HIV have many psychological,
      medical, and legal needs but many just stay at home for years.
    type: quote
    span: They have many needs—psychological, medical, and legal—but many people just stay at home for years and
      years
    span_verified: true
  - id: c17
    text: Han, who runs a small-scale local counseling service, said 'They call, they get tested, and they hide,'
      describing the life of an AIDS sufferer as 'a very lonely one.'
    type: quote
    span: They call, they get tested, and they hide," said Han, who runs a small-scale, local counseling service
    span_verified: true
  - id: c18
    text: During the SARS epidemic, China fired the Minister of Health, the mayor of Beijing, and more than 100
      health officials for covering up and under-reporting infection rates.
    type: numeric
    span: firing the Minister of Health, the mayor of Beijing, and more than 100 health officials for covering up
      and under-reporting SARS infection rates
    span_verified: true
  - id: c19
    text: The SARS outbreak in 2003 led, after a fitful start, to the full mobilization of the state to bring the
      disease under control, unlike the treatment of HIV/AIDS.
    type: evaluative
    span: the outbreak of severe acute respiratory syndrome (SARS) in 2003 led, after a fitful start, to the full
      mobilization of the state to bring that deadly disease under control
    span_verified: true
  - id: c20
    text: The report describes the experience of being HIV-positive in China as like encountering a series of locked
      doors.
    type: evaluative
    span: This locked door may in fact be emblematic of the experience of being HIV-positive in China, which is
      like encountering a series of locked doors
    span_verified: true
- doc_id: s004
  on_topic: true
  description: BBC analysis piece comparing patterns across modern revolutions from Iran to Egypt, examining common
    triggers and dynamics of regime collapse.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Trotsky remarked that if poverty caused revolutions, there would be revolutions all the time because most
      people in the world were poor.
    type: quote
    span: Trotsky once remarked that if poverty was the cause of revolutions, there would be revolutions all the
      time
    span_verified: true
  - id: c2
    text: Violent death has been the most common catalyst for radicalising discontent in revolutions over the last
      30 years.
    type: evaluative
    span: Violent death has been the most common catalyst for radicalising discontent in the revolutions of the
      last 30 years
    span_verified: true
  - id: c3
    text: Hundreds died in a mass incineration at an Iranian cinema in 1978, blamed on the Shah's secret police.
    type: numeric
    span: the mass incineration of hundreds in an Iranian cinema in 1978 blamed on the Shah's secret police
    span_verified: true
  - id: c4
    text: Vegetable salesman Mohammed Bouazizi's self-immolation in Tunisia in December 2010 caught the imagination
      of the country.
    type: actor
    span: vegetable salesman Mohammed Bouazizi in Tunisia, in December 2010, catches the imagination of a country
    span_verified: true
  - id: c5
    text: Claims that Communist secret police had beaten two students to death in Prague in November 1989 helped
      fire up public disillusionment.
    type: attribution
    span: the claims the Communist secret police had beaten two students to death in Prague in November, 1989
    span_verified: true
  - id: c6
    text: Reports that Milosevic had had his predecessor, Ivan Stambolic, 'disappeared' before the 2000 Yugoslav
      presidential elections helped crystallise Serbian rejection of his regime.
    type: attribution
    span: Reports that Milosevic had had his predecessor, Ivan Stambolic, "disappeared" in the weeks before the
      Yugoslav presidential elections in 2000
    span_verified: true
  - id: c7
    text: In China in April 1989, students in Beijing hijacked mourning for former Communist leader Hu Yaobang to
      occupy Tiananmen Square and protest against the Party's corruption and dictatorship.
    type: background
    span: students in Beijing hijacked the officially-sponsored mourning for the former Communist leader, Hu Yaobang,
      to occupy Tiananmen Square
    span_verified: true
  - id: c8
    text: The Chinese crisis set the template for staging protests and occupying symbolic city-centre squares but
      was also the most obvious failure of 'People Power'.
    type: evaluative
    span: it also was the most obvious failure of "People Power"
    span_verified: true
  - id: c9
    text: Deng Xiaoping's regime, which had made a billion Chinese peasants better off, used soldiers to shoot down
      the Tiananmen crowds.
    type: actor
    span: His regime had made a billion Chinese peasants better off. They were the soldiers sent to shoot down the
      crowds
    span_verified: true
  - id: c10
    text: Protests against Suharto's 're-election' in Indonesia in March 1998 culminated in the shooting of four
      students in May, escalating into violence that killed more than 1,000 people.
    type: numeric
    span: the shooting of four students in May, which set off a round of bigger demonstrations and more violence
      until more than 1,000 were dead
    span_verified: true
  - id: c11
    text: After 32 years in power, corruption and the Asian economic crisis had imploded support for Suharto's regime.
    type: background
    span: After 32 years in power, his family and their cronies were too rich, while too many former backers were
      getting poorer
    span_verified: true
  - id: c12
    text: The article states that what collapses a regime is when insiders—police, army and senior officials—turn
      against it.
    type: evaluative
    span: What collapses a regime is when insiders turn against it
    span_verified: true
  - id: c13
    text: Tunisia's Ben Ali decided to flee when his generals told him they would not shoot into the crowds.
    type: attribution
    span: Tunisia's Ben Ali decided to flee when his generals told him they would not shoot into the crowds
    span_verified: true
  - id: c14
    text: In Romania in December 1989, Ceausescu lived to see the general he relied on to crush protesters become
      his chief judge at his trial on Christmas Day.
    type: numeric
    span: Ceausescu lived to see the general he relied on to crush the protesters become his chief judge at his
      trial on Christmas Day
    span_verified: true
  - id: c15
    text: In 1989, Soviet leader Mikhail Gorbachev's refusal to use the Red Army to back East European Communists
      made local generals realise force was not an option.
    type: attribution
    span: the refusal of the Soviet leader, Mikhail Gorbachev, to use the Red Army to back East European Communists
      facing protests in the streets
    span_verified: true
  - id: c16
    text: The United States has repeatedly pressed its authoritarian allies to compromise and then to resign once
      they started down that path.
    type: actor
    span: The United States has repeatedly pressed its authoritarian allies to compromise and then, once they have
      started on that slippery slope, to resign
    span_verified: true
  - id: c17
    text: The article argues that revolutions are 24-hour-a-day events requiring stamina and quick thinking from
      both protesters and dictators.
    type: quote
    span: Revolutions are 24-hour-a day events - they require stamina and quick thinking from both protesters and
      dictators
    span_verified: true
  - id: c18
    text: In 2003, Georgia's Shevardnadze was denounced by some as a 'Ceausescu' but was left alone in his villa
      after resigning.
    type: actor
    span: Georgia's Shevardnadze was denounced by some as a "Ceausescu" but he was let alone in his villa after
      he resigned
    span_verified: true
  - id: c19
    text: Suharto's generals ensured he retired to die in peace a decade later, but his son 'Tommy' was imprisoned.
    type: numeric
    span: Suharto's generals had ensured he retired to die in peace a decade later - but his son "Tommy" was imprisoned
    span_verified: true
  - id: c20
    text: The timeline lists Egypt's revolution as occurring from 25 January to 11 February 2011.
    type: numeric
    span: 'Egypt: 25 Jan - 11 Feb 2011'
    span_verified: true
- doc_id: s008
  on_topic: true
  description: Testimony/briefing by Elliott Abrams, Chairman of the U.S. Commission on International Religious
    Freedom, to a Congressional Caucus on May 15, 2001, regarding religious freedom conditions in China.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Elliott Abrams served as Chairman of the U.S. Commission on International Religious Freedom, with his
      term expiring May 14, 2001.
    type: actor
    span: served as the Chairman for the U.S. Commission on International Religious Freedom
    span_verified: true
  - id: c2
    text: The remarks were based on the Commission's second annual report, released April 30, 2001.
    type: background
    span: released on April 30, 2001 and can be found on the Commission's web site
    span_verified: true
  - id: c3
    text: There has been a marked deterioration in religious freedom protection in China since the Commission's
      May 2000 report and since Congress approved PNTR.
    type: evaluative
    span: marked deterioration in the protection of religious freedom in China since the Commission's May 2000 report
    span_verified: true
  - id: c4
    text: The PRC government has allegedly been involved in confiscating and destroying up to 3,000 unregistered
      religious buildings and sites in southeastern China.
    type: numeric
    span: confiscation and destruction of up to 3,000 unregistered religious buildings and sites in southeastern
      China
    span_verified: true
  - id: c5
    text: An 'Office for Preventing and Handling Cults' was established in September 2000 under the State Council
      to coordinate the campaign against Falun Gong.
    type: attribution
    span: An "Office for Preventing and Handling Cults" was established in September 2000 under the State Council
    span_verified: true
  - id: c6
    text: According to the Falun Gong organization, 197 followers have died in police custody or from police torture
      since the second half of 1999.
    type: quote
    span: 197 followers have died while in police custody or as a result of police torture
    span_verified: true
  - id: c7
    text: On October 1, 2000, China's National Day, security forces beat and detained hundreds, perhaps up to 1,000,
      Falun Gong practitioners demonstrating in Tiananmen Square.
    type: numeric
    span: security forces beat and detained hundreds of Falun Gong practitioners (perhaps up to 1,000)
    span_verified: true
  - id: c8
    text: A U.S.-resident Falun Gong practitioner was arrested in November and sentenced in December to three years
      in prison on charges of providing national security information to foreigners.
    type: numeric
    span: she was sentenced to three years in prison
    span_verified: true
  - id: c9
    text: A Canadian citizen was sentenced to three years of re-education through labor for practicing Falun Gong
      and was reportedly tortured before release in January 2001.
    type: numeric
    span: a Canadian citizen was sentenced to three years of re-education through labor for practicing Falun Gong
    span_verified: true
  - id: c10
    text: The Washington Post reported that the Chinese government arrested a Roman Catholic bishop and several
      priests in April 2001.
    type: attribution
    span: the Washington Post reported that the Chinese government arrested a Roman Catholic bishop and several
      priests in April 2001
    span_verified: true
  - id: c11
    text: In November-December 2000, local officials destroyed, closed, or confiscated approximately 400 unregistered
      Protestant and Catholic church buildings in the Wenzhou area of Zhejiang province.
    type: numeric
    span: approximately 400 unregistered Protestant and Catholic church buildings in the Wenzhou area
    span_verified: true
  - id: c12
    text: The Vatican canonized 120 saints with ties to China on October 1, 2000, including 87 killed during the
      1900 Boxer Rebellion, straining relations with the Chinese government.
    type: numeric
    span: canonize on October 1, 2000 (the anniversary of the founding of the PRC) 120 saints with ties to China
    span_verified: true
  - id: c13
    text: According to Human Rights Watch, at least 24 Uighur Muslims were executed in 2000 for political crimes.
    type: numeric
    span: at least 24 Uighur Muslims were executed
    span_verified: true
  - id: c14
    text: The Tibet Information Network reported that monks and nuns comprised 74 percent of the 266 Tibetan political
      prisoners identified as of January 2001.
    type: numeric
    span: monks and nuns comprised 74 percent of the 266 Tibetan political prisoners
    span_verified: true
  - id: c15
    text: The State Department reported that Tibetan monks and nuns are required to undergo 'patriotic education'
      and renounce the Dalai Lama and the Dalai Lama-recognized Panchen Lama.
    type: quote
    span: monks are forced to renounce the Dalai Lama and the Dalai Lama-recognized Panchen Lama
    span_verified: true
  - id: c16
    text: The Commission recommended in its May 2000 report that Congress grant China PNTR status only after substantial
      improvements in religious freedom, but Congress approved PNTR without such preconditions.
    type: attribution
    span: Congress has approved PNTR status for China without any such religious-freedom preconditions
    span_verified: true
  - id: c17
    text: The Chinese government refused the Commission's request for an invitation to visit China, calling the
      proposed visit 'highly inappropriate'.
    type: quote
    span: rejecting the Commission's proposed visit as "highly inappropriate"
    span_verified: true
  - id: c18
    text: The Commission wrote to Secretary of State Colin L. Powell in February 2001 urging him to initiate a China
      resolution at the UNCHR session.
    type: actor
    span: the Commission wrote Secretary of State Colin L. Powell urging him to initiate a China resolution
    span_verified: true
  - id: c19
    text: In April 2001, the U.S. sponsored a China resolution at the UNCHR meeting, but efforts once again failed
      to defeat China's bid to stifle debate on it.
    type: attribution
    span: the U.S. government sponsored a China resolution at the UNCHR meeting, but once again U.S. efforts failed
      to defeat China's bid to stifle debate
    span_verified: true
  - id: c20
    text: The United States was not reelected as a voting member of the UNCHR this year, a body it had served on
      since its creation in 1947.
    type: numeric
    span: the United States was not reelected as a voting member of the UNCHR this year
    span_verified: true
- doc_id: s010
  on_topic: true
  description: Guardian article reporting on an unreleased UN human rights council document demanding China release
    detained human rights activists Hu Shigen, Zhou Shifeng, and Xie Yang and pay compensation.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: The UN has demanded China immediately release prominent human rights activists from detention and pay
      them compensation, according to an unreleased document obtained by the Guardian.
    type: attribution
    span: has demanded that China should immediately release prominent human rights activists from detention and
      pay them compensation
    span_verified: true
  - id: c2
    text: The report is from the UN's human rights council and says the trio had their rights violated and calls
      China's laws incompatible with international norms.
    type: attribution
    span: from the UN’s human rights council says the trio had their rights violated and calls China’s laws incompatible
      with international norms
    span_verified: true
  - id: c3
    text: Hu Shigen, Zhou Shifeng and Xie Yang were detained and tried as part of a nationwide crackdown on human
      rights attorneys that began in July 2015.
    type: numeric
    span: an unprecedented nationwide crackdown on human rights attorneys and activists that began in July 2015
    span_verified: true
  - id: c4
    text: The operation saw nearly 250 people detained and questioned by police.
    type: numeric
    span: The operation saw nearly 250 people detained and questioned by police
    span_verified: true
  - id: c5
    text: Hu was jailed for seven and a half years and Zhou was sentenced to seven years on subversion charges,
      while Xie is awaiting a verdict.
    type: numeric
    span: Hu was jailed for seven and a half years and Zhou was sentenced to seven years on subversion charges
    span_verified: true
  - id: c6
    text: The UN report said the appropriate remedy would be to release the three men immediately and give them
      an enforceable right to compensation, with China urged to act within six months.
    type: quote
    span: The appropriate remedy would be to release Hu Shigen, Zhou Shifeng and Xie Yang immediately, and accord
      them an enforceable right to compensation
    span_verified: true
  - id: c7
    text: The UN's working group on arbitrary detention rejected Chinese government claims that the men voluntarily
      confessed at their trials.
    type: attribution
    span: rejected Chinese government claims the three men voluntarily confessed to their crimes at their trials
    span_verified: true
  - id: c8
    text: The working group is a panel of five experts under the UN's human rights council, of which China is a
      member, and its judgements are not legally binding.
    type: background
    span: The group is a panel of five experts that falls under the UN’s human rights council, of which China is
      a member
    span_verified: true
  - id: c9
    text: China promised to cooperate with the group when it ran for a seat on the human rights council in August
      2016.
    type: numeric
    span: China promised to cooperate with the group when it ran for a seat on the human rights council in August
      2016
    span_verified: true
  - id: c10
    text: The report said the trio were denied access to legal counsel, held in incommunicado detention, and their
      families were not informed of their whereabouts for several months.
    type: quote
    span: being denied access to legal counsel, being held in “incommunicado detention” and their families “were
      not informed of their whereabouts for several months”
    span_verified: true
  - id: c11
    text: Xie's wife Chen Guiqiu said state security agents rented a flat across from his and he has 12 guards stationed
      24 hours a day outside his building.
    type: quote
    span: State security agents rented a flat across the hall from his and Xie has 12 guards stationed 24-hours
      a day outside his building
    span_verified: true
  - id: c12
    text: Chen Guiqiu welcomed the UN's report, saying she felt vindicated and that her husband's arrest was completely
      illegal.
    type: quote
    span: his arrest was completely illegal and I’m glad the UN, a very objective party that represents the international
      community, can see that
    span_verified: true
  - id: c13
    text: Xie's legal team said he was beaten and forced into stress positions during his detention, with an interrogator
      saying they would torture him to death like an ant.
    type: quote
    span: We’ll torture you to death just like an ant
    span_verified: true
  - id: c14
    text: Ambassadors from countries including Australia, Canada, France, Germany and the UK wrote to China's minister
      of public security in February raising concerns over torture claims.
    type: actor
    span: Ambassadors from countries including Australia, Canada, France, Germany and the United Kingdom, wrote
      to China’s minister of public security in February
    span_verified: true
  - id: c15
    text: Frances Eve, a researcher at the Network of Chinese Human Rights Defenders, said the working group's opinion
      shows the arrests were about retaliation against lawyers for protecting human rights.
    type: quote
    span: the arrests were always about retaliation against lawyers for protecting human rights
    span_verified: true
  - id: c16
    text: The Chinese government claimed the men were jailed for long engaging in criminal activities aimed at subverting
      the national system, a claim the UN rejected.
    type: attribution
    span: long been engaged in criminal activities, aimed at subverting the basic national system established under
      the China’s [sic] constitution
    span_verified: true
  - id: c17
    text: Critics say Hu was arrested for leading an underground church and he previously spent 16 years in prison
      for distributing leaflets on the 1989 Tiananmen Square protests.
    type: background
    span: He previously spent 16 years in prison for distributing leaflets on the 1989 Tiananmen Square protests
      and subsequent bloody crackdown
    span_verified: true
  - id: c18
    text: Zhou founded the Fengrui law firm, which was at the centre of the 2015 government 'war on law' and represented
      Ai Weiwei and Falun Gong members.
    type: background
    span: founded the Fengrui law firm that was at the centre of the 2015 government “war on law”
    span_verified: true
  - id: c19
    text: The UN's working group previously told China to release Liu Xia, wife of Nobel peace prize laureate Liu
      Xiaobo, who died in detention in July.
    type: background
    span: previously told China to release Liu Xia, the wife of the Nobel peace prize laureate Liu Xiaobo, who died
      in detention in July
    span_verified: true
  - id: c20
    text: Liu Xia has been under house arrest since 2010, when her husband won the Nobel prize, despite never being
      charged with a crime.
    type: numeric
    span: Liu Xia has been under house arrest since 2010, when her husband won the prize, despite never being charged
      with a crime
    span_verified: true
- doc_id: s009
  on_topic: true
  description: A political analysis article (BBC-style) discussing the legislative challenges facing US Democrats
    and President Biden in December, covering the Build Back Better bill, debt ceiling, defence authorisation, and
    China competitiveness legislation.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: For the past 10 months Democrats have controlled the presidency and both chambers of Congress but face
      strong political headwinds.
    type: background
    span: for the past 10 months has controlled the presidency and both chambers of Congress but finds it's moving
      against strong political headwinds
    span_verified: true
  - id: c2
    text: Democrats have realized significant achievements including a massive Covid relief bill and a historic
      level of infrastructure funding.
    type: evaluative
    span: a massive Covid relief bill and a historic level of infrastructure funding
    span_verified: true
  - id: c3
    text: Republicans could take back control of at least the House of Representatives at the start of 2023.
    type: numeric
    span: Republicans could take back control of at least the House of Representatives at the start of 2023
    span_verified: true
  - id: c4
    text: Democrats in Congress successfully passed a resolution last week that avoided a government shutdown.
    type: attribution
    span: Democrats in Congress successfully passed a resolution that avoided a government shutdown last week
    span_verified: true
  - id: c5
    text: The Build Back Better package is a nearly two-trillion-dollar spending bill that expands health insurance
      funding, tax credits, universal preschool, family leave, and invests roughly $500bn in climate change.
    type: numeric
    span: invests roughly $500bn in addressing climate change
    span_verified: true
  - id: c6
    text: The Build Back Better bill would be mostly paid for by increases in taxes on corporations and wealth earners.
    type: attribution
    span: This would be (mostly) paid for by increases in taxes on corporations and wealth earners
    span_verified: true
  - id: c7
    text: The bill passed the House of Representatives in October but is stuck in the Senate.
    type: numeric
    span: The bill passed the House of Representatives in October but it is stuck in the Senate
    span_verified: true
  - id: c8
    text: The Democratic majority in the Senate rests on Vice-President Kamala Harris' tie-breaking vote.
    type: actor
    span: the Democratic majority in the Senate rests on Vice-President Kamala Harris' tie-breaking vote
    span_verified: true
  - id: c9
    text: The new debt limit is set to be reached on 15 December unless Congress acts.
    type: numeric
    span: the new debt limit set to be reached on 15 December unless Congress acts
    span_verified: true
  - id: c10
    text: Senate minority leader Mitch McConnell argued that since Democrats run Congress, they should vote to extend
      the debt limit on their own.
    type: quote
    span: Mitch McConnell arguing that since Democrats run Congress, they should vote to extend the limit on their
      own
    span_verified: true
  - id: c11
    text: Democratic Senate Majority Leader Chuck Schumer gave a speech blaming Republicans for politicising a solemn
      national obligation to pay its bills.
    type: quote
    span: Chuck Schumer gave a speech blaming Republicans for politicising a solemn national obligation to pays
      its bills
    span_verified: true
  - id: c12
    text: McConnell responded by promising that when the next debt limit approached in December, his party wouldn't
      offer any help at all.
    type: quote
    span: promising that when the next debt limit approached in December, his party wouldn't offer any help at all
    span_verified: true
  - id: c13
    text: Defence authorisation is one of the few spending bills Congress has reliably passed every year for the
      past six decades.
    type: background
    span: having done so every year for the past six decades
    span_verified: true
  - id: c14
    text: The House of Representatives approved its version of the National Defence Authorisation Act by a comfortable
      bipartisan majority back in September.
    type: numeric
    span: The House of Representatives approved its version of the National Defence Authorisation Act by a comfortable
      bipartisan majority back in September
    span_verified: true
  - id: c15
    text: Proposed changes to the defence bill include sanctions on a Russia-to-Germany pipeline, support for Taiwan,
      condemnation of Uyghur forced labour, and inclusion of women in the military draft.
    type: background
    span: sanctions relating to a Russia-to-Germany energy pipeline, new language supporting Taiwan, a condemnation
      of Uyghur forced labour in China
    span_verified: true
  - id: c16
    text: There is a proposal to tie the debt-limit extension to the defence authorisation bill.
    type: attribution
    span: There's even a proposal to tie the debt-limit extension to the defence authorisation
    span_verified: true
  - id: c17
    text: The US Innovation and Competitiveness Act is a $250bn package to invest in technology research, enact
      trade restrictions, and prioritise US-made products, aimed at competing with China.
    type: numeric
    span: a $250bn grab-bag of proposals to invest in technology research, enact new trade restrictions and prioritise
      US-made products
    span_verified: true
  - id: c18
    text: The China competitiveness bill is described as the brainchild of Senate leader Schumer and cleared the
      Senate back in June.
    type: attribution
    span: It's the brainchild of Senate leader Schumer, which might explain why it cleared his chamber with (relative)
      ease back in June
    span_verified: true
  - id: c19
    text: The Chinese government has vehemently opposed the China competitiveness bill.
    type: actor
    span: The Chinese government, for its part, has vehemently opposed the bill
    span_verified: true
  - id: c20
    text: Some liberals in the House view the China bill as a sop to big corporations.
    type: evaluative
    span: Some liberals in the House view it as a sop to big corporations
    span_verified: true
- doc_id: s011
  on_topic: true
  description: Human Rights Watch press release on the imprisonment of Ilham Tohti's students in Xinjiang, China,
    based on a leaked government prisoner list.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Human Rights Watch called on China to immediately release all remaining imprisoned students of Uyghur
      scholar Ilham Tohti.
    type: attribution
    span: The Chinese government should immediately release all remaining imprisoned students of the Uyghur scholar
      Ilham Tohti
    span_verified: true
  - id: c2
    text: A leaked government list from December 2021 shows six of seven students were sentenced in December 2014
      to three-and-a-half to eight years in prison.
    type: numeric
    span: six of the seven students on the list were sentenced in December 2014 to between three-and-a-half and
      eight years in prison
    span_verified: true
  - id: c3
    text: Ilham Tohti, 52, began writing about social problems facing Uyghurs in Xinjiang in 1994.
    type: background
    span: began writing about social problems facing Uyghurs in China’s Xinjiang region in 1994
    span_verified: true
  - id: c4
    text: Ilham Tohti was arrested in January 2014 on charges of separatism and sentenced to life in prison after
      a trial riddled with due process violations.
    type: numeric
    span: arrested in January 2014 on charges of “separatism” and sentenced to life in prison after a trial that
      was riddled with due process violations
    span_verified: true
  - id: c5
    text: Maya Wang, senior China researcher at Human Rights Watch, said China's repression raises concerns the
      students are still detained or restricted.
    type: quote
    span: China’s severe repression in Xinjiang raises serious concerns that the seven students are still under
      some form of detention or movement restrictions
    span_verified: true
  - id: c6
    text: The trials occurred the same year China launched its 'Strike Hard Campaign against Violent Terrorism'
      against 11 million Turkic Muslims in Xinjiang.
    type: evaluative
    span: opened its abusive “Strike Hard Campaign against Violent Terrorism” against the 11 million Turkic Muslims
      in Xinjiang
    span_verified: true
  - id: c7
    text: Authorities ramped up the campaign in late 2016 and arbitrarily detained over a million Uyghurs and other
      Turkic Muslims in camps and prisons.
    type: numeric
    span: arbitrarily detained over a million Uyghurs and other Turkic Muslims in “political education” camps, formal
      detention centers, and prisons
    span_verified: true
  - id: c8
    text: The seven prisoners were Ilham Tohti's students or volunteers for his website Uyghurbiz.net, named Abduqeyum
      Ablimit, Perhat Halmurat, Akbar Imin, Mutellip Imin, Shohret Nijat, Atikem Rozi, and Luo Yuwei.
    type: actor
    span: are Abduqeyum Ablimit, Perhat Halmurat, Akbar (or Ekbar) Imin, Mutellip Imin, Shohret Nijat, Atikem Rozi,
      and Luo Yuwei
    span_verified: true
  - id: c9
    text: Perhat Halmurat was sentenced to eight years and held in Turpan Prison, with his sentence due to end January
      14, 2022.
    type: numeric
    span: sentenced to eight years and held in Turpan Prison. His sentence should have ended on January 14, 2022
    span_verified: true
  - id: c10
    text: Atikem Rozi, the only woman in the group, was sentenced to four years in a separate hearing on December
      22, 2014.
    type: numeric
    span: was sentenced to four years in prison in a separate hearing on December 22, 2014, also for “separatism”
    span_verified: true
  - id: c11
    text: A clip of Atikem Rozi speaking in Uyghur in prison uniform appeared in an April 2021 Chinese government
      propaganda film.
    type: evaluative
    span: appeared briefly in an April 2021 Chinese government propaganda film, allegedly showing that Uyghurs are
      susceptible to “radical separatist thoughts”
    span_verified: true
  - id: c12
    text: The leaked list has no information on Luo Yuwei, the only non-Uyghur member of the group.
    type: background
    span: The leaked list has no information on Luo Yuwei (罗玉伟), the only non-Uyghur member of the group
    span_verified: true
  - id: c13
    text: Ilham Tohti's lawyers, Liu Xiaoyuan and Li Fangping, told media the students were convicted of separatism
      and given three to eight years in prison.
    type: quote
    span: Liu Xiaoyuan and Li Fangping, told the media that the students were convicted on a charge of separatism
      and were given between three and eight years in prison
    span_verified: true
  - id: c14
    text: The Chinese government has never released the students' sentencing information, and a search on the Supreme
      People's Court verdict database returned no results.
    type: attribution
    span: A search for the students’ names on the Supreme People’s Court verdict database returned no results
    span_verified: true
  - id: c15
    text: The leaked list, created in August 2015, contains details of over 18,000 Uyghurs in Xinjiang convicted
      of political and religious crimes.
    type: numeric
    span: contains the names, genders, ethnicities, dates of birth, ID numbers, addresses, crimes, sentencing dates,
      and other details of over 18,000 Uyghurs
    span_verified: true
  - id: c16
    text: An anonymous source described as a Han Chinese opposed to Xinjiang policies emailed the lists of 18,000
      and 10,000 prisoners to the Xinjiang Victims Database in December 2021.
    type: attribution
    span: emailed this list of 18,000 prisoners and another of 10,000 Uyghur prisoners to the Xinjiang Victims Database
      in December 2021
    span_verified: true
  - id: c17
    text: The Xinjiang Victims Database verified the leaked lists and said details were consistent with other information
      it had collected.
    type: attribution
    span: has verified the leaked lists. The Database said details contained in the leaked list are consistent with
      other information it had collected
    span_verified: true
  - id: c18
    text: Ilham Tohti's daughter, Jewher Ilham, said his family has not been given access to visit him since early
      2017.
    type: quote
    span: his family has not been given access to visit him since early 2017
    span_verified: true
  - id: c19
    text: Ilham Tohti was detained at Beijing Capital International Airport in 2013 while traveling to take up a
      post as visiting scholar at Indiana University.
    type: numeric
    span: Officials detained him at Beijing Capital International Airport in 2013 as he was travelling to take up
      a post as a visiting scholar at Indiana University
    span_verified: true
  - id: c20
    text: Human Rights Watch said the Chinese government's mass violations against Uyghurs amount to crimes against
      humanity.
    type: evaluative
    span: amount to crimes against humanity, Human Rights Watch said
    span_verified: true
- doc_id: s012
  on_topic: true
  description: A Council on Foreign Relations backgrounder explaining Beijing's tightening control over Hong Kong's
    political freedoms and autonomy since the 1997 handover.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: China agreed to give Hong Kong fifty years of autonomy under 'one country, two systems' after the 1997
      handover.
    type: background
    span: give Hong Kong fifty years to keep its capitalist system and enjoy many freedoms
    span_verified: true
  - id: c2
    text: Beijing imposed a sweeping national security law on Hong Kong in 2020.
    type: numeric
    span: In 2020, Beijing imposed a sweeping national security law on Hong Kong
    span_verified: true
  - id: c3
    text: In March 2024, Hong Kong lawmakers passed Article 23, expanding the 2020 security law's definitions of
      external interference and espionage.
    type: numeric
    span: In March 2024, Hong Kong lawmakers passed Article 23, an expansion of the 2020 security law
    span_verified: true
  - id: c4
    text: Media tycoon Jimmy Lai, a pro-democracy advocate, was arrested in 2020 and later found guilty of colluding
      with foreign influences, namely the United States.
    type: attribution
    span: he was found guilty in a high-profile trial of colluding with foreign influences, namely the United States
    span_verified: true
  - id: c5
    text: In February 2026, Jimmy Lai was sentenced to twenty years in prison at age seventy-eight.
    type: numeric
    span: In February 2026, Lai was sentenced to twenty years in prison at age seventy-eight
    span_verified: true
  - id: c6
    text: The British government returned Hong Kong to China in 1997 after more than 150 years of colonial rule.
    type: background
    span: the British government returned Hong Kong in 1997
    span_verified: true
  - id: c7
    text: Qing dynasty leaders ceded Hong Kong Island to Britain in 1842 after China's defeat in the First Opium
      War.
