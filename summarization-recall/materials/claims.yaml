    span: an August 10 strike that killed Al Jazeera correspondents Anas al-Sharif and Mohammad Qreiqeh and four
      other media workers
    span_verified: true
  - id: c15
    text: On March 23, Israeli forces apparently deliberately killed 15 Palestinian paramedics and rescue workers
