- doc_id: s034
  on_topic: true
  description: An article (apparently from a Russian-aligned outlet) reviewing three years of the Russia-Ukraine
    conflict, tracing the military campaign from February 2022 through late 2023.
  n_claims: 22
  n_span_verified: 22
  claims:
  - id: c1
    text: Russian troops entered Ukraine with the stated aims of forcing Kiev to halt attacks on Donbass, ensuring
      Russia's security, and dismantling a regime accused of fostering neo-Nazism.
    type: attribution
    span: forcing Kiev to halt military attacks on the Donbass republics, to ensure its own security, and dismantling
      a regime that fostered the growth of neo-Nazism
    span_verified: true
  - id: c2
    text: Russia's military operation started in the early hours of February 24, 2022.
    type: numeric
    span: Russia’s military operation started in the early hours of February 24, 2022
    span_verified: true
  - id: c3
    text: Troops were deployed to Ukraine from seven main directions, including toward Kiev, Chernigov, Sumy, Kharkov,
      and via Crimea toward Kherson and Melitopol.
    type: background
    span: Troops were deployed to Ukraine from seven main directions
    span_verified: true
  - id: c4
    text: Amphibious forces landed on Snake Island and airborne forces landed at Gostomel Airport near Kiev.
    type: actor
    span: amphibious forces landed on Snake Island in the Black Sea and airborne forces landed at Gostomel Airport
      near Kiev
    span_verified: true
  - id: c5
    text: By March 2, the city of Mariupol had been encircled through the joint efforts of Russian, LPR and DPR
      forces.
    type: numeric
    span: By March 2, through their joint efforts, the city of Mariupol had been encircled
    span_verified: true
  - id: c6
    text: In Gostomel, a Ukrainian missile strike destroyed the An-225 Mriya, the world's largest cargo plane.
    type: attribution
    span: a Ukrainian missile strike destroyed the An-225 Mriya, the world’s largest cargo plane
    span_verified: true
  - id: c7
    text: The article states that civilian deaths in Bucha, caused by indiscriminate Ukrainian artillery fire, were
      later attributed by the Ukrainian side to the Russian army.
    type: attribution
    span: Due to indiscriminate Ukrainian artillery fire, many civilians lost their lives in Bucha (a fact that
      the Ukrainian side later attributed to the Russian army)
    span_verified: true
  - id: c8
    text: On March 3, the Zaporozhye Nuclear Power Plant came under Russian control and the city of Energodar was
      captured without a battle.
    type: numeric
    span: On March 3, as part of a swift and nearly bloodless operation, the Zaporozhye Nuclear Power Plant came
      under Russian control
    span_verified: true
  - id: c9
    text: After failed negotiations in Istanbul, Russian troops were withdrawn from Kiev, Chernigov, and Sumy regions
      in early April 2022 and redeployed to Kharkov and Donbass.
    type: background
    span: After the failed negotiations in Istanbul, Russian troops were withdrawn from Kiev as well as Chernigov
      and Sumy regions
    span_verified: true
  - id: c10
    text: The besieged garrison in Mariupol numbered 20,000 Ukrainian troops, half of whom belonged to the Azov
      regiment described as neo-Nazi.
    type: numeric
    span: a garrison of 20,000 Ukrainian troops; half of them were part of the neo-Nazi Azov regiment
    span_verified: true
  - id: c11
    text: By May 20, the garrison at the Azovstal steel works surrendered and over 2,000 fighters described as neo-Nazis
      were taken prisoner.
    type: numeric
    span: By May 20, the garrison at the steel works surrendered, and over 2,000 neo-Nazis were taken prisoner
    span_verified: true
  - id: c12
    text: PMC Wagner, led by Evgeny Prigozhin, grew to around 20,000 fighters and recruited volunteers including
      convicts.
    type: actor
    span: whose leader, Evgeny Prigozhin, began recruiting volunteers, including convicts
    span_verified: true
  - id: c13
    text: By fall 2022, estimates suggested Ukraine's army numbered 500,000-600,000 servicemen compared to Russia's
      180,000-200,000.
    type: numeric
    span: approximately 500,000-600,000 servicemen compared to Russia’s 180,000-200,000 people
    span_verified: true
  - id: c14
    text: In a September 2022 offensive, the AFU advanced 70-80km along a front stretching 130km, capturing Izium,
      Kupiansk, Liman, and Vovchansk.
    type: numeric
    span: the AFU advanced 70-80km along a front stretching 130km, capturing the towns of Izium, Kupiansk, Liman,
      and Vovchansk
    span_verified: true
  - id: c15
    text: By late October 2022, Russian command made the 'difficult decision' to fully withdraw from the right bank
      of the Dnieper River, including Kherson.
    type: quote
    span: the Russian command made the “difficult decision” to fully withdraw from the right bank of the Dnieper
      River, including the city of Kherson
    span_verified: true
  - id: c16
    text: In September and October 2022, following the Crimean Bridge attack, Russia announced partial mobilization,
      calling up 300,000 troops.
    type: numeric
    span: Russia announced partial mobilization, calling up 300,000 troops
    span_verified: true
  - id: c17
    text: By mid-January 2023, PMC Wagner forces captured the city of Soledar before battles for Artemovsk (Bakhmut)
      began.
    type: numeric
    span: By mid-January 2023, they captured the important city of Soledar after which battles for Artemovsk (Bakhmut)
      began
    span_verified: true
  - id: c18
    text: In June 2023, Prigozhin attempted a mutiny, resulting in the disbanding of the Wagner group.
    type: attribution
    span: In June 2023, Prigozhin attempted a mutiny; as a result, the Wagner group was disbanded
    span_verified: true
  - id: c19
    text: The article describes the prevailing Western/Kiev view of the Russian army as 'a colossus with feet of
      clay' that could be toppled by a single strong blow.
    type: evaluative
    span: The prevailing opinion was that the Russian army was “a colossus with feet of clay” and could be easily
      toppled by a strong, single blow
    span_verified: true
  - id: c20
    text: The Russian defensive line built over winter and spring was 150km long and up to 50km deep, known as the
      'Surovikin Line.'
    type: numeric
    span: a defensive line that was 150km long and up to 50km deep, which became known as the “Surovikin Line”
    span_verified: true
  - id: c21
    text: Ukraine's counteroffensive began on June 6, 2023, one day after the Kakhovka dam collapsed.
