  on_topic: true
  description: A news roundup/backgrounder (likely CFR-style) on the Israeli-Palestinian conflict, covering recent
    Gaza/West Bank incidents and historical background of the conflict.
  n_claims: 22
  n_span_verified: 22
  claims:
  - id: c1
    text: Hamas's October 7, 2023 assault on Israel killed over 1,200 people and took 251 hostages.
    type: numeric
    span: killing over 1,200 people and taking 251 hostages
    span_verified: true
  - id: c2
    text: The Israeli military campaign that followed killed over 70,000 Palestinian civilians and fighters and
      displaced nearly the entire population of Gaza.
    type: numeric
    span: killed over 70,000 Palestinian civilians and fighters and displaced nearly the entire population of Gaza
    span_verified: true
  - id: c3
    text: An October 2025 ceasefire secured the release of all remaining hostages and established a technocratic
      Palestinian governing committee.
    type: background
    span: An October 2025 ceasefire secured the release of all remaining hostages and established a technocratic
      Palestinian governing committee
    span_verified: true
  - id: c4
    text: Hamas has dissolved its Gaza government but refused to disarm, citing ongoing Israeli strikes.
    type: attribution
    span: Hamas has dissolved its Gaza government but refused to disarm, citing ongoing Israeli strikes
    span_verified: true
  - id: c5
    text: Palestinian health officials said at least two people, including a four-year-old boy, were killed in IDF
      airstrikes on Zawayda town and Nuseirat refugee camp.
    type: numeric
    span: at least two people were killed, including a four-year-old boy, in Israel Defense Forces (IDF) airstrikes
      on Zawayda town and Nuseirat refugee camp
    span_verified: true
  - id: c6
    text: Israeli Prime Minister Benjamin Netanyahu said the strikes were in response to kites launched from Gaza
      into Kibbutz Nahal Oz over the weekend.
    type: quote
    span: the strikes were in response to the launching of kites from Gaza into Kibbutz Nahal Oz over the weekend
    span_verified: true
  - id: c7
    text: Defense Minister Israel Katz instructed the IDF to treat incoming kites as drones even if they do not
      contain explosive material.
    type: attribution
    span: Defense Minister Israel Katz instructed the IDF to treat incoming kites as drones, even if they do not
      contain explosive material
    span_verified: true
  - id: c8
    text: Israel admitted to killing five-year-old Hind Rajab, six family members, and two paramedics dispatched
      to rescue her in January 2024, and opened a criminal investigation.
    type: numeric
    span: Israel admitted to killing five-year-old Hind Rajab and six family members in January 2024, along with
      two paramedics dispatched to rescue her
    span_verified: true
  - id: c9
    text: U.S. Ambassador to Israel Mike Huckabee condemned Israeli settlers' actions besieging Palestinian homes
      as a 'horrific act of terror.'
    type: quote
    span: condemned the settler actions as a “horrific act of terror”
    span_verified: true
  - id: c10
    text: Israeli troops clashed with Jewish settlers who had set up an outpost in front of Palestinian homes in
      the West Bank, then withdrew after failing to clear the settlers.
    type: actor
    span: the military withdrew after the confrontation failed to clear the settlers
    span_verified: true
  - id: c11
    text: Netanyahu announced Israel rejected Trump's Board of Peace plan, saying Israeli forces 'would not carry
      out any withdrawal until Hamas is disarmed.'
    type: quote
    span: would not carry out any withdrawal until Hamas is disarmed
    span_verified: true
  - id: c12
    text: In 1947, the UN adopted Resolution 181, the Partition Plan, to divide British-controlled Palestine into
      Arab and Jewish states.
    type: background
    span: the United Nations adopted Resolution 181, known as the Partition Plan, which sought to divide what had
      become British-controlled Palestine into Arab and Jewish states
    span_verified: true
  - id: c13
    text: Israel's independence was declared on May 14, 1948, and the following day it was attacked by five Arab
      states, starting the first Arab-Israeli War, which ended in 1949 with 750,000 Palestinians displaced in the
      Nakba.
    type: numeric
    span: The war ended in 1949 with Israel’s victory and 750,000 Palestinians displaced, in what is referred to
      as the Nakba
    span_verified: true
  - id: c14
    text: The Six Day War in June 1967 resulted in Israel gaining the Sinai Peninsula, Gaza Strip, West Bank, East
      Jerusalem, and Golan Heights.
    type: background
    span: Israel gained territorial control over the Sinai Peninsula and the Gaza Strip from Egypt, the West Bank
      and East Jerusalem from Jordan, and the Golan Heights from Syria
    span_verified: true
  - id: c15
    text: Hamas won a plurality in the Palestinian Authority's parliamentary elections in 2006, and violently seized
      control of Gaza in June 2007, prompting an Israeli-Egyptian blockade.
    type: numeric
    span: Hamas violently seized control of Gaza in June 2007, and Israel and Egypt subsequently placed a blockade
      on the territory
    span_verified: true
  - id: c16
    text: In the 2014 Gaza conflict, Hamas fired nearly three thousand rockets at Israel, and 2,251 Palestinians
      and 73 Israelis were killed.
    type: numeric
    span: Hamas then fired nearly three thousand rockets at Israel, and Israel retaliated with a major offensive
      in Gaza; 2,251 Palestinians and 73 Israelis were killed
    span_verified: true
  - id: c17
    text: In March 2018, Israeli troops killed 183 Palestinians and wounded 6,000 others during protests along the
      Gaza-Israel perimeter fence.
    type: numeric
    span: Israeli troops killed 183 Palestinians and wounded 6,000 others
    span_verified: true
  - id: c18
    text: The 2020 Abraham Accords, brokered by the Trump administration, saw Bahrain and the United Arab Emirates
      normalize relations with Israel.
    type: background
    span: the Trump administration helped broker the 2020 Abraham Accords, under which Bahrain and the United Arab
      Emirates normalized relations with Israel
    span_verified: true
  - id: c19
    text: On October 7, 2023, Iran-backed Hamas fighters killed more than 1,300 people, injured 3,300, and took
      hundreds of hostages in a surprise attack on southern Israel.
    type: numeric
    span: killing more than 1,300 people, injuring 3,300, and taking hundreds of hostages
    span_verified: true
  - id: c20
    text: The Israel-Hamas war has led to more than seventy thousand Gazan deaths, according to the Hamas-controlled
      Gaza Health Ministry.
    type: attribution
    span: more than seventy thousand Gazan deaths, according to the Hamas-controlled Gaza Health Ministry
    span_verified: true
  - id: c21
    text: At least 94 percent of Gaza's hospitals are damaged or destroyed, with only two thousand available hospital
      beds across the Gaza Strip.
    type: numeric
    span: At least 94 percent of Gaza’s hospitals are damaged or destroyed, and there are only two thousand available
      hospital beds across the Gaza Strip
    span_verified: true
  - id: c22
    text: In August 2025, 1.9 million Gazans, about 90 percent of Gaza's population, were displaced and facing acute
      or catastrophic food shortages.
    type: numeric
    span: 1.9 million Gazans—about 90 percent of Gaza’s population—were displaced and facing acute or catastrophic
      food shortages
    span_verified: true
