- doc_id: s029
  on_topic: true
  description: UN OHCHR press release (22 August 2019) summarizing findings of the Independent International Fact-Finding
    Mission on Myanmar regarding sexual and gender-based violence by the military.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: The UN Fact-Finding Mission on Myanmar said the country's military must stop using sexual and gender-based
      violence to terrorise and punish ethnic minorities.
    type: attribution
    span: the country’s military must stop using sexual and gender-based violence to terrorise and punish ethnic
      minorities
    span_verified: true
  - id: c2
    text: The Mission said the tactic was still being used in Kachin and Shan states and was so severe in Rakhine
      State during the 2017 'clearance operations' that it indicated genocidal intent against the Rohingya.
    type: evaluative
    span: a factor indicating the Myanmar military’s genocidal intent to destroy the Rohingya population
    span_verified: true
  - id: c3
    text: The Mission's report found soldiers routinely and systematically employed rape, gang rape and other violent
      sexual acts against women, girls, boys, men and transgender people.
    type: attribution
    span: soldiers routinely and systematically employed rape, gang rape and other violent and forced sexual acts
      against women, girls, boys, men and transgender people
    span_verified: true
  - id: c4
    text: The report stated that extreme physical violence and openness reflect a widespread culture of tolerance
      towards humiliation and deliberate infliction of severe pain.
    type: quote
    span: a widespread culture of tolerance towards humiliation and the deliberate infliction of severe physical
      and mental pain or suffering on civilians
    span_verified: true
  - id: c5
    text: Marzuki Darusman, chair of the Fact-Finding Mission, said the international community must hold the Myanmar
      military accountable for the pain and suffering it inflicted on persons of all genders.
    type: quote
    span: The international community must hold the Myanmar military to account for the tremendous pain and suffering
      it has inflicted on persons of all genders
    span_verified: true
  - id: c6
    text: The military's 'clearance operations' began on 25 August 2017 and led to more than 700,000 Rohingya fleeing
      to Bangladesh.
    type: numeric
    span: more than 700,000 Rohingya fleeing to Bangladesh
    span_verified: true
  - id: c7
    text: Mission Expert Radhika Coomaraswamy said the findings address a gap that usually surrounds sexual and
      gender-based violence reports, namely cases against men, boys and transgender people.
    type: quote
    span: cases of sexual violence against men and boys and transgender people
    span_verified: true
  - id: c8
    text: Coomaraswamy said 'the silence must be broken.'
    type: quote
    span: The silence must be broken
    span_verified: true
  - id: c9
    text: The Mission concluded that sexual violence perpetrated by the military was part of a deliberate, well-planned
      strategy to intimidate, terrorise and punish a civilian population.
    type: attribution
    span: part of a deliberate, well-planned strategy to intimidate, terrorise and punish a civilian population
    span_verified: true
  - id: c10
    text: The report described the military's genocidal intent as shown through systematic killing of women and
      girls, selection of women of reproductive age for rape, attacks on pregnant women and babies, and mutilation
      of reproductive organs.
    type: evaluative
    span: the widespread and systematic killing of women and girls, the systematic selection of women and girls
      of reproductive ages for rape
    span_verified: true
  - id: c11
    text: The majority of assaults reported were directed at women and girls, who were beaten, burned with cigarettes,
      slashed with knives, raped and held as sexual slaves on military bases.
    type: numeric
    span: beaten, burned with cigarettes, slashed with knives, raped and held as sexual slaves on military bases
    span_verified: true
  - id: c12
    text: Mission Expert Christopher Sidoti said this was the first time such a UN report clearly highlighted violence
      against transgender people.
    type: quote
    span: For the first time in such a UN report, we are clearly highlighting violence against transgender people
    span_verified: true
  - id: c13
    text: Sidoti said transgender Rohingya women are victimised twice, because they are Rohingya and because they
      are transgender.
    type: quote
    span: they are victimised twice, because they are Rohingya and because they are transgender
    span_verified: true
  - id: c14
    text: In one incident in Kachin State's Myitkyina Township, Myanmar Intelligence Office agents forced two male
      detainees to undress and rape each other while laughing.
    type: actor
    span: Myanmar Intelligence Office agents forced two male detainees to undress and rape each other
    span_verified: true
  - id: c15
    text: The Mission said it felt compelled to update findings from its earlier 2018 report to the Human Rights
      Council to underscore accountability.
    type: background
    span: the importance of accountability for perpetrators
    span_verified: true
  - id: c16
    text: The document states the Myanmar Government has failed to cease, prevent, or take action against sexual
      and gender-based violence, or hold perpetrators accountable.
    type: attribution
    span: the Myanmar Government has failed to cease, prevent and take action against sexual and gender-based violence
      in the country
    span_verified: true
  - id: c17
    text: The Fact-Finding Mission will present its final report to the UN Human Rights Council in September 2019.
    type: numeric
    span: present its final report to the UN Human Rights Council in September 2019
    span_verified: true
  - id: c18
    text: The Human Rights Council decided on 24 March 2017, through Resolution A/HRC/RES/34/22, to dispatch the
      fact-finding mission to investigate alleged human rights violations in Myanmar, particularly Rakhine State.
    type: background
    span: decided (through Resolution A/HRC/RES/34/22) to dispatch urgently an independent international fact-finding
      mission
    span_verified: true
  - id: c19
    text: The three Mission experts are Marzuki Darusman, Radhika Coomaraswamy, and Christopher Sidoti.
    type: actor
    span: Radhika Coomaraswamy, a lawyer and former UN Special Rapporteur on Violence against Women
    span_verified: true
- doc_id: s044
  on_topic: true
  description: A scientific review article discussing successes and challenges of gene therapy, focusing on hematopoietic
    stem cell gene therapy for inherited blood cell diseases, CAR T-cell therapy, and AAV vector-based treatments.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: 'The article highlights success and ongoing challenges in three areas of gene therapy: inherited blood
      cell diseases via HSC targeting, malignancies via CAR-modified immune cells, and ophthalmologic, neurologic,
      and coagulation disorders via in vivo AAV vector administration.'
    type: background
    span: success and ongoing challenges in three areas of high activity in gene therapy
    span_verified: true
  - id: c2
    text: The high one-time costs and manufacturing complexity of gene therapies are cited as ongoing challenges
      requiring new reimbursement models.
    type: evaluative
    span: New models of reimbursement are needed to make these innovative treatments widely available
    span_verified: true
  - id: c3
    text: Inherited blood cell diseases were the first group of disorders successfully treated with gene therapy.
    type: background
    span: Inherited blood cell diseases were the first group of disorders approached and successfully treated with
      gene therapy
    span_verified: true
  - id: c4
    text: Engraftment levels of gene-corrected HSC achieved by HSCGT can range from 25% to over 90%.
    type: numeric
    span: relatively high levels of engraftment of gene-corrected HSC can be achieved (25->90%)
    span_verified: true
  - id: c5
    text: HSCGT for X-linked adrenoleukodystrophy (Skysona) and β-thalassemia (Zynteglo) recently received U.S.
      FDA marketing approval.
    type: attribution
    span: HSCGT for X-linked adrenoleukodystrophy (Skysona™) and β-thalassemia (Zynteglo™), recently received U.S.
      FDA marketing approval
    span_verified: true
  - id: c6
    text: Severe combined immune deficiency (SCID) was the first clinical success with gene therapy.
    type: background
    span: Severe combined immune deficiency (SCID) was the first clinical success with gene therapy
    span_verified: true
  - id: c7
    text: Six of 20 XSCID patients treated with gamma-retroviral vectors developed leukemia as a serious complication
      two or more years after gene therapy.
    type: numeric
    span: 6 of 20 XSCID patients developed a serious complication of leukemia induced by the vector
    span_verified: true
  - id: c8
    text: The field shifted to lentiviral vectors due to their lower genotoxicity risks compared to gamma-retroviral
      vectors and greater effectiveness in transducing human HSC.
    type: evaluative
    span: The field shifted to the use of lentiviral vectors for their lower risks for genotoxicity compared to
      gamma-retroviral vectors
    span_verified: true
  - id: c9
    text: Multiple studies in France, the U.K. and the U.S. showed consistently very high frequencies of survival
      with successful immune reconstitution using lentiviral vectors for SCID variants.
    type: numeric
    span: Across multiple studies in France, the U.K. and the U.S. there are consistently very high frequencies
      of survival with successful immune reconstitution
    span_verified: true
  - id: c10
    text: Other inborn errors of immunity, including Wiskott-Aldrich syndrome, chronic granulomatous disease, and
      leukocyte adhesion deficiency I, have been successfully treated with HSCGT using lentiviral vectors.
    type: actor
    span: Other IEIs have been successfully treated with HSCGT using lentiviral vectors, including Wiskott-Aldrich
      syndrome, chronic granulomatous disease, and leukocyte adhesion deficiency I
    span_verified: true
  - id: c11
    text: For metachromatic leukodystrophy, HSCGT may produce superior results compared to allogeneic donor transplants
      due to over-expression and cross-correction effects.
    type: evaluative
    span: HSCGT may produce superior results for these diseases, as has been indicated for metachromatic leukodystrophy
    span_verified: true
  - id: c12
    text: Published trials of a lentiviral vector for β-thalassemia showed high rates of improvement in red blood
      cell production, allowing transfusion therapy to be stopped for most treated patients.
    type: numeric
    span: showed high rates of improvement in red blood cell production, to allow transfusion therapy to be stopped
      for most treated patients
    span_verified: true
  - id: c13
    text: Lentiviral vectors expressing anti-sickling genes have shown clinical benefits with significant reduction
      in acute complications of sickle cell disease.
    type: evaluative
    span: have been shown to have clinical benefits, with significant reduction in acute complications of sickle
      cell disease
    span_verified: true
  - id: c14
    text: CRISPR/Cas9 is being used to disrupt the erythroid enhancer element for the BCL11a gene to induce increased
      γ-globin production and correct the sickle cell-causing mutation.
    type: attribution
    span: CRISPR/Cas9 is being used to disrupt the erythroid enhancer element for the BCL11a gene to induce increased
      γ-globin production
    span_verified: true
  - id: c15
    text: Early trials using gamma-retroviral vectors for XSCID, CGD, and WAS had serious complications from the
      vector causing leukemia in some patients.
    type: numeric
    span: early trials using gamma-retroviral vectors for XSCID, CGD, and WAS had serious complications from the
      vector causing leukemia in some of the patients
    span_verified: true
  - id: c16
    text: Gene editing methods carry inherent genotoxicity risks including disruptive insertions and deletions,
      loss of chromosomal material, bystander edits, and off-target editing.
    type: evaluative
    span: gene editing methods also have inherent genotoxicity risks, including disruptive insertions and deletions
      of various sizes at editing sites
    span_verified: true
  - id: c17
    text: Manufacturing gene-modified autologous HSC products requires patient-specific stem cell collection involving
      5–7 days of G-CSF mobilization and 1–3 leukapheresis sessions.
    type: numeric
    span: entailing 5–7 days of receiving G-CSF for mobilization, placement of a suitable central venous pheresis
      catheter, and 1–3 leukapheresis sessions
    span_verified: true
  - id: c18
    text: Fanconi anemia is an exception among blood-cell diseases that can achieve therapeutic stem-cell engraftment
      without conditioning chemotherapy due to inherent stem-cell defects.
    type: background
    span: Fanconi anemia being an exception that can achieve therapeutic levels of stem-cell engraftment without
      conditioning due to the stem-cell defects
    span_verified: true
  - id: c19
    text: A cohort of ADA SCID patients receiving reduced-intensity conditioning with busulfan did not display mutations
      typical of clonal hematopoiesis.
    type: numeric
    span: a cohort of ADA SCID patients who received reduced-intensity conditioning with busulfan did not display
      any mutations in the blood cells typical of clonal hematopoiesis
    span_verified: true
  - id: c20
    text: There is significant variability in engraftment levels of gene-corrected cells across members of different
      study cohorts in reported gene therapy trials.
    type: evaluative
    span: There is significant variability in the levels of engraftment of gene-corrected cells across members in
      different study cohorts
    span_verified: true
