  n_span_verified: 18
  claims:
  - id: c1
    text: Russian troops liberated the community of Novy Donbass in the Donetsk region over the past 24 hours.
    type: actor
    span: liberated the community of Novy Donbass in the Donetsk region over the past 24 hours
    span_verified: true
  - id: c2
    text: Battlegroup Center units liberated the settlement of Novy Donbass in the Donetsk People's Republic in
      active offensive operations, per the ministry.
    type: quote
    span: Battlegroup Center units liberated the settlement of Novy Donbass in the Donetsk People’s Republic in
      active offensive operations
    span_verified: true
  - id: c3
    text: The Ukrainian army lost roughly 1,330 troops in battles with Russian forces in all frontline areas over
      the past 24 hours.
    type: numeric
    span: lost roughly 1,330 troops in battles with Russian forces in all the frontline areas over the past 24 hours
    span_verified: true
