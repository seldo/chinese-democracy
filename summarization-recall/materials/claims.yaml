  on_topic: true
  description: A first-person account by a Diraq/UNSW researcher describing the discovery of an all-electric fast
    spin qubit control mechanism, published alongside a Nature Nanotechnology paper.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: Diraq is a University of New South Wales spinout company founded by Professor Andrew Dzurak.
    type: actor
    span: a University of New South Wales spinout company founded by Professor Andrew Dzurak
    span_verified: true
  - id: c2
    text: Diraq develops quantum computers based on silicon.
    type: background
    span: we develop quantum computers based on silicon
    span_verified: true
  - id: c3
    text: Silicon is described as one of the most scalable ways to build a full-scale quantum computer in the coming
      years.
    type: evaluative
    span: one of the most scalable ways to build a full-scale quantum computer in the coming years
    span_verified: true
  - id: c4
    text: The story began in mid-2020 when Dr Wee Han Lim and the author were studying the interaction between two
      neighbouring qubits in a new device.
    type: numeric
    span: Our story starts in mid-2020, when Dr Wee Han Lim and I were studying the interaction between two neighbouring
      qubits
    span_verified: true
  - id: c5
    text: While increasing the voltage on the intermediate gate, the signal for one qubit started to broaden and
      blur unexpectedly.
    type: background
    span: suddenly our signal for one of the qubits started to broaden and blur
    span_verified: true
  - id: c6
    text: The researchers initially called the observed patterns 'Butterfly' maps, later renamed PESOS maps (Pulsed
      Electron Spin Orbit Spectroscopy).
    type: quote
    span: we initially called ‘Butterfly’ maps (later redubbed a PESOS maps, for Pulsed Electron Spin Orbit Spectroscopy)
    span_verified: true
  - id: c7
    text: Dr Henry Yang interpreted the pattern as meaning the qubit was actually speeding up.
    type: attribution
    span: he said that the pattern meant that our qubit is actually speeding up
    span_verified: true
  - id: c8
    text: The Rabi oscillations were found to get up to 10 times faster.
    type: numeric
    span: by up to 10 times faster
    span_verified: true
  - id: c9
    text: The rotation speed-up could be turned on and off using the gates by applying different voltages.
    type: background
    span: the rotation speed-up could be turned on and off with our gates by applying different voltages on them
    span_verified: true
  - id: c10
    text: Dr Andre Saraiva and PhD student Mengke Feng concluded that near orbital degeneracy the electron 'rattles'
      within the dot due to a residual electric field caused incidentally by the antenna.
    type: attribution
    span: Dr Andre Saraiva and PhD student Mengke Feng had a close look at the data and came up with the conclusion
    span_verified: true
  - id: c11
    text: The rattling greatly enhances the Rabi speed and indicates it should be possible to control electrons
      purely electrically.
    type: evaluative
    span: The rattling greatly enhances the Rabi speed, and it indicates that it should be possible to control electrons
      purely electrically
    span_verified: true
  - id: c12
    text: Dr William Gilbert replicated the speed-up result in a new device, then another.
    type: attribution
    span: Dr. William Gilbert replicated this result in a new device. And then another.
    span_verified: true
  - id: c13
    text: William Gilbert configured a fourth device to test whether the spin could be driven using only an AC electric
      field, removing the antenna.
    type: actor
    span: William was confident to take a stab at getting rid of the antenna altogether and configured the fourth
      device
    span_verified: true
  - id: c14
    text: William Gilbert broke the speed record for an electron spin qubit using AC electric fields alone.
    type: numeric
    span: he also broke the speed record for an electron spin qubit
    span_verified: true
  - id: c15
    text: Together with PhD student Jonathan Huang, they showed the qubit could be driven electrically with essentially
      no loss in control accuracy.
    type: attribution
    span: together with PhD student Jonathan Huang, they showed that it can be driven electrically with essentially
      no loss in control accuracy
    span_verified: true
  - id: c16
    text: The campaign to understand and tame this electrical control lasted almost 2 years.
    type: numeric
    span: our almost 2-year long campaign to tame this electrical control was both challenging and exciting
    span_verified: true
  - id: c17
    text: The findings could be used to couple spin qubits to cavities and between each other.
    type: evaluative
    span: it could be used for instance to couple spin qubits to cavities and between each other
    span_verified: true
  - id: c18
    text: The publication describing these findings is by W. Gilbert et al. in Nature Nanotechnology in 2023.
    type: attribution
    span: W. Gilbert et al. Nature Nanotechnology 39 (2023)
    span_verified: true
  - id: c19
    text: An all-electric spin drive without an antenna enables much simpler quantum computer architectures.
    type: evaluative
    span: A reproducible, fast, accurate, and all-electric spin drive enables much simpler architectures with our
      technology
    span_verified: true
