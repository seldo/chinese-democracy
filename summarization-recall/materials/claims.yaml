  on_topic: true
  description: A Human Rights Watch report documenting Israeli, Hamas/Palestinian armed group, and Palestinian Authority
    abuses in Gaza, the West Bank, and Israel during 2025.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: A UN Commission of Inquiry report issued in September found that Israel committed genocide in Gaza.
    type: attribution
