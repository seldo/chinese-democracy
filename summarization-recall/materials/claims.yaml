    text: Last month, Barr issued a directive allowing U.S. attorneys to pursue substantial allegations of voting
      irregularities before the 2020 election was certified.
    type: attribution
    span: Barr issued a directive to U.S. attorneys across the country allowing them to pursue any “substantial
      allegations” of voting irregularities
    span_verified: true
  - id: c12
    text: The department's top elections crime official announced he would step aside from that position because
      of the memo.
    type: actor
    span: the department’s top elections crime official announced he would step aside from that position because
      of the memo
    span_verified: true
  - id: c13
    text: The Trump campaign team led by Giuliani has alleged a widespread conspiracy by Democrats to dump millions
      of illegal votes into the system with no evidence.
    type: evaluative
    span: alleging a widespread conspiracy by Democrats to dump millions of illegal votes into the system with no
      evidence
    span_verified: true
  - id: c14
    text: Their lawsuits have been repeatedly dismissed, including by Republican judges who ruled the suits lacked
      evidence.
    type: attribution
    span: The claims have been repeatedly dismissed including by Republican judges who have ruled the suits lacked
      evidence
    span_verified: true
  - id: c15
    text: Trump's own administration has said the 2020 election was the most secure ever.
    type: quote
    span: his own administration has said the 2020 election was the most secure ever
    span_verified: true
  - id: c16
    text: Attorney Sidney Powell claimed election software was created in Venezuela at the direction of Hugo Chavez,
      who died in 2013.
    type: quote
    span: election software created in Venezuela “at the direction of Hugo Chavez,” – the late Venezuelan president
      who died in 2013
    span_verified: true
  - id: c17
    text: Powell was removed from the legal team after threatening to 'blow up' Georgia with a 'biblical' court
      filing.
    type: actor
    span: Powell has since been removed from the legal team after an interview she gave where she threatened to
      “blow up” Georgia with a “biblical” court filing
    span_verified: true
  - id: c18
    text: Barr said DHS and DOJ looked into claims that machines were programmed to skew election results and haven't
