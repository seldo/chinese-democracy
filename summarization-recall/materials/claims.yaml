- doc_id: s052
  on_topic: true
  description: BBC News report on an independent panel's findings that Uefa bore primary responsibility for the
    chaotic and dangerous scenes before the 2022 Champions League final in Paris.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Uefa bears 'primary responsibility' for the chaotic scenes that 'almost led to disaster' before the Champions
      League final, according to an independent report.
    type: attribution
    span: Uefa bears "primary responsibility" for the chaotic scenes that "almost led to disaster"
    span_verified: true
  - id: c2
    text: Fans were penned in and teargassed outside Paris's Stade de France as kick-off was delayed by 36 minutes.
    type: numeric
    span: Fans were penned in and teargassed outside Paris's Stade de France as kick-off was delayed by 36 minutes
    span_verified: true
  - id: c3
    text: The final took place on 28 May and the report says it is remarkable no one lost their life.
    type: quote
    span: It is remarkable no one lost their life
    span_verified: true
  - id: c4
    text: Uefa and French authorities initially blamed ticketless fans for the events, but the report says there
      is no evidence for these 'reprehensible' claims.
    type: attribution
    span: Uefa and French authorities initially blamed ticketless fans for the events
    span_verified: true
  - id: c5
    text: The report describes the situation as a 'near-miss', a term for an event that almost turns into a mass
      fatality catastrophe.
    type: evaluative
    span: a term used when an event almost turns into a mass fatality catastrophe
    span_verified: true
  - id: c6
    text: The report found 'contributory fault' from other bodies, particularly French police and the French Football
      Federation, though Uefa was described as 'at the wheel'.
    type: attribution
    span: particularly French police and the French Football Federation - the findings said European governing body
      Uefa was "at the wheel"
    span_verified: true
  - id: c7
    text: Liverpool lost the final 1-0.
    type: numeric
    span: Liverpool went on to lose 1-0
    span_verified: true
  - id: c8
    text: The investigation found eight key factors that almost led to disaster because of Uefa's failure, including
      poor route planning and police using tear gas in the concourses.
    type: numeric
    span: eight key factors that "almost led to disaster" because of Uefa's failure
    span_verified: true
  - id: c9
    text: The report said the collective action of Liverpool supporters was 'probably instrumental' in preventing
      more serious injuries and deaths outside the stadium.
    type: quote
    span: the collective action of Liverpool supporters was "probably instrumental" in preventing "more serious
      injuries and deaths"
    span_verified: true
  - id: c10
    text: The investigation was chaired by Dr Tiago Brandao Rodrigues, a Portuguese politician.
    type: actor
    span: The investigation was chaired by Dr Tiago Brandao Rodrigues, a Portuguese politician
    span_verified: true
  - id: c11
    text: Dr Rodrigues said the enthusiasm around the game rapidly turned into a real 'near miss' which was harmful
      to a significant number of fans from both clubs.
    type: quote
    span: The enthusiasm around the game rapidly turned into a real 'near miss' which was harmful to a significant
      number of fans from both clubs
    span_verified: true
  - id: c12
    text: The report made 21 recommendations to prevent similar incidents at major sporting events.
    type: numeric
    span: The report made 21 recommendations in an attempt to ensure "everything possible is done"
    span_verified: true
  - id: c13
    text: The report warned French authorities this should be a 'wake-up call' before hosting the 2023 Rugby World
      Cup and 2024 Olympic and Paralympic Games.
    type: background
    span: a "wake-up call" before it hosts the 2023 Rugby World Cup and 2024 Olympic and Paralympic Games
    span_verified: true
  - id: c14
    text: Ninety-seven Liverpool supporters died as a result of the April 1989 Hillsborough disaster at Sheffield
      Wednesday's stadium.
    type: numeric
    span: Ninety-seven Liverpool supporters died as a result of the April 1989 disaster at Sheffield Wednesday's
      stadium
    span_verified: true
  - id: c15
    text: A new inquest concluded in 2016 that the behaviour of Liverpool supporters played no part in the Hillsborough
      deaths and that those who died were unlawfully killed.
    type: background
    span: a new inquest concluded in 2016 the behaviour of Liverpool supporters played no part in the deaths
    span_verified: true
  - id: c16
    text: The report stated that the parallels between Hillsborough 1989 and Paris 2022 are palpable, and both events
      were foreseeable and preventable.
    type: quote
    span: The parallels between Hillsborough 1989 and Paris 2022 are palpable
    span_verified: true
  - id: c17
    text: Uefa apologised 'most sincerely' for the events and said it would announce a 'special refund scheme' for
      affected fans.
    type: attribution
    span: Uefa apologised "most sincerely" for the events which unfolded
    span_verified: true
  - id: c18
    text: Uefa general secretary Theodore Theodoridis apologised to the supporters of Liverpool for unjustly blaming
      them for the delayed kick-off.
    type: quote
    span: In particular, I would like to apologise to the supporters of Liverpool
    span_verified: true
  - id: c19
    text: Steve Rotheram, mayor of the Liverpool City Region, said the findings 'vindicated' Liverpool fans who
      blamed Uefa and French authorities.
    type: quote
    span: says the findings "vindicated" the Liverpool fans who had said Uefa and the French authorities were responsible
    span_verified: true
  - id: c20
    text: French sports minister Amelie Oudea-Castera said Liverpool had let their supporters 'out in the wild',
      prompting Liverpool chairman Tom Werner to demand an apology.
    type: quote
    span: French sports minister Amelie Oudea-Castera said Liverpool had let their supporters "out in the wild"
    span_verified: true
- doc_id: s054
  on_topic: true
  description: A NASA live-blog timeline of launch day updates for the Artemis II test flight, covering pre-launch
    preparations through post-liftoff milestones.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: NASA's Artemis II SLS rocket lifted off from Kennedy Space Center's Launch Complex 39B in Florida at 6:35
      p.m. EDT.
    type: numeric
    span: lifted off from Kennedy Space Center’s Launch Complex 39B in Florida at 6:35 p.m. EDT
    span_verified: true
  - id: c2
    text: The Orion spacecraft atop the rocket carried NASA astronauts Reid Wiseman, Victor Glover, and Christina
      Koch, along with CSA astronaut Jeremy Hansen.
    type: actor
    span: carrying NASA astronauts Reid Wiseman, Victor Glover, and Christina Koch, along with CSA (Canadian Space
      Agency) astronaut Jeremy Hansen
    span_verified: true
  - id: c3
    text: The twin solid rocket boosters and four RS-25 engines generated 8.8 million pounds of force at liftoff.
    type: numeric
    span: generated an incredible 8.8 million pounds of force at liftoff
    span_verified: true
  - id: c4
    text: The Artemis II mission is described as an approximately 10-day mission around the Moon and the first crewed
      flight under NASA's Artemis campaign.
    type: evaluative
    span: The approximately 10-day Artemis II mission around the Moon is the first crewed flight under NASA’s Artemis
      campaign
    span_verified: true
  - id: c5
    text: The mission aims to help build toward the first crewed missions to Mars.
    type: background
    span: to continue building toward the first crewed missions to Mars
    span_verified: true
  - id: c6
    text: The twin solid rocket boosters separated from the rocket at 6:37 p.m.
    type: numeric
    span: The SLS (Space Launch System) twin solid rocket boosters have separated
    span_verified: true
  - id: c7
    text: Each solid rocket booster stands 177 feet tall and generates more than 3.6 million pounds of thrust at
      liftoff.
    type: numeric
    span: each standing 177 feet tall and generating more than 3.6 million pounds of thrust at liftoff
    span_verified: true
  - id: c8
    text: At 6:38 p.m., the spacecraft adapter jettison fairings enclosing the service module and launch abort system
      separated from Orion.
    type: numeric
    span: The spacecraft adapter jettison fairings that enclose the service module and the launch abort system have
      separated from the Orion spacecraft
    span_verified: true
  - id: c9
    text: At 6:43 p.m., main engine cutoff of the SLS core stage was completed and the core stage separated from
      the interim cryogenic propulsion stage and Orion.
    type: numeric
    span: Main engine cutoff of the SLS (Space Launch System) core stage is complete, and the core stage has successfully
      separated
    span_verified: true
  - id: c10
    text: At 6:59 p.m., flight controllers in Houston confirmed that all four solar array wings on Orion had fully
      deployed.
    type: numeric
    span: Flight controllers in Houston confirmed that all four wings unfolded as planned, locking into place and
      beginning to draw power
    span_verified: true
  - id: c11
    text: Orion, named Integrity, has a wingspan of roughly 63 feet when its solar arrays are fully deployed, with
      each wing containing 15,000 solar cells.
    type: numeric
    span: a wingspan of roughly 63 feet when fully deployed. Each wing has 15,000 solar cells
    span_verified: true
  - id: c12
    text: Following the burns, NASA will hold a postlaunch news conference at 9 p.m. from Kennedy Space Center in
      Florida.
    type: numeric
    span: NASA will hold a postlaunch news conference at 9 p.m. from Kennedy Space Center in Florida
    span_verified: true
  - id: c13
    text: The Artemis II crew will conduct a proximity operations demonstration testing manual maneuvering of Orion
      relative to the interim cryogenic propulsion stage after separation.
    type: background
    span: This demonstration will test the ability to manually maneuver Orion relative to another spacecraft, in
      this case, the interim cryogenic propulsion stage after separation
    span_verified: true
  - id: c14
    text: Artemis II Launch Director Charlie Blackwell-Thompson conducted the 'go/no-go' poll at 6:22 p.m. for the
      terminal count, and the team gave a unanimous 'go'.
    type: quote
    span: 'Artemis II Launch Director Charlie Blackwell-Thompson conducted one of the most important steps before
      liftoff: the “go/no-go” poll'
    span_verified: true
  - id: c15
    text: At 6:19 p.m., the launch team extended the T-10 minute hold to give engineers time for final preparations,
      within a two-hour launch window.
    type: numeric
    span: The launch team has made the decision to extend the T-10 minute hold ahead of today’s launch to give engineers
      time to work through final preparations
    span_verified: true
  - id: c16
    text: At 5:57 p.m., the closeout crew departed Launch Complex 39B after completing suit-up, hatch closure, and
      spacecraft checks, and weather was upgraded to 90% go for launch.
    type: numeric
    span: The weather continues to cooperate and has now been upgraded to 90% go for launch
    span_verified: true
  - id: c17
    text: Engineers investigated a sensor on the launch abort system's attitude control motor controller battery
      showing a higher-than-expected temperature, believed to be an instrumentation issue not affecting launch.
    type: evaluative
    span: It is believed to be an instrumentation issue and will not affect today’s launch
    span_verified: true
  - id: c18
    text: At 5 p.m., the Eastern Range identified an issue with communication to the flight termination system,
      which if unresolved would make the launch no-go.
    type: attribution
    span: the Eastern Range has identified an issue that they are currently working to resolve related to their
      communication with the flight termination system
    span_verified: true
  - id: c19
    text: At 5:15 p.m., engineers resolved the flight termination system communication issue and performed a confidence
      test to ensure readiness for launch.
    type: attribution
    span: Engineers have now resolved an issue with the hardware that communicates with the flight termination system
    span_verified: true
  - id: c20
    text: At liftoff, the twin solid rocket boosters delivered more than 75% of the thrust needed to lift the 5.75-million-pound
      rocket off the pad.
    type: numeric
    span: delivering more than 75% of the thrust needed to lift the 5.75-million-pound rocket off the pad
    span_verified: true
- doc_id: s055
  on_topic: true
  description: AP news article reporting the 2023 Nobel Prize in physics awarded to Anne L'Huillier, Pierre Agostini,
    and Ferenc Krausz for attosecond electron research.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: Three scientists won the Nobel Prize in physics for giving the first split-second glimpse into the world
      of spinning electrons.
    type: numeric
    span: Three scientists won the Nobel Prize in physics on Tuesday for giving us the first split-second glimpse
    span_verified: true
  - id: c2
    text: The award went to Anne L'Huillier, Pierre Agostini and Ferenc Krausz.
    type: actor
    span: French-Swedish physicist Anne L’Huillier, French scientist Pierre Agostini and Hungarian-born Ferenc Krausz
    span_verified: true
  - id: c3
    text: L'Huillier is the fifth woman to receive a Nobel in physics.
    type: numeric
    span: L’Huillier, of Lund University in Sweden, is the fifth woman to receive a Nobel in physics
    span_verified: true
  - id: c4
    text: Nobel Committee member Mats Larsson said electrons are 'really the workforce in everywhere.'
    type: quote
    span: “The electrons are very fast, and the electrons are really the workforce in everywhere,” Nobel Committee
      member Mats Larsson said
    span_verified: true
  - id: c5
    text: L'Huillier told the AP that women interested in the field should 'just go for it.'
    type: quote
    span: “For all the women, I say if you are interested, if you have a little bit of passion for this type of
      challenges, so just go for it,”
    span_verified: true
  - id: c6
    text: The scientists used ever-quicker laser pulses to catch atomic action happening in attoseconds, one quintillionth
      of a second.
    type: numeric
    span: used ever-quicker laser pulses to catch the atomic action that happened at such dizzying speeds — one
      quintillionth of a second, known as an attosecond
    span_verified: true
  - id: c7
    text: Nobel Committee member Mark Pearce said there are as many attoseconds in a second as seconds since the
      Big Bang, 13.8 billion years ago.
    type: quote
    span: there are as many attoseconds in a second as there are seconds which have passed since the Big Bang, 13.8
      billion years ago
    span_verified: true
  - id: c8
    text: L'Huillier said electrons are more like waves than particles, and their technique measures the position
      of the crest of the waves.
    type: quote
    span: “The electrons are much more like waves, like water waves, than particles and what we try to measure with
      our technique is the position of the crest of the waves,”
    span_verified: true
  - id: c9
    text: Krausz said at a news conference that electrons are omnipresent in biological and technical life.
    type: quote
    span: “Electrons are, even if we can’t see them, omnipresent in our life — our biological life and also our
      technical life, in our everyday life,” Krausz said
    span_verified: true
  - id: c10
    text: L'Huillier said she spent 30 years on the fundamental science before its real-world applications became
      apparent.
    type: background
    span: She spent 30 years on it before possible real world uses became more apparent
    span_verified: true
  - id: c11
    text: L'Huillier was teaching about 100 undergraduates at Lund when she received the call and missed it because
      her phone was on silent.
    type: background
    span: L’Huillier was teaching basic engineering physics to about 100 undergraduates at Lund when she got the
      call that she had won, but her phone was on silent
    span_verified: true
  - id: c12
    text: L'Huillier said the prize is 'the most prestigious' and noted there are not many women who have received
      it.
    type: quote
    span: “This is the most prestigious and I am so happy to get this prize. It’s incredible,”
    span_verified: true
  - id: c13
    text: Agostini, an emeritus professor at Ohio State University, could not be reached by the Nobel Committee
      before the announcement.
    type: attribution
    span: Agostini, an emeritus professor at Ohio State University, was in Paris and could not be reached by the
      Nobel Committee before it announced his win
    span_verified: true
  - id: c14
    text: Agostini, 82, joked that younger people would have appreciated the prize more and that it was 'a bit late'
      for him.
    type: quote
    span: “There are certainly younger people who would have appreciated it far more than me,” the 82-year-old joked.
      “It’s good but it is a bit late for me.”
    span_verified: true
  - id: c15
    text: Krausz, 61, said he had been trying to figure out whether he was in reality or a long dream.
    type: quote
    span: “I have been trying to figure out since 11 a.m. … whether I’m in reality or it’s just a long dream,” the
      61-year-old said
    span_verified: true
  - id: c16
    text: Last year, Krausz and L'Huillier won the Wolf prize in physics, sharing it with University of Ottawa scientist
      Paul Corkum.
    type: numeric
    span: Last year, Krausz and L’Huillier won the prestigious Wolf prize in physics for their work, sharing it
      with University of Ottawa scientist Paul Corkum
    span_verified: true
  - id: c17
    text: Krausz said it was a shame Corkum could not be included because Nobel prizes are limited to only three
      winners.
    type: attribution
    span: Nobel prizes are limited to only three winners and Krausz said it was a shame it could not include Corkum
    span_verified: true
  - id: c18
    text: The Nobel Prizes carry a cash award of 11 million Swedish kronor ($1 million) from a bequest left by Alfred
      Nobel.
    type: numeric
    span: The Nobel Prizes carry a cash award of 11 million Swedish kronor ($1 million) from a bequest left by the
      prize’s creator, Swedish inventor Alfred Nobel
    span_verified: true
  - id: c19
    text: The physics prize announcement came a day after two scientists won the Nobel Prize in medicine for mRNA
      vaccine discoveries against COVID-19.
    type: background
    span: The physics prize comes a day after two scientists won the Nobel Prize in medicine for discoveries that
      enabled the creation of mRNA vaccines against COVID-19
    span_verified: true
