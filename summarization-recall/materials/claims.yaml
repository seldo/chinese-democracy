  on_topic: true
  description: 'A Judicial Watch newsletter roundup covering four items: a FOIA lawsuit over the Giuliani raid,
    Colorado voter roll removals, election monitoring in Hungary, and a Virginia school district scandal involving
    an illegal immigrant''s sexual assaults.'
  n_claims: 20
  n_span_verified: 19
  claims:
  - id: c1
    text: Federal agents executed search warrants at Rudy Giuliani's Manhattan apartment and office on April 28,
      2021, at approximately 6 a.m., seizing his cellphone and other devices.
    type: numeric
    span: On April 28, 2021, at approximately 6 a.m., federal agents executed search warrants at former New York
      City Mayor Rudy Giuliani's Manhattan apartment and his office
    span_verified: true
  - id: c2
    text: Judicial Watch filed a FOIA lawsuit against the Justice Department for records on the FBI's search warrants
      used in the raid on Giuliani.
    type: attribution
    span: Judicial Watch filed a Freedom of Information Act (FOIA) lawsuit against the U.S. Department of Justice
      for records on the Biden FBI's search warrants
    span_verified: true
  - id: c3
    text: According to public reports, the raid was tied to an investigation into whether Giuliani violated the
      Foreign Agents Registration Act in connection with Ukrainian officials.
    type: background
    span: the raid was tied to an investigation into whether Giuliani violated the Foreign Agents Registration Act
      (FARA) in connection with his activities involving Ukrainian officials
    span_verified: true
  - id: c4
    text: Giuliani's then-attorney Robert Costello said federal agents ignored Hunter Biden's computer hard drives
      during the raid, contradicting the warrant's order to seize every electronic device.
    type: quote
    span: federal agents ignored Hunter Biden's computer hard drives when they raided the apartment, contradicting
      the order on the warrant "to seize every electronic device in his home."
    span_verified: true
  - id: c5
    text: Judicial Watch characterizes the Biden DOJ's raid on Giuliani as 'a textbook example of weaponized justice'
      reflecting a 'corrupt two-tiered system.'
    type: evaluative
    span: The Biden DOJ's pre-dawn raid on Rudy Giuliani was a textbook example of weaponized justice
    span_verified: true
  - id: c6
    text: In March 2026, the Justice Department reported that the FBI found about 1.9 million pages of records responsive
      to Judicial Watch's FOIA lawsuit.
    type: numeric
    span: In March 2026, the Justice Department reported that the FBI found about 1.9 million pages of records that
      are responsive to our FOIA lawsuit
    span_verified: true
  - id: c7
    text: Following settlement of Judicial Watch's lawsuit, Colorado removed 372,000 ineligible voters from its
      registration lists since 2023.
    type: numeric
    span: the state has removed 372,000 ineligible voters from registration lists
    span_verified: true
  - id: c8
    text: Judicial Watch filed the Colorado lawsuit in 2020 on behalf of itself and three Colorado residents, and
      Colorado's secretary of state agreed to settle in March 2023.
    type: attribution
    span: Judicial Watch filed the Colorado federal lawsuit to clean the voter rolls in 2020 on behalf of ourselves
      and three residents of Colorado
    span_verified: true
  - id: c9
    text: Judicial Watch's lawsuits and legal actions have led to the removal of six million ineligible names from
      voter lists nationwide.
    type: numeric
    span: Our lawsuits and legal actions have now led to the removal of six million ineligible names from voter
      lists nationwide
    span_verified: true
  - id: c10
    text: In Kentucky, roughly 735,000 ineligible voter registrations were removed as part of a 2018 consent decree
      settling a Judicial Watch lawsuit.
    type: numeric
    span: roughly 735,000 ineligible voter registrations" have been removed from voter rolls, as part of a 2018
      consent decree
    span_verified: true
  - id: c11
    text: Judicial Watch's election law efforts are led by Senior Attorney Robert Popper, who previously served
      in the Justice Department's Civil Rights Division Voting Section.
    type: actor
    span: Our election law efforts are led by Senior Attorney Robert Popper, who previously served in the Voting
      Section of the Justice Department's Civil Rights Division
    span_verified: true
  - id: c12
    text: In January 2026, the U.S. Supreme Court decided 7-2 in favor of granting standing in a case Judicial Watch
      filed on behalf of Congressman Mike Bost and two presidential electors.
    type: numeric
    span: In January 2026, the U.S. Supreme Court decided 7-2 in favor of granting standing in a historic case we
      filed on behalf of Congressman Mike Bost
    span_verified: true
  - id: c13
    text: An eight-member election-integrity team from Judicial Watch will monitor the April 12 Hungarian parliamentary
      elections.
    type: numeric
    span: An eight-member election-integrity team from Judicial Watch will monitor the April 12 Hungarian parliamentary
      elections
    span_verified: true
  - id: c14
    text: Judicial Watch sent an election observer team to Hungary's 2022 election, monitoring voting at 52 precincts
      across 27 locations in and around Budapest.
    type: numeric
    span: independently monitoring voting at 52 precincts across 27 locations in and around Budapest
    span_verified: true
  - id: c15
    text: Judicial Watch's monitoring methodology contrasts with the OSCE's approach, which has criticized Hungarian
      elections from an ideological perspective based on value judgments about media bias.
    type: evaluative
    span: This methodology contrasts with the approach adopted by other international observers, like the Organization
      for Security and Co-operation in Europe (OSCE), which has criticized the Hungarian elections from an ideological
      perspective
    span_verified: true
  - id: c16
    text: Fairfax County Public Schools hired McGuireWoods, Virginia's largest law firm, billing taxpayers up to
      $1,850 an hour, to investigate the sexual assault case.
    type: numeric
    span: billing taxpayers up to $1,850 an hour to tame blowback ignited by the scandal
