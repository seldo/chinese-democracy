- doc_id: s056
  on_topic: true
  description: An op-ed/advice article by an AI startup founder offering strategies for raising a Series B round
    amid a slowing AI funding environment.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Raising a Series B has become exceptionally difficult in the last year as venture funding slowed.
    type: background
    span: it’s become exceptionally difficult in the last year as the venture spigot slowed to a trickle
    span_verified: true
  - id: c2
    text: Headline-grabbing funding rounds for generative AI companies are beginning to slow.
    type: evaluative
    span: the headline-grabbing funding rounds for generative AI companies are beginning to slow
    span_verified: true
  - id: c3
    text: Almost every startup is now calling itself an 'AI company,' making it harder for true AI startups to stand
      out.
    type: evaluative
    span: almost every startup calling itself an “AI company,” it will become more difficult for true AI startups
      to stand out
    span_verified: true
  - id: c4
    text: The author is a founder who raised a $40 million Series B from top investors in August last year.
    type: numeric
    span: a founder who raised a $40 million Series B from top investors in August last year
    span_verified: true
  - id: c5
    text: The author claims to share strategies that worked for their own fundraising.
    type: attribution
    span: I can share a few strategies that worked for us
    span_verified: true
  - id: c6
    text: The article argues that adding AI features alone, without genuine impact, diminishes a startup's credibility.
    type: evaluative
    span: claiming to be an AI startup just for the sake of it will diminish your credibility
    span_verified: true
  - id: c7
    text: Startups should quantify AI's impact using model performance metrics, ROI, TCO, and case studies.
    type: background
    span: quantitative metrics like model performance, business value measures like return on investment (ROI) and
      total cost of ownership (TCO), and qualitative proof points like case studies and success stories
    span_verified: true
  - id: c8
    text: OpenAI's domination of the AI space poses a threat to countless startups, especially those acting as wrappers
      to public models like GPT-4.
    type: attribution
    span: OpenAI’s domination of the AI space poses a threat to countless startups, particularly those that act
      as wrappers to public models like GPT-4
    span_verified: true
  - id: c9
    text: Investors have become savvier about identifying what is and isn't genuinely AI due to being inundated
      with AI startups.
    type: evaluative
    span: investors have become savvier about identifying what is and what isn’t AI
    span_verified: true
  - id: c10
    text: The accessibility of large language models (LLMs) has made building an 'AI startup' much easier and cheaper.
    type: background
    span: With the accessibility of large language models (LLMs), building an “AI startup” has become much easier
      and cheaper
    span_verified: true
  - id: c11
    text: Collecting and labeling massive amounts of training data is no longer a mandatory prerequisite following
      the advent of pre-trained LLMs.
    type: background
    span: Collecting and labeling massive amounts of training data is no longer a mandatory prerequisite
    span_verified: true
  - id: c12
    text: The article lists specific technical diligence questions investors may ask, including about model architecture,
      datasets, and accuracy requirements.
    type: background
    span: Can you describe your model architecture? If applicable, which pre-trained models are you using
    span_verified: true
  - id: c13
    text: The article states that knowing a model's limitations demonstrates not only technical depth but also integrity.
    type: evaluative
    span: you will demonstrate not only technical depth, but also integrity
    span_verified: true
  - id: c14
    text: In a frothy market, founders could raise capital without a clear expansion formula, but today's environment
      requires compelling business metrics.
    type: evaluative
    span: you can raise capital to pad the balance sheet without necessarily having an expansion formula
    span_verified: true
  - id: c15
    text: The article advises founders to evaluate their metrics against current SaaS benchmarks.
    type: background
    span: Pore over current SaaS benchmarks and evaluate how you stack up against them
    span_verified: true
  - id: c16
    text: Full-stack AI startups may be selling 'work' in terms of labor displacement, optimization, and automation.
    type: background
    span: full-stack AI startups may be selling “work” in terms of labor displacement, optimization, and automation
    span_verified: true
  - id: c17
    text: Building and training AI models can be expensive, requiring significant computational and labor resources.
    type: background
    span: building and training AI models can be expensive; significant computational and labor resources are necessary
    span_verified: true
  - id: c18
    text: Today's venture market favors capital efficiency, requiring founders to understand cost structure and
      its impact on gross margins.
    type: evaluative
    span: Today’s venture market favors capital efficiency, so ensure you have a deep understanding of the cost
      structure
    span_verified: true
  - id: c19
    text: The article states there are already signs the AI funding boom is slowing.
    type: evaluative
    span: there are already signs the AI funding boom time is slowing
    span_verified: true
  - id: c20
    text: The article concludes that hard work, not hype, is what generates customer value.
    type: evaluative
    span: hard work, not hype, is what generates customer value
    span_verified: true
