    type: quote
    span: the DHS and DOJ have looked into that, and so far, we haven’t seen anything to substantiate that
    span_verified: true
  - id: c19
    text: Giuliani claimed there was ample evidence of illegal voting in at least six states, which had not been
      examined.
    type: quote
    span: there was “ample evidence of illegal voting in at least six states, which they have not examined”
    span_verified: true
  - id: c20
    text: Barr said a remedy for many complaints would be a top-down audit by state or local officials, not the
      U.S. Justice Department.
    type: quote
    span: a remedy for many complaints would be a top-down audit by state or local officials, not the U.S. Justice
