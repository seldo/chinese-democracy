  on_topic: true
  description: Tehran Times opinion/report piece citing a Fars News Agency study accusing Persian-language foreign
    media of spreading falsehoods about Iran's 2022 unrest following Mahsa Amini's death.
  n_claims: 19
  n_span_verified: 18
  claims:
  - id: c1
    text: A Fars news agency study examined social media of 5 media outlets and found they published 17312 lies
      over the last 25 days about events in Iran.
    type: numeric
    span: published a total of 17312 lies over the last 25 days about the recent events in Iran
    span_verified: true
  - id: c2
    text: The 5 outlets examined were BBC Persian, Iran International, Voice of America, Radio Farda, and Manoto.
    type: actor
    span: BBC Persian affiliated with the British government; Iran International affiliated with the Saudi government;
      Voice of America and Radio Farda
    span_verified: true
  - id: c3
    text: The survey only examined official websites, Telegram, Twitter and Instagram accounts, not TV networks.
    type: background
    span: only the official website, Telegram channel, Twitter and Instagram accounts of these 5 media outlets were
      examined
    span_verified: true
  - id: c4
    text: BBC Persian had the highest amount of fake news according to volume of news and productions.
    type: evaluative
    span: BBC had the highest amount of fake news, and Iran International and Radio Farda are in the next ranks
    span_verified: true
  - id: c5
    text: BBC Persian had 58% lies with 3101 false news out of 5343 total.
    type: numeric
    span: 'The BBC Persian with a total of 58% lies (total number of news 5343, number of false news: 3101)'
    span_verified: true
  - id: c6
    text: Iran International had 53% lies with 6026 false news out of 11426 total.
    type: numeric
    span: 'Iran International with a total of 53% lies (total number of news 11426, number of fake news: 6026)'
    span_verified: true
  - id: c7
    text: On average, 48.8% of the news published by these media over 25 days was false.
    type: numeric
    span: on average, 48.8% of the news published by these media are false
    span_verified: true
  - id: c8
    text: These media outlets published a lie every two minutes on average since Mahsa Amini's death on the 16th.
    type: numeric
    span: published a lie every two minutes on average since 16, when Mahsa Amini died
    span_verified: true
  - id: c9
    text: The five most-republished false claims included the beating of Mahsa Amini, the death/illness of Khamenei,
      the fall of Oshnaviyeh, the cause of Nika Shakarami's death, and the destruction of Sharif University.
    type: quote
    span: The false claim that "Sharif University was downed to the ground with bloodshed."
    span_verified: true
  - id: c10
    text: Iran's Foreign Ministry summoned British Ambassador Simon Shercliff and handed him an official note of
      protest over BBC Persian's reports.
    type: attribution
    span: caused Iran’s Foreign Ministry to summon the British Ambassador to Tehran, Simon Shercliff and hand him
      an official note of protest
    span_verified: true
  - id: c11
    text: Mahsa Amini, 22, died at hospital three days after collapsing at a police station in Tehran, and was arrested
      by morality police for improper hijab.
    type: numeric
    span: died at hospital three days after collapsing at a police station in Tehran, a young woman
    span_verified: false
  - id: c12
    text: A White House National Security Council spokesperson told Reuters on September 19 that Mahsa Amini's death
      was 'an appalling and egregious affront to human rights.'
    type: quote
    span: an appalling and egregious affront to human rights
    span_verified: true
  - id: c13
    text: US Special Envoy for Iran Robert Malley tweeted that Iran must end its violence against women and that
      those responsible for Amini's death should be held accountable.
    type: quote
    span: Those responsible for her death should be held accountable
    span_verified: true
  - id: c14
    text: US Secretary of State Anthony Blinken tweeted that Mahsa Amini should be alive today and called on Iran
      to end systemic persecution of women.
    type: quote
    span: We call on the Iranian government to end its systemic persecution of women and to allow peaceful protest
    span_verified: true
  - id: c15
    text: Iranian President Ebrahim Raeisi telephoned Amini's family and told her father he ordered an investigation
      into the matter.
    type: quote
    span: I immediately ordered my colleagues to investigate the matter in a specific manner
    span_verified: true
  - id: c16
    text: Parliament Speaker Mohammad Baqer Qalibaf said on September 20 that a parliamentary committee was investigating
      Amini's death and vowed reform of the morality police's approach.
    type: quote
    span: the supervisory institutions of the Parliament put the investigation process of this incident on their
      agenda with all sensitivity
    span_verified: true
  - id: c17
    text: The Tehran Times reported on September 28 that four European countries and an Asian country were involved
      in inciting riots and protests, with Germany at the center.
    type: attribution
    span: four European countries and an Asian have been involved in inciting riots and protests
    span_verified: true
  - id: c18
    text: The Tehran Times claimed the German embassy in Tehran contacted the Amini family and encouraged them to
      speak out against police and reach foreign media.
    type: attribution
    span: the German embassy contacted the Amini family and encouraged them to speak out against the police and
      reach out to foreign media outlets
    span_verified: true
  - id: c19
    text: The article describes the Western media coverage and government reactions to Amini's death as an attempt
      by the US and European countries to shed 'crocodile tears' for political gain.
    type: evaluative
    span: saw an opportunity to shed crocodile tears and used the tragic event to their political gains
    span_verified: true
