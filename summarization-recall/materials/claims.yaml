  n_span_verified: 19
  claims:
  - id: c1
    text: Xizang Autonomous Region celebrated the 75th anniversary of its peaceful liberation on Saturday.
    type: numeric
    span: celebrated the 75th anniversary of its peaceful liberation on Saturday
    span_verified: true
  - id: c2
    text: Scholars and experts gathered in Lhasa for an international symposium to discuss the historic significance
      of the liberation and Xizang's transformation.
    type: evaluative
    span: scholars and experts gathering in Lhasa for an international symposium to discuss the historic significance
    span_verified: true
  - id: c3
    text: The symposium was held at the Xizang Museum.
    type: background
    span: Held at the Xizang Museum
    span_verified: true
  - id: c4
    text: 'The symposium was themed "75 Years since the Peaceful Liberation: Achievements and Implications of Xizang''s
      Development."'
    type: background
    span: 'themed "75 Years since the Peaceful Liberation: Achievements and Implications of Xizang''s Development"'
    span_verified: true
  - id: c5
    text: The symposium focused on high-quality economic development, human rights protection progress, and building
