  on_topic: true
  description: The Verge article covering Google's Made by Google Pixel launch event, detailing new Pixel phones,
    Pixel Watch 5, Pixel Tag, and Pixel Buds Pro 2.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Google hosted a Pixel launch event on Wednesday night to show off its latest lineup of devices.
    type: background
    span: Google is hosting a Pixel launch event on Wednesday night
    span_verified: true
  - id: c2
    text: Google livestreamed the event on Wednesday at 6PM ET / 3PM PT.
    type: numeric
    span: Google livestreamed the event on Wednesday at 6PM ET / 3PM PT
    span_verified: true
  - id: c3
    text: The Pixel 11 runs on Google's new Tensor G6 chip, which Google claims offers 25 percent faster web browsing
      and 15 percent faster app loading.
    type: numeric
    span: 25 percent faster web browsing and 15 percent faster app loading
    span_verified: true
  - id: c4
    text: Google says the Pixel 11's battery lasts over 30 hours and supports 25 percent faster wireless charging
      than the Pixel 10.
    type: numeric
