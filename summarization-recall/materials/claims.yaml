    span: His trial without a jury concluded after almost five years, during which he was placed under solitary
      confinement
    span_verified: true
  - id: c16
    text: An annual candlelight vigil commemorating the 1989 Tiananmen Square massacre has been canceled in Hong
      Kong since 2021, with many organizers arrested.
    type: numeric
    span: An annual candlelight vigil held in Hong Kong to commemorate the Chinese government’s 1989 massacre of
      protesters at Tiananmen Square has been canceled since 2021
    span_verified: true
  - id: c17
    text: The United States imposed sanctions on Chinese officials, restricted defense exports, and revoked Hong
      Kong's special trade status.
    type: attribution
    span: The United States has imposed sanctions on Chinese officials it alleged were undermining Hong Kong’s autonomy,
      restricted exports of defense equipment to Hong Kong, revoked Hong Kong’s special trade status
    span_verified: true
  - id: c18
    text: The United Kingdom said in 2020 it would allow three million Hong Kong residents to settle in the country
      and apply for citizenship.
    type: numeric
    span: it would allow three million Hong Kong residents to settle in the country and apply for citizenship
    span_verified: true
  - id: c19
    text: President Donald Trump reportedly pressed Chinese President Xi Jinping on Lai's case when the two met
      in October 2025.
    type: attribution
    span: with Trump reportedly pressing Chinese president Xi Jinping on the matter when the two met in October
      2025
    span_verified: true
- doc_id: s014
  on_topic: true
  description: China Daily article reporting on a white paper titled 'The Taiwan Question and China's Reunification
    in the New Era' released by Chinese state bodies.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: The Taiwan Affairs Office and State Council Information Office published the white paper on Aug 10.
    type: numeric
    span: published a white paper titled "The Taiwan Question and China's Reunification in the New Era" on Aug 10
    span_verified: true
  - id: c2
    text: The white paper was released to reiterate that Taiwan is part of China and reaffirm commitment to national
      reunification.
    type: attribution
    span: was released to reiterate the fact that Taiwan is part of China, to demonstrate the resolve of the Communist
      Party of China
    span_verified: true
  - id: c3
    text: The white paper states Taiwan has belonged to China since ancient times, based on history and jurisprudence.
    type: background
    span: Taiwan has belonged to China since ancient times. This statement has a sound basis in history and jurisprudence
    span_verified: true
  - id: c4
    text: The white paper says UN General Assembly Resolution 2758 encapsulates the one-China principle and its
      legal authority is acknowledged worldwide.
    type: attribution
    span: The UN General Assembly Resolution 2758 is a political document encapsulating the one-China principle
      whose legal authority leaves no room for doubt
    span_verified: true
  - id: c5
    text: 'The white paper quotes: ''We are one China, and Taiwan is part of China... Taiwan has never been a state;
      its status as part of China is unalterable.'''
    type: quote
    span: We are one China, and Taiwan is part of China. This is an indisputable fact supported by history and the
      law.
    span_verified: true
  - id: c6
    text: The white paper credits the CPC's resolute leadership for cross-Straits de-escalation and peaceful development.
    type: attribution
    span: Under its resolute leadership, people on both sides of the Taiwan Straits have worked together to de-escalate
      tension across the Straits
    span_verified: true
  - id: c7
    text: The white paper says great progress in cross-Straits relations occurred over the past seven decades under
      CPC guidance.
    type: numeric
    span: great progress has been made in cross-Straits relations over the past seven decades
    span_verified: true
  - id: c8
    text: The white paper quotes that national reunification is driven by history and culture and that China has
      never been closer to achieving national rejuvenation.
    type: quote
    span: Never before have we been so close to, confident in, and capable of achieving the goal of national rejuvenation
    span_verified: true
  - id: c9
    text: The white paper credits four decades of reform, opening-up and modernization with a profound impact on
      resolving the Taiwan question.
    type: numeric
    span: the great achievements over four decades of reform, opening-up and modernization
    span_verified: true
  - id: c10
    text: The white paper attributes tension in cross-Straits relations to the actions of the Democratic Progressive
      Party authorities.
    type: attribution
    span: The actions of the Democratic Progressive Party authorities have resulted in tension in cross-Straits
      relations
    span_verified: true
  - id: c11
    text: The white paper says external forces have encouraged and instigated provocative actions by separatist
      forces, intensifying tension.
    type: attribution
    span: External forces have encouraged and instigated provocative actions by the separatist forces
    span_verified: true
  - id: c12
    text: The white paper characterizes using Taiwan to contain China as 'doomed to fail.'
    type: evaluative
    span: using Taiwan to contain China is doomed to fail
    span_verified: true
  - id: c13
    text: The white paper describes peaceful reunification and 'one country, two systems' as the basic principles
      for resolving the Taiwan question.
    type: evaluative
    span: Peaceful reunification and "one country, two systems" are our basic principles for resolving the Taiwan
      question
    span_verified: true
  - id: c14
    text: The white paper quotes that the 'one country, two systems' principle is 'the most inclusive solution'
      acknowledging distinct social systems.
    type: quote
    span: The 'one country, two systems' principle is the most inclusive solution to this problem
    span_verified: true
  - id: c15
    text: The white paper states there is readiness to create space for peaceful reunification but no room for separatist
      activities.
    type: quote
    span: We are ready to create vast space for peaceful reunification, but we will leave no room for separatist
      activities in any form
    span_verified: true
  - id: c16
    text: The white paper states China will not renounce the use of force and reserves the option of taking all
      necessary measures.
    type: quote
    span: we will not renounce the use of force, and we reserve the option of taking all necessary measures
    span_verified: true
  - id: c17
    text: The white paper clarifies that use of force would target external interference and separatists, not the
      Taiwan people, and would be a last resort.
    type: quote
    span: Use of force would be the last resort taken under compelling circumstances
    span_verified: true
  - id: c18
    text: The white paper says peaceful reunification will create opportunities for social and economic development
      and bring benefits to Taiwan's people.
    type: evaluative
    span: it will create huge opportunities for social and economic development in Taiwan and bring tangible benefits
      to the people of Taiwan
    span_verified: true
  - id: c19
    text: The white paper claims peaceful cross-Straits reunification benefits not only the Chinese nation but all
      peoples and the international community.
    type: evaluative
    span: Peaceful cross-Straits reunification is of benefit not only to the Chinese nation but to all peoples and
      the international community as a whole
    span_verified: true
- doc_id: s013
  on_topic: true
  description: An open letter from Chinese NGO Network for International Exchanges and hundreds of co-signatory
    Chinese organizations addressed to UN High Commissioner for Human Rights Michelle Bachelet, opposing the planned
    release of an OHCHR assessment on Xinjiang.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: The letter is addressed to Madame High Commissioner Michelle Bachelet.
    type: actor
    span: Dear Madame High Commissioner Michelle Bachelet
    span_verified: true
  - id: c2
    text: Bachelet visited China, including Xinjiang Uyghur Autonomous Region, in late May.
    type: numeric
    span: During your visit to China including Xinjiang Uyghur Autonomous Region in late May
    span_verified: true
  - id: c3
    text: The signatories claim Xinjiang has enjoyed sustained economic development, social stability, improvement
      of people's livelihood, cultural prosperity and religious harmony.
    type: evaluative
    span: Xinjiang has enjoyed sustained economic development, social stability, improvement of people's livelihood,
      cultural prosperity and religious harmony
    span_verified: true
  - id: c4
    text: The letter asserts that people of all ethnic groups in Xinjiang enjoy various forms of human rights in
      accordance with law.
    type: evaluative
    span: people of all ethnic groups in Xinjiang enjoy various forms of human rights in accordance with law
    span_verified: true
  - id: c5
    text: The letter expects Bachelet to present what she saw and heard in Xinjiang to the international community
      in an objective and fair manner.
    type: attribution
    span: you will draw a conclusion based on the facts, and present what you saw and heard in Xinjiang to the international
      community in an objective and fair manner
    span_verified: true
  - id: c6
    text: The signatories state that certain anti-China forces have publicly urged Bachelet to release a so-called
      assessment on Xinjiang.
    type: attribution
    span: certain anti-China forces, out of ulterior political motives, have publicly urged you to release the so-called
      assessment on Xinjiang
    span_verified: true
  - id: c7
    text: The letter claims the assessment is entirely based on false accusations fabricated by anti-China forces
      and false testimony by overseas anti-China separatists.
    type: attribution
    span: the assessment is entirely based on false accusations fabricated by anti-China forces and false testimony
      by overseas anti-China separatists
    span_verified: true
  - id: c8
    text: The letter characterizes claims of genocide, crimes against humanity, forced labour, forced sterilization,
      and religious repression in Xinjiang as 'the biggest lies of the century.'
    type: evaluative
    span: the biggest lies of the century that there are so-called genocide, crimes against humanity, forced labour,
      forced sterilization, religious repression in Xinjiang
    span_verified: true
  - id: c9
    text: The signatories state that the assessment is completely untrue.
    type: evaluative
    span: Such an assessment is completely untrue
    span_verified: true
  - id: c10
    text: The letter warns that the assessment, once released, will be used by certain countries as a political
      tool to interfere in China's internal affairs and contain China's development.
    type: attribution
    span: will be definitely used by certain countries as a political tool to interfere in China's internal affairs
      and to contain China's development under the pretext of human rights
    span_verified: true
  - id: c11
    text: The letter states the assessment will damage the credibility of the High Commissioner and the OHCHR.
    type: attribution
    span: It will badly damage the credibility of Madame High Commissioner yourself and the OHCHR
    span_verified: true
  - id: c12
    text: The letter says the assessment will undermine developing countries' confidence in constructive cooperation
      with the OHCHR.
    type: attribution
    span: seriously undermine the developing countries' confidence in constructive cooperation with the OHCHR
    span_verified: true
  - id: c13
    text: The letter states the assessment will hurt the sentiments of all 1.4 billion Chinese people, including
      the 25 million people in Xinjiang.
    type: numeric
    span: deeply hurt the sentiments of all 1.4 billion Chinese people including the 25 million in Xinjiang
    span_verified: true
  - id: c14
    text: The signatories declare they are strongly opposed to the release of the assessment, calling it unreasonable,
      unauthorized, and untruthful.
    type: evaluative
    span: We are strongly opposed to the release of such an unreasonable, unauthorized, and untruthful assessment
    span_verified: true
  - id: c15
    text: The letter calls on Bachelet and the OHCHR to abide by the purposes and principles of the UN Charter and
      respect the sovereignty and territorial integrity of all countries.
    type: quote
    span: abide by the purposes and principles of the UN Charter, respect the sovereignty and territorial integrity
      of all countries
    span_verified: true
  - id: c16
    text: The letter urges the OHCHR to respect the authoritative information provided by member states and the
      concerns raised by Chinese people and people championing justice worldwide.
    type: quote
    span: respect the authoritative information provided by member states, and respect the serious concerns raised
      by all Chinese people and all people championing justice around the world
    span_verified: true
  - id: c17
    text: The letter calls on Bachelet and OHCHR to 'stand on the right side of history' and not release an assessment
      full of lies.
    type: quote
    span: stand on the right side of history, and not to release an assessment full of lies
    span_verified: true
  - id: c18
    text: The letter is signed by numerous organizations including the China NGO Network for International Exchanges
      and the China Society for Human Rights Studies.
    type: actor
    span: '1. China NGO Network for International Exchanges

      2. China Society for Human Rights Studies'
    span_verified: true
  - id: c19
    text: Signatories include foreign friendship associations such as the Algeria-China Friendship Association and
      All Pakistan-China Friendship Association.
    type: actor
    span: '3. Algeria-China Friendship Association

      4. All Pakistan-China Friendship Association'
    span_verified: true
- doc_id: s015
  on_topic: true
  description: Transcript of a Chinese Foreign Ministry spokesperson Lin Jian's press briefing covering the Panama
    Canal ports dispute, China-Russia-US leader interactions, nuclear arms control, Hong Kong business sentiment,
    and critical minerals alliance.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Panama's Supreme Court ruled that CK Hutchison's concession to operate two Panama Canal ports is unconstitutional.
    type: background
    span: Panama’s Supreme Court ruling that CK Hutchison’s concession to operate two Panama Canal ports is unconstitutional
    span_verified: true
  - id: c2
    text: China said it will firmly safeguard the legitimate and lawful rights and interests of Chinese companies.
    type: quote
    span: China will firmly defend the legitimate and lawful rights and interests of Chinese companies
    span_verified: true
  - id: c3
    text: The Hong Kong and Macao Affairs Office of the State Council posted a commentary on February 3 calling
      the Panamanian Supreme Court's ruling an act of bad faith.
    type: attribution
    span: the Hong Kong and Macao Affairs Office of the State Council of China stated that Panamanian Supreme Court’s
      ruling is an act of bad faith
    span_verified: true
  - id: c4
    text: CK Hutchison said it strongly disagrees with the ruling and would launch international arbitration.
    type: quote
    span: it “strongly disagrees with” the ruling, would launch international arbitration
    span_verified: true
  - id: c5
    text: On February 4, marking the Chinese solar term Start of Spring, President Xi Jinping had a virtual meeting
      with Russian President Vladimir Putin.
    type: numeric
    span: On February 4, which marks the traditional Chinese solar term Start of Spring, the heads of state of Russia
      and China had a virtual meeting
    span_verified: true
  - id: c6
    text: Aide to the Russian President Ushakov said Putin plans to visit China in the first half of 2026.
    type: quote
    span: President Putin plans to visit China in the first half of 2026
    span_verified: true
  - id: c7
    text: After the virtual meeting with Putin, President Xi Jinping spoke by phone with U.S. President Donald J.
      Trump.
    type: actor
    span: the Chinese leader had a virtual meeting with Russian President Vladimir Putin and then spoke with U.S.
      President Donald J. Trump on the phone
    span_verified: true
  - id: c8
    text: Lin Jian said the two head-of-state interactions were arrangements agreed upon by China and Russia and
      by China and the U.S. according to the leaders' schedules.
    type: attribution
    span: This is the arrangement agreed on by China and Russia and China and the U.S. according to the schedule
      of the leaders
    span_verified: true
  - id: c9
    text: The U.S.-Russia New START treaty expired on the day of the briefing.
    type: numeric
    span: The U.S.-Russia New Strategic Arms Reduction Treaty expires today
    span_verified: true
  - id: c10
    text: China follows a defensive nuclear strategy and a policy of no first use of nuclear weapons.
    type: quote
    span: China follows a defensive nuclear strategy and a policy of “no first use” of nuclear weapons
    span_verified: true
  - id: c11
    text: China said it will not take part in nuclear disarmament negotiations for the time being because its nuclear
      strength is not at the same level as the U.S. or Russia.
    type: quote
    span: China’s nuclear strength is by no means at the same level with that of the U.S. or Russia. Thus, China
      will not take part in nuclear disarmament negotiations for the time-being
    span_verified: true
  - id: c12
    text: China called the expiration of New START truly regrettable and vital to global strategic stability.
    type: evaluative
    span: the expiration of New START is truly regrettable. The treaty is vital to global strategic stability
    span_verified: true
  - id: c13
    text: China hopes the U.S. will respond to Russia's proposal to continue adhering to the treaty's central limits
      and resume strategic stability dialogue with Russia.
    type: quote
    span: China hopes the U.S. will actively respond to Russia’s proposal, work out a responsible solution to the
      treaty’s expiration, and resume strategic stability dialogue with Russia
    span_verified: true
  - id: c14
    text: Trump said Xi would visit the White House toward the end of the year, but the Foreign Ministry said it
      had no information to share.
    type: attribution
    span: I have no information to share at the moment
    span_verified: true
  - id: c15
    text: The American Chamber of Commerce in Hong Kong released its 2026 Business Sentiment Survey Findings Report.
    type: actor
    span: the American Chamber of Commerce in Hong Kong released its 2026 Business Sentiment Survey Findings Report
    span_verified: true
  - id: c16
    text: According to the report, 86 percent of respondents believe Hong Kong is a competitive international business
      hub.
    type: numeric
    span: 86 percent of respondents believe that Hong Kong is a competitive international business hub
    span_verified: true
  - id: c17
    text: According to the report, 92 percent of respondents have no plans to relocate their headquarters away from
      Hong Kong.
    type: numeric
    span: 92 percent have no plans to relocate their headquarters away from Hong Kong
    span_verified: true
  - id: c18
    text: According to the report, 94 percent of respondents express confidence in Hong Kong's rule of law.
    type: numeric
    span: 94 percent express confidence in Hong Kong’s rule of law
    span_verified: true
  - id: c19
    text: The fourth plenary session of the 20th CPC Central Committee put forward measures to promote long-term
      prosperity and stability in Hong Kong.
    type: background
    span: The fourth plenary session of the 20th CPC Central Committee put forward a series of important measures
      to promote long-term prosperity and stability in Hong Kong
    span_verified: true
  - id: c20
    text: The U.S. officially launched a critical minerals trading alliance to be chaired by the ROK through June.
    type: numeric
    span: The U.S. officially launched a critical minerals trading alliance today, which will be chaired by the
      ROK through June
    span_verified: true
