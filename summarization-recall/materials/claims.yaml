    span: The four prefectures in southern Xinjiang, namely, Hotan, Kashgar, Aksu and Kizilsu Kirgiz
    span_verified: true
  - id: c4
    text: The paper attributes some local people's outdated ideas and poor employability to terrorists, separatists
      and religious extremists who preached ideas discouraging modern education and skills.
    type: attribution
    span: terrorists, separatists and religious extremists have long preached that "the afterlife is fated" and
      that "religious teachings are superior to state laws"
    span_verified: true
  - id: c5
    text: The document states that since the 18th National Congress of the Communist Party of China in 2012, Xinjiang
      has vigorously implemented employment projects and enhanced vocational training.
    type: background
    span: Especially since the 18th National Congress of the Communist Party of China (CPC) in 2012, Xinjiang has
      vigorously implemented employment projects
    span_verified: true
  - id: c6
    text: According to the report, the total number of people employed in Xinjiang rose from 11.35 million in 2014
      to 13.3 million in 2019, an increase of 17.2 percent.
    type: numeric
    span: the total number of people employed in Xinjiang rose from 11.35 million to 13.3 million, an increase of
      17.2 percent
    span_verified: true
  - id: c7
    text: The paper reports the workforce distribution ratio across three industries changed from 45.4:16.0:38.6
      in 2014 to 36.4:14.1:49.5 in 2019.
    type: numeric
    span: 'the ratio in 2014 was 45.4 : 16.0 : 38.6, which evolved to 36.4 : 14.1 : 49.5 in 2019'
    span_verified: true
  - id: c8
    text: The document states the number of people employed in cities and towns increased from 5.35 million in 2014
      to 7.34 million in 2019.
    type: numeric
    span: The number of people employed in cities and towns increased from 5.35 million in 2014 to 7.34 million
      in 2019
    span_verified: true
  - id: c9
    text: The white paper says Xinjiang provided training sessions to an average of 1.29 million urban and rural
      workers annually from 2014 to 2019.
    type: numeric
    span: Xinjiang provided training sessions to an average of 1.29 million urban and rural workers
    span_verified: true
  - id: c10
    text: According to the report, per capita disposable income of urban residents in Xinjiang rose from RMB23,200
      to RMB34,700 between 2014 and 2019.
    type: numeric
    span: 'urban residents: from RMB23,200 to RMB34,700 (an average annual nominal growth of 8.6 percent)'
    span_verified: true
  - id: c11
    text: The document states that from 2018 to 2019, 155,000 people from registered poor households in southern
      Xinjiang and impoverished regimental farms found employment outside their hometowns and emerged from poverty.
    type: numeric
    span: 155,000 people from registered poor households in southern Xinjiang and in four impoverished regimental
      farms of the Xinjiang Production and Construction Corps found employment outside their hometowns and subsequently
      emerged from poverty
    span_verified: true
  - id: c12
    text: The paper describes the Xinjiang Production and Construction Corps as a special entity entrusted by the
      state to cultivate and guard China's border area in Xinjiang.
    type: background
    span: a special entity entrusted by the state to cultivate and guard China's border area in Xinjiang
    span_verified: true
  - id: c13
    text: The document states Xinjiang has seized development opportunities from the Belt and Road Initiative to
      diversify its industrial structure.
    type: attribution
    span: Xinjiang has seized the development opportunities brought by the Belt and Road Initiative to diversify
      its industrial structure
    span_verified: true
  - id: c14
    text: The report says Xinjiang's textiles industry created 350,000 new jobs from 2017 to 2019.
    type: numeric
    span: which created 350,000 new jobs from 2017 to 2019
    span_verified: true
  - id: c15
    text: By the end of 2019, the Xinjiang Zhundong Economic and Technological Development Zone was providing employment
      for more than 80,000 people, according to the paper.
    type: numeric
    span: the development zone was providing employment for more than 80,000 people
    span_verified: true
  - id: c16
    text: The document states that from 2018 to June 2020, local government helped 221,000 people from registered
      poor households in southern Xinjiang find work outside their hometowns.
    type: numeric
    span: the local government helped 221,000 people from registered poor households in southern Xinjiang to find
      work outside their hometowns
    span_verified: true
  - id: c17
    text: The paper reports that in 2019, the employment rate of university graduates in Xinjiang reached 90.4 percent,
      a record high.
    type: numeric
    span: the employment rate of university graduates in Xinjiang reached 90.4 percent
    span_verified: true
  - id: c18
    text: The document states Xinjiang ensured that zero-employment households found jobs within 24 hours once identified,
      from 2014 to 2019.
    type: evaluative
    span: ensured that zero-employment households found jobs within 24 hours once they were identified
    span_verified: true
  - id: c19
    text: The paper states Xinjiang currently has 5 national-level and 27 provincial-level business incubation demonstration
      bases that fostered 1,412 micro and small businesses and created more than 10,000 jobs.
    type: numeric
    span: Xinjiang has 5 business incubation demonstration bases at national level and 27 at provincial and equivalent
      level, which have fostered 1,412 micro and small businesses and created more than 10,000 jobs
    span_verified: true
- doc_id: s018
  on_topic: true
  description: A Global Times opinion/report piece on China's mainland perspective regarding the DPP authorities
    in Taiwan, alleged collusion with foreign forces, and the CPC's Taiwan reunification policy.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: Taiwan has been an integral part of China's territory since ancient times.
    type: background
    span: The island of Taiwan has been an integral part of China's territory since ancient times
    span_verified: true
  - id: c2
    text: The DPP authorities refuse to recognize the one-China principle and distort and deny the 1992 Consensus.
    type: attribution
    span: refusing to recognize the one-China principle, distorting and denying the 1992 Consensus
    span_verified: true
  - id: c3
    text: The DPP has invited foreign anti-China politicians to visit Taiwan to raise the international visibility
      of the Taiwan question.
    type: attribution
    span: inviting foreign anti-China politicians to visit Taiwan in a vain attempt to raise the international visibility
      of the Taiwan question
    span_verified: true
  - id: c4
    text: Observers pointed out that the DPP has tried every trick to obstruct China's reunification process but
      is bound to fail.
    type: quote
    span: the DPP has tried every trick to obstruct China's reunification process, but it is bound to fail in the
      end
    span_verified: true
  - id: c5
    text: Some DPP members boasted that US and Japanese defense officials paid successive visits to Taiwan, highlighting
      the importance of Taiwan's strategic position.
    type: quote
    span: US and Japanese defense officials paid successive visits to Taiwan, highlighting "the importance of Taiwan's
      strategic position."
    span_verified: true
  - id: c6
    text: Analysts said external forces are using Taiwan as a pawn to obstruct the rejuvenation of the Chinese nation.
    type: quote
    span: these external forces are using Taiwan as a pawn to obstruct the rejuvenation of the Chinese nation
    span_verified: true
  - id: c7
    text: DPP authorities have constantly purchased outdated weapons from the US to reinforce their armed forces
      in pursuit of independence.
    type: attribution
    span: DPP authorities have constantly purchased outdated weapons from the US to reinforce its armed forces with
      the intention of pursuing "independence"
    span_verified: true
  - id: c8
    text: The DPP works with radical separatists to lobby for amendments to Taiwan's constitution and laws.
    type: attribution
    span: working with the radical separatists in and outside the DPP to lobby for amendments to their "constitution"
      and "laws"
    span_verified: true
  - id: c9
    text: The DPP employs internet ghostwriters, agenda-driven media, and NGOs and research institutions to propagate
      'Taiwan independence' and discredit the mainland.
    type: attribution
    span: employing internet ghostwriters and using agenda-driven media and so-called NGOs and research institutions
      to keep propagating "Taiwan independence"
    span_verified: true
  - id: c10
    text: The DPP presses for 'de-sinicization' and promotes 'incremental independence' by revising the history
      syllabus.
    type: evaluative
    span: the DPP constantly presses for "de-sinicization" and promotes "incremental independence", through revising
      history syllabus
    span_verified: true
  - id: c11
    text: Hung Hsiu-chu, a former head of the Kuomintang, told the Global Times that people in Taiwan have grown
      angry and lost confidence after Pelosi's visit.
    type: quote
    span: Hung Hsiu-chu, a former head of the Kuomintang told the Global Times in a recent interview
    span_verified: true
  - id: c12
    text: US House Speaker Nancy Pelosi made a provocative visit to Taiwan.
    type: actor
    span: US House Speaker Nancy Pelosi's provocative visit to the island
    span_verified: true
  - id: c13
    text: Experts said the DPP's actions have resulted in tension in cross-Straits relations, harming the interests
      and well-being of people on both sides.
    type: quote
    span: the actions of the DPP authorities have resulted in tension of cross-Straits relations, ultimately harming
      the interests and well-being of the people
    span_verified: true
  - id: c14
    text: After the 18th CPC National Congress in 2012, China's Communists under Xi Jinping took a holistic approach
      to cross-Straits relations.
    type: numeric
    span: After the 18th CPC National Congress in 2012, China's Communists, under the leadership of Xi Jinping,
      took a holistic approach to cross-Straits relations
    span_verified: true
  - id: c15
    text: The CPC developed its overall policy for resolving the Taiwan question in the new era, setting out an
      overarching guideline and program of action.
    type: attribution
    span: The CPC developed its overall policy for resolving the Taiwan question in the new era, and set out the
      overarching guideline and a program of action
    span_verified: true
  - id: c16
    text: Since the 18th National Congress, the CPC and Chinese government have facilitated dialogue, consultations,
      and exchanges with political parties, organizations, and individuals in Taiwan.
    type: attribution
    span: the CPC and the Chinese government have facilitated dialogue, consultations, and in-depth exchanges of
      views on cross-Straits relations
    span_verified: true
  - id: c17
    text: The two sides of the Straits have held exchange events such as the Straits Forum after overcoming the
      impact of COVID-19.
    type: background
    span: Having overcome the impact of COVID-19, the two sides of the Straits have held a number of exchange events
      such as the Straits Forum
    span_verified: true
  - id: c18
    text: Taiwan belongs to all the Chinese people, including the 23 million Taiwan compatriots.
    type: numeric
    span: Taiwan belongs to all the Chinese people, including the 23 million Taiwan compatriots
    span_verified: true
  - id: c19
    text: The Chinese people are firm in their resolve to safeguard China's sovereignty and territorial integrity.
    type: evaluative
    span: The Chinese people are firm in their resolve to safeguarding China's sovereignty and territorial integrity
    span_verified: true
- doc_id: s020
  on_topic: true
  description: Xinhua feature article on Macao's development and identity ahead of the 25th anniversary of its 1999
    handover from Portugal to China.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Macao transitioned peacefully from Portuguese rule to a special administrative region of China on Dec.
      20, 1999.
    type: numeric
    span: Since its peaceful transition from Portuguese rule to a special administrative region (SAR) of China on
      Dec. 20, 1999
    span_verified: true
  - id: c2
    text: In the 1980s, late Chinese leader Deng Xiaoping elaborated on the concept of 'one country, two systems.'
    type: actor
    span: In the 1980s, late Chinese leader Deng Xiaoping elaborated on the concept of "one country, two systems."
    span_verified: true
  - id: c3
    text: Macao's gaming industry, previously a monopoly, was liberalized in 2002, opening the market to more operators.
    type: numeric
    span: The industry, which had previously been a monopoly, was liberalized in 2002, opening the market to more
      operators
    span_verified: true
  - id: c4
    text: By 2006, Macao's gaming revenue had surpassed that of Las Vegas, making it the world's largest gaming
      hub.
    type: numeric
    span: By 2006, Macao's gaming revenue had surpassed that of Las Vegas, solidifying its position as the world's
      largest gaming hub
    span_verified: true
  - id: c5
    text: Over 400 laws have been enacted or amended in the SAR since 1999, including a national security law adopted
      in 2009.
    type: numeric
    span: Over 400 laws have been enacted or amended in the SAR since 1999, including the adoption of a national
      security law in 2009
    span_verified: true
  - id: c6
    text: Kou Hoi In, Macao's top legislator, said there is a clear consensus among lawmakers on national security
      laws because what benefits the country benefits Macao.
    type: quote
    span: there is a clear consensus among lawmakers that what benefits the country benefits Macao," said Kou Hoi
      In, Macao's top legislator
    span_verified: true
  - id: c7
    text: The social unrest in Hong Kong in 2019 has been cited as underscoring the importance of safeguarding national
      security to maintain stability.
    type: evaluative
    span: the social unrest in Hong Kong in 2019 has been cited as a moment that underscored the importance of fulfilling
      constitutional requirements
    span_verified: true
  - id: c8
    text: In 1999, Macao, with a population of about 437,000, recorded 49 murders and 65 kidnappings in a year.
    type: numeric
    span: In 1999, Macao, then with a population of about 437,000, recorded 49 murders and 65 kidnappings in a year
    span_verified: true
  - id: c9
    text: Since 2003, Macao has maintained a record of zero or very low incidents of serious violent crime.
    type: numeric
    span: Since 2003, however, the city has maintained a record of zero or very low incidents of serious violent
      crime
    span_verified: true
  - id: c10
    text: Wong Sio Chak, secretary for security of the Macao SAR government, said strong central government support
      serves as a deterrent against illegal activities.
    type: quote
    span: strong support from the central government serves as a formidable safeguard and deterrent against illegal
      activities
    span_verified: true
  - id: c11
    text: Macao's GDP per capita was ranked around 40th globally in 1999, and it is now the second-richest place
      in the world after Luxembourg, according to Forbes.
    type: numeric
    span: Its GDP per capita was ranked around 40th globally in 1999. Now Macao is the second-richest place in the
      world after Luxembourg, according to a Forbes magazine ranking
    span_verified: true
  - id: c12
    text: Tourism expanded from 6.6 million visitors in 1999 to 39.4 million in 2019.
    type: numeric
    span: Tourism has expanded dramatically, from 6.6 million visitors in 1999 to 39.4 million in 2019
    span_verified: true
  - id: c13
    text: Macao's average life expectancy is now 83.1 years, among the highest globally.
    type: numeric
    span: The city now boasts an average life expectancy of 83.1 years, among the highest globally
    span_verified: true
  - id: c14
    text: Macao's unemployment rate has averaged below 2 percent since 2012, signaling nearly full employment.
    type: numeric
    span: Its unemployment rate averaged below 2 percent since 2012, signaling nearly full employment
    span_verified: true
  - id: c15
    text: As of 2023, non-gaming sectors accounted for over 60 percent of Macao's GDP under the '1+4' diversification
      strategy.
    type: numeric
    span: As of 2023, non-gaming sectors had accounted for over 60 percent of Macao's GDP
    span_verified: true
  - id: c16
    text: Macao maintains trade ties with more than 120 countries and regions and is a member of over 190 international
      organizations.
    type: numeric
    span: Macao now maintains trade ties with more than 120 countries and regions and is a member of over 190 international
      organizations
    span_verified: true
  - id: c17
    text: Holders of a Macao SAR passport are granted visa-free or visa-on-arrival access to 147 countries and territories.
    type: numeric
    span: Holders of a Macao SAR passport are granted visa-free or visa-on-arrival access to 147 countries and territories
    span_verified: true
  - id: c18
    text: In 2021, the Guangdong-Macao In-Depth Cooperation Zone was launched on the neighboring Hengqin island.
    type: numeric
    span: That same year, the Guangdong-Macao In-Depth Cooperation Zone was launched on the neighboring Hengqin
      island
    span_verified: true
  - id: c19
    text: The Cooperation Zone has expanded Macao's development space by over 100 square kilometers and serves over
      6,500 Macao-funded enterprises.
    type: numeric
    span: The zone, which has expanded Macao's development space by over 100 square kilometers, now serves as a
      critical platform for over 6,500 Macao-funded enterprises
    span_verified: true
  - id: c20
    text: Carlos Cid Alvares, president of the Macao Delegation of the Portugal-China Chamber of Commerce and Industry,
      said he talks about the 80 million people in the Greater Bay Area rather than Macao's 700,000 residents.
    type: quote
    span: '"So I never talked about the 700,000 residents in Macao," he said. "I talk about 80 million people in
      the Greater Bay Area."'
    span_verified: true
- doc_id: s021
  on_topic: true
  description: Human Rights Watch report marking the five-year anniversary of the Myanmar military's 2017 campaign
    against Rohingya Muslims, detailing ongoing abuses and calling for accountability.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: The Myanmar military began a sweeping campaign of massacres, rape, and arson in northern Rakhine State
      on August 25, 2017.
    type: numeric
    span: began a sweeping campaign of massacres, rape, and arson in northern Rakhine State on August 25, 2017
    span_verified: true
  - id: c2
    text: More than 730,000 Rohingya fled to camps in Bangladesh, while about 600,000 remain under oppressive rule
      in Myanmar.
    type: numeric
    span: More than 730,000 Rohingya fled to precarious, flood-prone camps in Bangladesh, while about 600,000 remain
    span_verified: true
  - id: c3
    text: No one has been held accountable for the crimes against humanity and acts of genocide committed against
      the Rohingya population.
    type: evaluative
    span: No one has been held accountable for the crimes against humanity and acts of genocide
    span_verified: true
  - id: c4
    text: Elaine Pearson, acting Asia director at Human Rights Watch, called for a coordinated international strategy
      for accountability and justice.
    type: quote
    span: Governments should mark the five-year anniversary of the devastating campaign against the Rohingya with
      a coordinated international strategy
    span_verified: true
  - id: c5
    text: Security forces killed thousands and burned down nearly 400 villages.
    type: numeric
    span: the security forces killed thousands and burned down nearly 400 villages
    span_verified: true
  - id: c6
    text: Abdul Halim, a 30-year-old Rohingya refugee, described Myanmar authorities burning houses, raping women,
      and burning children.
    type: quote
    span: They burned down our houses, raped our mothers and sisters, burned our children
    span_verified: true
  - id: c7
    text: Rohingya are effectively denied citizenship under Myanmar's 1982 Citizenship Law, rendering them stateless.
    type: background
    span: Rohingya are effectively denied citizenship under Myanmar’s 1982 Citizenship Law, rendering them stateless
    span_verified: true
  - id: c8
    text: In February 2021, generals who orchestrated the 2017 atrocities staged a coup and detained Myanmar's elected
      civilian leaders.
    type: actor
    span: the generals who had orchestrated the atrocities against the Rohingya staged a coup and detained Myanmar’s
      elected civilian leaders
    span_verified: true
  - id: c9
    text: Since the coup, security forces have arrested an estimated 2,000 Rohingya, including hundreds of children,
      for 'unauthorized travel.'
    type: numeric
    span: security forces have arrested an estimated 2,000 Rohingya, hundreds of them children, for “unauthorized
      travel.”
    span_verified: true
  - id: c10
    text: About one million Rohingya refugees live in camps in Cox's Bazar and Bhasan Char in Bangladesh.
    type: numeric
    span: about one million Rohingya refugees live in sprawling, overcrowded camps in Cox’s Bazar and the isolated
      silt island of Bhasan Char
    span_verified: true
  - id: c11
    text: Bangladesh authorities have moved about 28,000 Rohingya to Bhasan Char, where they face severe movement
      restrictions.
    type: numeric
    span: Bangladesh authorities have moved about 28,000 Rohingya to Bhasan Char, where they face severe movement
      restrictions
    span_verified: true
  - id: c12
    text: The 2022 Joint Response Plan for the Rohingya humanitarian crisis has received only a quarter of its requested
      $881 million in funding.
    type: numeric
    span: received only a quarter of its requested US$881 million in funding
    span_verified: true
  - id: c13
    text: Michelle Bachelet, the outgoing UN high commissioner for human rights, said conditions are not right for
      returns following a visit to Cox's Bazar.
    type: quote
    span: the current situation across the border means that conditions are not right for returns
    span_verified: true
  - id: c14
    text: Mohammad Ayaz, 21, was shot while fleeing his village of Tula Toli on August 30, 2017, and lost at least
      12 family members.
    type: numeric
    span: Mohammad was shot while fleeing his village of Tula Toli on August 30, 2017. At least 12 members of his
      family
    span_verified: true
  - id: c15
    text: The EU sanctioned the junta-controlled Myanmar Oil and Gas Enterprise in February.
    type: attribution
    span: The EU sanctioned the junta-controlled Myanmar Oil and Gas Enterprise in February
    span_verified: true
  - id: c16
    text: Canada and the Netherlands have publicly declared their intention to support the Gambia v. Myanmar genocide
      case at the International Court of Justice.
    type: actor
    span: Canada and the Netherlands have publicly declared their intention to support the proceedings
    span_verified: true
  - id: c17
    text: The Argentine judiciary has opened an investigation into Myanmar's atrocities against the Rohingya under
      universal jurisdiction.
    type: attribution
    span: The Argentine judiciary has opened an investigation into Myanmar’s atrocities against the Rohingya under
      universal jurisdiction
    span_verified: true
  - id: c18
    text: Pearson said the junta's killing of demonstrators reflects the failure to hold generals accountable for
      their atrocities of five years ago.
    type: quote
    span: reflect in large measure the failure to hold the generals accountable for their atrocities of five years
      ago
    span_verified: true
  - id: c19
    text: The Myanmar military's gas revenues, its largest source of foreign income, total about $1 billion in annual
      profits.
    type: numeric
    span: its largest source of foreign income, totaling about $1 billion in annual profits
    span_verified: true
- doc_id: s023
  on_topic: true
  description: BBC feature on South Korea's history of martial law and public reaction to President Yoon Suk Yeol's
    December 2024 martial law declaration.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Koh Jae-hak recalls seeing policemen gunning down a group of young women in April 1960 during protests
      against President Syngman Rhee.
    type: quote
    span: saw policemen gunning down a group of young women in cold blood
    span_verified: true
  - id: c2
    text: South Korea experienced 16 bouts of martial law during its first four decades, largely under dictatorial
      rule.
    type: numeric
    span: 16 bouts of martial law during its first four decades ruled largely by dictators
    span_verified: true
  - id: c3
    text: President Yoon Suk Yeol's declaration of martial law was the first in 45 years and the first during democratic
      rule.
    type: numeric
    span: the first to happen in 45 years and during democratic rule
    span_verified: true
  - id: c4
    text: Lawmakers rushed to the national assembly, climbing fences, to reverse the martial law declaration.
    type: attribution
    span: lawmakers jumped out of bed and rushed to the national assembly, clambering over fences to reverse martial
      law
    span_verified: true
  - id: c5
    text: Hundreds of ordinary citizens gathered to hold back troops ordered to remove MPs from the assembly.
    type: numeric
    span: Hundreds of ordinary citizens gathered to hold back troops who had been ordered to throw out MPs
    span_verified: true
  - id: c6
    text: Yoon said the martial law declaration was necessary to eliminate 'pro-North anti-state' forces.
    type: quote
    span: he said it was necessary to get rid of "pro-North anti-state" forces
    span_verified: true
  - id: c7
    text: Yoon gave no evidence of such forces and did not explain who they were, leading the public to conclude
      he was trying to crush political opponents.
    type: evaluative
    span: the public concluded he was actually trying to crush his political foes
    span_verified: true
  - id: c8
    text: In 1980, President Chun Doo-hwan extended martial law to suppress student protesters in Gwangju calling
      for democracy.
    type: actor
    span: then President Chun Doo-hwan extended martial law to deal with student protesters calling for democracy
      in the southern city of Gwangju
    span_verified: true
  - id: c9
    text: The Gwangju crackdown has since been labelled a massacre, with an official death toll of 193, though some
      experts believe hundreds more died.
    type: numeric
    span: the official death toll is 193, some experts believe hundreds more died
    span_verified: true
  - id: c10
    text: South Korea transitioned to democracy in 1988 with its first free and fair presidential election.
    type: numeric
    span: South Korea eventually transitioned to democracy in 1988, when the government held its first free and
      fair presidential election
    span_verified: true
  - id: c11
    text: Kelly Kim, a 53-year-old environmental activist, said most Koreans have deep trauma about martial law.
    type: quote
    span: '"Most Koreans have trauma, deep trauma, about martial law," said Kelly Kim'
    span_verified: true
  - id: c12
    text: The 2023 film '12.12 The Day', starring Hwang Jung-min, depicts the 1979 political chaos following the
      assassination of President Park Chung-hee.
    type: background
    span: last year's 12.12 The Day, a historical drama starring popular actor Hwang Jung-min
    span_verified: true
  - id: c13
    text: Marina Kang, a 37-year-old web designer, said Yoon's declaration reminded her of the film and made her
      question whether history was repeating.
    type: quote
    span: it made me question, are we about to repeat that history now?
    span_verified: true
  - id: c14
    text: 15-year-old Kwon Hoo said he was initially excited about a possible day off school but then overwhelmed
      by fear and unable to sleep.
    type: quote
    span: I was overwhelmed by the fear of daily life collapsing. I couldn't sleep
    span_verified: true
  - id: c15
    text: Mason Richey, associate professor at Hankuk University of Foreign Studies, said the vast majority of Koreans
      appreciate democracy and regret the authoritarianism of the post-war period.
    type: quote
    span: The vast majority of Koreans appreciate democracy enormously and regret the authoritarianism of the post-war
      period
    span_verified: true
  - id: c16
    text: Richey said the country remains divided over how justified certain repressive measures were to prevent
      communist subversion.
    type: quote
    span: the country remains very divided regarding numerous aspects of the authoritarian past
    span_verified: true
  - id: c17
    text: Kang Hyo-san, 83, said past martial law was necessary during ideological warfare between democracy and
      communist socialism and helped restore order.
    type: quote
    span: it was a process to restore order and properly establish free democracy
    span_verified: true
  - id: c18
    text: Kang Hyo-san argued South Korea's martial law differed from other nations because it wasn't about killing
      people or senseless violence.
    type: evaluative
    span: it "wasn't about killing people or senseless violence"
