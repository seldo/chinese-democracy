    issues.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Michelle Bachelet is the UN High Commissioner for Human Rights and addressed the 40th session of the UN
      Human Rights Council in Geneva on 6 March 2019.
    type: actor
    span: UN High Commissioner for Human Rights Michelle Bachelet addresses the 40th session of the UN Human Rights
      Council
    span_verified: true
  - id: c2
    text: Bachelet presented the report on the work of her Office in 2018, including 74 field presences.
    type: numeric
