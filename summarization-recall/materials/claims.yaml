    span_verified: true
- doc_id: s030
  on_topic: true
  description: A Guardian-style news report chronicling day-by-day protests across Iran following the death of Mahsa
    Amini in police custody in September 2022.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: Mahsa Amini, a 22-year-old Kurdish woman, died in police custody after being arrested under Iran's hijab
      laws.
    type: background
    span: Mahsa Amini, a 22-year-old Kurdish woman, died in police custody after being arrested by police under
      Iran’s harsh hijab laws
    span_verified: true
  - id: c2
    text: The first protest occurred in front of Kasra hospital shortly after news of Amini's death was published.
    type: numeric
    span: The first protest, in front of Kasra hospital, began shortly after news of Mahsa Amini’s death was published
    span_verified: true
  - id: c3
    text: Protesters chanted slogans including 'Khamenei is a murderer, his government is invalid.'
    type: quote
    span: Khamenei is a murderer, his government is invalid
    span_verified: true
  - id: c4
    text: Thousands of people attended Amini's funeral in Saqqez, where women took off their headscarves en masse.
    type: numeric
    span: In Saqqez, thousands of people attended Amini’s funeral. Women took off their headscarves en masse
    span_verified: true
  - id: c5
    text: Many protesters in Saqqez were beaten, and at least 13 were hit by gunfire.
    type: numeric
    span: Many protesters were beaten, and at least 13 were hit by gunfire
    span_verified: true
  - id: c6
    text: A witness told the Guardian that by 8pm the crowd around Vali Asr Square numbered 3,000 to 4,000 people.
    type: quote
    span: by 8pm, the crowd around Vali Asr Square numbered 3,000 to 4,000 people
    span_verified: true
  - id: c7
    text: Kaveh Kermanshahi of the Kurdistan Human Rights Network said at least three Kurdish citizens were killed
      after security forces opened fire on crowds.
    type: attribution
    span: Kaveh Kermanshahi, a Berlin-based director of the Kurdistan Human Rights Network, said that at least three
      Kurdish citizens were killed after security forces opened fire on crowds
    span_verified: true
  - id: c8
    text: Mohsen Mohammadi, Faridun Mahmoudi and Reza Lotfi were named as killed during protests in Kurdistan province.
    type: actor
    span: Mohsen Mohammadi, Faridun Mahmoudi and Reza Lotfi were killed during protests in the cities of Diwandara,
      Saqqez and Dehgolan
    span_verified: true
  - id: c9
    text: Kermanshahi said more than 85 people were wounded and at least 215 people were arrested in Kurdistan protests
      on 19 September.
    type: numeric
    span: more than 85 people were wounded in the protests on 19 September in cities across Kurdistan, and at least
      215 people were arrested
    span_verified: true
  - id: c10
    text: A 10-year-old girl was shot and seriously wounded by government forces in Bukan.
    type: numeric
    span: a 10-year-old girl who was shot and seriously wounded by government forces in Bukan
    span_verified: true
  - id: c11
    text: Front Line Defenders confirmed the arrest of at least eight women's rights and civil rights activists
      in Kurdistan province.
    type: attribution
    span: at least eight women’s rights and civil rights activists have been arrested in Kurdistan province
    span_verified: true
  - id: c12
    text: Fatemeh Karim of the Kurdistan Human Rights Network confirmed that three more protesters died after being
      shot by anti-riot forces.
    type: attribution
    span: Fatemeh Karim, of Kurdistan Human Rights Network, confirmed that three more protesters died after being
      shot by anti-riot forces
    span_verified: true
  - id: c13
    text: Farjad Darvishi, a 23-year-old, was killed in Urmia, and 16-year-old Zakariya Khiyal was killed in Piranshahr.
    type: numeric
    span: Farjad Darvishi, a 23-year-old, was killed in the Vali Asr neighbourhood of Urmia, and 16-year-old Zakariya
      Khiyal in Piranshahr
    span_verified: true
  - id: c14
    text: Nilufar Hamedi, a reporter for Al Sharq newspaper who broke the story about Amini, was arrested in Tehran.
    type: actor
    span: Nilufar Hamedi, a reporter for Al Sharq newspaper, was arrested in Tehran
    span_verified: true
  - id: c15
    text: Iran Human Rights, based in Norway, reported the death of at least 31 protesters between 16 and 22 September.
    type: numeric
    span: IHR reported the death of at least 31 protesters between 16 and 22 September
    span_verified: true
  - id: c16
    text: More than 530 people have been arrested in Kurdish regions of Iran during the past week, according to
      Fatemeh Karim.
    type: numeric
    span: More than 530 people have been arrested in Kurdish regions of Iran, including Kurdistan, Kermanshah, Ilam
      and West Azerbaijan provinces, during the past week
    span_verified: true
  - id: c17
    text: Protests flared in Tehran market, described as the scene of demonstrations that proved a turning point
      in the 1979 revolution.
    type: evaluative
    span: Protests also flared in Tehran market, the scene of demonstrations that proved a turning point in the
      1979 revolution
    span_verified: true
  - id: c18
    text: A girl's act of removing her scarf on Keshavarz Boulevard echoed the image of Vida Movahedi, arrested
      in 2017 for waving her hijab.
    type: background
    span: echoed an image of Vida Movahedi, a young Iranian woman who was photographed waving her hijab on a pole
      above the crowd during demonstrations in 2017 before being arrested
    span_verified: true
  - id: c19
    text: Mobile phone signals and the internet were cut off in a number of cities in Kurdistan.
    type: numeric
    span: Mobile phone signals and the internet were cut off in a number of cities in Kurdistan
    span_verified: true
