  description: New York Times article on Apple's strong Q3 2017 financial results, stock surge, and outlook for
    the upcoming iPhone anniversary launch amid broader tech giant growth trends.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Apple's stock surged 5 percent to a record high of $157.14 after strong financial results.
    type: numeric
    span: Apple's stock surged 5 percent to a record high of $157.14
    span_verified: true
  - id: c2
    text: Apple is now worth $822 billion, more than any other company in the stock market.
    type: numeric
    span: It is now worth $822 billion, more than any other company in the stock market
    span_verified: true
  - id: c3
    text: Apple is set to release a new lineup of iPhones this fall on the 10th anniversary of the original model.
    type: background
