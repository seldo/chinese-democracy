  on_topic: true
  description: CNBC report on Tesla's Q4 and full-year 2025 vehicle production and delivery figures, market context,
    and related company developments.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: Tesla posted its fourth-quarter 2025 vehicle production and deliveries report on Friday, marking a second
      annual decline.
    type: numeric
    span: marking a second annual decline for Elon Musk's automaker
    span_verified: true
  - id: c2
    text: Tesla shares closed 2.59% lower on the day.
    type: numeric
    span: Shares closed 2.59% lower on the day
    span_verified: true
  - id: c3
    text: Total Q4 2025 deliveries were 418,227 and total Q4 production was 434,358.
    type: numeric
    span: 'Total Q4 deliveries: 418,227'
    span_verified: true
  - id: c4
    text: Total 2025 deliveries were 1.64 million and total 2025 production was 1.65 million.
    type: numeric
    span: 'Total 2025 deliveries: 1.64 million'
    span_verified: true
  - id: c5
    text: Wall Street expected 426,000 deliveries for the quarter, according to estimates compiled by StreetAccount.
    type: numeric
    span: Wall Street expected 426,000 deliveries for the quarter, according to estimates compiled by StreetAccount
    span_verified: true
  - id: c6
    text: Deliveries for Q4 2025 were about 16% lower than the fourth quarter of 2024, when Tesla reported 495,570
      vehicles.
    type: numeric
    span: Deliveries for Q4 2025 were about 16% lower than the fourth quarter of 2024, when Musk's EV company reported
      495,570
    span_verified: true
  - id: c7
    text: For the full year, Tesla's deliveries fell 8.6% to 1.64 million from 1.79 million in 2024.
    type: numeric
    span: Tesla's deliveries fell 8.6% to 1.64 million from 1.79 million in 2024
    span_verified: true
  - id: c8
    text: Deliveries of the Model 3 and Model Y amounted to 406,585 in the fourth quarter, about 97% of total deliveries.
    type: numeric
    span: amounted to 406,585 in the fourth quarter, or about 97% of total deliveries
    span_verified: true
  - id: c9
    text: SpaceX reportedly purchased tens of millions of dollars worth of Cybertrucks in 2025.
    type: attribution
    span: SpaceX, reportedly purchased tens of millions of dollars worth of Cybertrucks in 2025
    span_verified: true
  - id: c10
    text: BYD topped Tesla as the world's biggest seller of EVs in a calendar year, with sales growing 28% to 2.26
      million units.
    type: numeric
    span: sales grew 28% to 2.26 million units
    span_verified: true
  - id: c11
    text: Tesla deployed 14.2 gigawatt hours of battery energy storage products in the fourth quarter, following
      a prior record of 12.5 GWh.
    type: numeric
    span: deployed 14.2 gigawatt hours of battery energy storage products in the fourth quarter, following a record
      in the prior period, when it deployed 12.5 GWh
    span_verified: true
  - id: c12
    text: Tesla will report its fourth-quarter financial results on Jan. 28.
    type: background
    span: Tesla will report its fourth-quarter financial results on Jan. 28
    span_verified: true
  - id: c13
    text: Sales of Tesla's cars were impacted by President Donald Trump's decision to end a federal EV incentive
      by Sept. 30, earlier than previously planned.
    type: attribution
    span: impacted by President Donald Trump's decision to end a federal EV incentive by Sept. 30, earlier than
      previously planned
    span_verified: true
  - id: c14
    text: Musk spent the first quarter of the year leading the president's DOGE initiative to slash the federal
      workforce.
    type: actor
    span: Musk spent the first quarter of the year leading the president's DOGE initiative to slash the federal
      workforce
    span_verified: true
  - id: c15
    text: Musk endorsed Germany's extremist anti-immigrant party, AfD, and later supported British activist Tommy
      Robinson, and has called to abolish the European Union.
    type: evaluative
    span: Musk also endorsed Germany's extremist anti-immigrant party, AfD, and later supported British anti-Muslim
      and anti-immigration activist Tommy Robinson
    span_verified: true
  - id: c16
    text: Partly in response to Musk's rhetoric, Tesla has faced an enduring consumer backlash in Europe and the
      U.S.
    type: attribution
    span: Partly in response to Musk's incendiary rhetoric, Tesla has faced an enduring consumer backlash in Europe
      and the U.S
    span_verified: true
  - id: c17
    text: Tesla shares rallied in the second half of the year, jumping 40% in the third quarter and reaching a fresh
      record in mid-December.
    type: numeric
    span: jumping 40% in the third quarter, reaching a fresh record in mid-December
    span_verified: true
  - id: c18
    text: Shareholders approved a new $1 trillion pay plan for Musk in November after he threatened to potentially
      leave Tesla if the plan didn't pass.
    type: quote
    span: Shareholders approved a new $1 trillion pay plan for Musk in November that will give the CEO more shares
      and increased control
    span_verified: true
  - id: c19
    text: Critics voiced concerns that the pay plan doesn't require Musk to spend a minimum amount of time on Tesla
      work and has no limits on his political activity.
    type: evaluative
    span: Critics voiced concerns that the plan doesn't require Musk to spend a minimum amount of time on his Tesla
      work
    span_verified: true
  - id: c20
    text: Tesla's European registrations fell 39% in the first 11 months of 2025, while BYD's registrations rose
      240% in Europe.
    type: numeric
    span: Tesla's European registrations fell 39% in the first 11 months of 2025, while Chinese rival BYD saw registrations
      rise 240% in Europe
    span_verified: true
