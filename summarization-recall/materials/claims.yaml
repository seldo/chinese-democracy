  on_topic: true
  description: BBC News article reporting on the announcement by US scientists at the National Ignition Facility
    (LLNL) of a nuclear fusion breakthrough achieving net energy gain.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: US scientists announced a major breakthrough in the effort to recreate nuclear fusion.
    type: actor
    span: A major breakthrough has been announced by US scientists in the race to recreate nuclear fusion
    span_verified: true
  - id: c2
    text: On Tuesday researchers confirmed they produced more energy from a fusion experiment than was put in.
    type: numeric
    span: researchers confirmed they have overcome a major barrier - producing more energy from a fusion experiment
      than was put in
    span_verified: true
  - id: c3
    text: The experiment took place at the National Ignition Facility at the Lawrence Livermore National Laboratory
      in California.
    type: background
    span: The experiment took place at the National Ignition Facility at the Lawrence Livermore National Laboratory
      (LLNL) in California
    span_verified: true
  - id: c4
    text: LLNL director Dr Kim Budil called the achievement historic, noting it took 60 years and contributions
      from thousands of people.
    type: quote
    span: This is a historic achievement… over the past 60 years thousands of people have contributed to this endeavour
    span_verified: true
  - id: c5
    text: Nuclear fusion is described as the 'holy grail' of energy production, the process that powers the Sun
      and other stars.
    type: evaluative
    span: Nuclear fusion is described as the "holy grail" of energy production
    span_verified: true
  - id: c6
    text: Fusion works by forcing pairs of light atoms together, releasing a lot of energy, and is the opposite
      of nuclear fission, which splits heavy atoms apart.
    type: background
    span: It works by taking pairs of light atoms and forcing them together - this "fusion" releases a lot of energy
    span_verified: true
  - id: c7
    text: Fission, used in current nuclear power stations, produces waste that continues to give out radiation for
      a long time and must be stored safely.
    type: background
    span: Fission is the technology currently used in nuclear power stations, but the process also produces waste
      that continues to give out radiation for a long time
    span_verified: true
  - id: c8
    text: Nuclear fusion produces far more energy than fission, only small amounts of short-lived radioactive waste,
      and no greenhouse gas emissions.
    type: evaluative
    span: Nuclear fusion produces far more energy, and only small amounts of short-lived radioactive waste
    span_verified: true
  - id: c9
    text: The National Ignition Facility is described as a $3.5bn (£2.85bn) experiment.
    type: numeric
    span: The National Ignition Facility in California is a $3.5bn (£2.85bn) experiment
    span_verified: true
  - id: c10
    text: The facility uses a powerful 192-beam laser to heat and compress hydrogen fuel in a capsule the size of
      a peppercorn.
    type: numeric
    span: a powerful 192-beam laser is used to heat and compress the hydrogen fuel
    span_verified: true
  - id: c11
    text: The laser can heat the capsule to 100 million degrees Celsius and compress it to more than 100 billion
      times Earth's atmospheric pressure.
    type: numeric
    span: The laser is so strong it can heat the capsule to 100 million degrees Celsius
    span_verified: true
  - id: c12
    text: Dr Marvin Adams said the lasers input 2.05 megajoules of energy, producing 3.15 megajoules of fusion energy
      output.
    type: numeric
    span: the laboratory's lasers had input 2.05 megajoules (MJ) of energy to the target, which had then produced
      3.15 MJ of fusion energy output
    span_verified: true
  - id: c13
    text: Dr Melanie Windridge, CEO of Fusion Energy Insights, said the results put the field on the path to commercialisation
      of the technology.
    type: quote
    span: These results today really put us on the path to the commercialisation of the technology
    span_verified: true
  - id: c14
    text: Jeremy Chittenden of Imperial College London called it 'a true breakthrough moment' proving the 'holy
      grail' of fusion can be achieved.
    type: quote
    span: It proves that the long sought-after goal, the 'holy grail' of fusion, can indeed be achieved
    span_verified: true
  - id: c15
    text: Prof Gianluca Gregori of the University of Oxford said the success rests on work by many scientists in
      the US, UK, and around the world.
    type: quote
    span: Today's success rests upon the work done by many scientists in the US, UK and around the world
    span_verified: true
  - id: c16
    text: Dr Budil said a few decades of concerted research and investment could put us in a position to build a
      power plant, an improvement from previous estimates of 50-60 years.
    type: quote
    span: a few decades of research on the underlying technologies could put us in a position to build a power plant
    span_verified: true
  - id: c17
    text: The experiment produced only enough energy to boil about 15-20 kettles.
    type: numeric
    span: The experiment was only able to produce enough energy to boil about 15-20 kettles
    span_verified: true
  - id: c18
    text: The energy gain did not include the energy needed to power the lasers, which was far greater than the
      energy the hydrogen produced.
    type: evaluative
    span: this did not include the energy needed to make the lasers work - which was far greater than the amount
      of energy the hydrogen produced
    span_verified: true
  - id: c19
    text: The article was updated on January 9, 2023 to remove a claim that 'a lot' of nuclear waste is produced
      by fission.
    type: background
    span: This article was updated to remove that 'a lot' of nuclear waste is produced by Fission
    span_verified: true
- doc_id: s060
  on_topic: true
  description: A sports news article describing a Knicks-Spurs NBA Finals Game 3 at Madison Square Garden, covering
    the celebrity/political atmosphere and game details.
  n_claims: 20
  n_span_verified: 20
  claims:
  - id: c1
    text: The game was New York City's first home NBA finals game since 25 June 1999.
    type: numeric
    span: New York City’s first home NBA finals game since 25 June 1999
    span_verified: true
  - id: c2
    text: The San Antonio Spurs snapped the Knicks' 13-game postseason winning streak with a 115-111 victory.
    type: numeric
    span: snapped the Knicks’ 13-game postseason winning streak with a 115-111 victory
    span_verified: true
  - id: c3
    text: The win cut the deficit to 2-1 in the finals series.
    type: numeric
    span: cutting the deficit to 2-1 in this year’s finals
    span_verified: true
  - id: c4
    text: Game 4 is scheduled for Wednesday in New York.
    type: background
    span: Game 4 is Wednesday in New York
    span_verified: true
  - id: c5
    text: Victor Wembanyama finished with 32 points, eight rebounds, six assists and three blocks.
    type: numeric
    span: finishing with 32 points, eight rebounds, six assists and three blocks
    span_verified: true
  - id: c6
    text: Stephon Castle had 23 points and hit two free throws with 6.8 seconds left.
    type: numeric
    span: Stephon Castle, who had 23 points, hit two free throws with 6.8 seconds left
    span_verified: true
  - id: c7
    text: Jalen Brunson scored 32 points and OG Anunoby added 28 for the Knicks.
    type: numeric
    span: Jalen Brunson fueled the Knicks with 32 points and OG Anunoby added 28
    span_verified: true
  - id: c8
    text: Wembanyama said he really tried to relax after Game 2 and needed time off to let his brain cool down.
    type: quote
    span: “Really tried to relax [after Game 2]. The playoffs, it’s like ... a whirlwind
    span_verified: true
  - id: c9
    text: Wembanyama scored nine points in his first nine minutes of Game 3.
    type: numeric
    span: scoring nine points in his first nine minutes
    span_verified: true
  - id: c10
    text: Wembanyama said 'At home it really feels like playing six against five. Here it feels like five against
      six.'
    type: quote
    span: “At home it really feels like playing six against five. Here it feels like five against six”
    span_verified: true
  - id: c11
    text: New York's postseason run is described as coming amid the fervor of a city anxiously hoping for its first
      NBA championship since 1973.
    type: background
    span: a city anxiously hoping for its first NBA championship since 1973
    span_verified: true
  - id: c12
    text: Donald Trump, a longtime Knicks fan invited as a guest of team owner James Dolan, received heavy boos
      when he appeared on the jumbotron.
    type: actor
    span: Donald Trump, a longtime Knicks fan invited as a guest of team owner James Dolan, watched from a suite,
      received heavy boos
    span_verified: true
  - id: c13
    text: New York City mayor Zohran Mamdani said he paid about $1,000 for his standing-room-only ticket.
    type: quote
    span: he said earlier Monday he paid about $1,000 for his standing-room-only ticket
    span_verified: true
  - id: c14
    text: Celebrities including Spike Lee, Timothée Chalamet, Ben Stiller, Tina Fey, Tracy Morgan and Larry David
      were on celebrity row.
    type: actor
    span: Spike Lee, Timothée Chalamet, Ben Stiller, Tina Fey, Tracy Morgan and Larry David were among the stars
    span_verified: true
  - id: c15
    text: Brunson said the team has learned from wins and now must learn from a loss, with their mindset staying
      the same.
    type: quote
    span: “We’ve done our best to try to learn from wins over the past couple weeks. But now we have to learn from
      a loss”
    span_verified: true
  - id: c16
    text: Karl-Anthony Towns had a quiet night of 11 points and eight rebounds after back-to-back double-doubles
      in San Antonio.
    type: numeric
    span: who had a quiet night of 11 points and eight rebounds after back-to-back double-doubles
    span_verified: true
  - id: c17
    text: The Knicks out-scored San Antonio 42-24 in the second quarter after the Spurs had an 11-point first-quarter
      lead.
    type: numeric
    span: the Knicks swung the momentum back in their favor and out-scored San Antonio 42-24 in the second
    span_verified: true
  - id: c18
    text: The Spurs got 21 points off the Knicks' 13 turnovers.
    type: numeric
    span: the Spurs found a lifeline with 21 points off the Knicks’ 13 turnovers
    span_verified: true
  - id: c19
    text: '''Refs, you suck!'' chants broke out at least three times during the game, and the Knicks took just eight
      free throws in the second half to the Spurs'' 24.'
    type: evaluative
    span: “refs, you suck!” chants broke out at least three times throughout the night
    span_verified: true
  - id: c20
    text: No NBA team has lost the first two games of the finals on its home floor and come back to win the championship.
    type: background
    span: No NBA team has lost the first two games of the finals on its home floor and come back to win the championship
    span_verified: true
- doc_id: s036
  on_topic: true
  description: Transcript of a televised address by Russian President Vladimir Putin justifying military action,
    framed around Donbass, NATO expansion, and grievances against the West.
  n_claims: 20
  n_span_verified: 19
  claims:
  - id: c1
    text: Putin refers back to what he said in his February 21, 2022 address about threats to Russia.
    type: background
    span: I will begin with what I said in my address on February 21, 2022
    span_verified: true
  - id: c2
    text: Putin says NATO has been expanding eastward and moving its military infrastructure closer to Russia's
      border.
    type: attribution
    span: the eastward expansion of NATO, which is moving its military infrastructure ever closer to the Russian
      border
    span_verified: true
  - id: c3
    text: Putin claims Russia spent 30 years trying to negotiate principles of equal and indivisible security in
      Europe with NATO countries.
    type: numeric
    span: over the past 30 years we have been patiently trying to come to an agreement with the leading NATO countries
    span_verified: true
  - id: c4
    text: Putin says NATO countries deceived Russia and used pressure or blackmail in response to its proposals.
    type: attribution
    span: we invariably faced either cynical deception and lies or attempts at pressure and blackmail
    span_verified: true
  - id: c5
    text: Putin cites the bombing of Belgrade as an operation conducted without UN Security Council authorization.
    type: evaluative
    span: a bloody military operation was waged against Belgrade, without the UN Security Council's sanction
    span_verified: true
  - id: c6
    text: Putin claims the illegal use of military power against Libya created a huge center of international terrorism
      and pushed the country into civil war.
    type: attribution
    span: The illegal use of military power against Libya... created a huge seat of international terrorism, and
      pushed the country towards a humanitarian catastrophe
    span_verified: false
  - id: c7
    text: Putin states the US Secretary of State held up a vial of white powder at the UN falsely claiming it was
      evidence of Iraqi chemical weapons.
    type: quote
    span: the US Secretary of State held up a vial with white power, publicly, for the whole world to see, assuring
      the international community that it was a chemical warfare agent
    span_verified: true
  - id: c8
    text: Putin asserts it later turned out Iraq did not have any chemical weapons.
    type: numeric
    span: It later turned out that all of that was a fake and a sham, and that Iraq did not have any chemical weapons
    span_verified: true
  - id: c9
    text: Putin references US politicians, political scientists and journalists describing an 'empire of lies' created
      inside the United States.
    type: quote
    span: a veritable "empire of lies" has been created inside the United States in recent years
    span_verified: true
  - id: c10
    text: Putin claims the collective West actively supported separatism and mercenary gangs in southern Russia
      during the 1990s and early 2000s.
    type: attribution
    span: the so-called collective West was actively supporting separatism and gangs of mercenaries in southern
      Russia
    span_verified: true
  - id: c11
    text: Putin states that in December 2021 Russia made another attempt to reach agreement with the US and allies
      on European security and NATO non-expansion, which failed.
    type: numeric
    span: in December 2021, we made yet another attempt to reach agreement with the United States and its allies
      on the principles of European security and NATO's non-expansion
    span_verified: true
  - id: c12
    text: Putin recalls that Nazi Germany attacked the Soviet Union on June 22, 1941 without declaring war.
    type: background
    span: Nazi Germany, which attacked our Motherland on June 22, 1941, without declaring war
    span_verified: true
  - id: c13
    text: Putin asserts that today's Russia remains one of the most powerful nuclear states with advantages in some
      cutting-edge weapons.
    type: evaluative
    span: today's Russia remains one of the most powerful nuclear states. Moreover, it has a certain advantage in
      several cutting-edge weapons
    span_verified: true
  - id: c14
    text: Putin says any potential aggressor attacking Russia directly will face defeat and ominous consequences.
    type: evaluative
    span: any potential aggressor will face defeat and ominous consequences should it directly attack our country
    span_verified: true
  - id: c15
    text: Putin claims a hostile 'anti-Russia' is being formed in territories adjacent to Russia, fully controlled
      from outside.
    type: evaluative
    span: a hostile "anti-Russia" is taking shape. Fully controlled from the outside
    span_verified: true
  - id: c16
    text: Putin says the forces that staged a coup in Ukraine in 2014 have kept power through what he calls ornamental
      election procedures.
    type: actor
    span: the forces that staged the coup in Ukraine in 2014 have seized power, are keeping it with the help of
      ornamental election procedures
    span_verified: true
  - id: c17
    text: Putin states Russia spent eight years trying to settle the Donbass situation by peaceful political means
      without success.
    type: numeric
    span: For eight years, for eight endless years we have been doing everything possible to settle the situation
      by peaceful political means
    span_verified: true
  - id: c18
    text: Putin says the motivating force behind recognizing the independence of the Donbass people's republics
      was the aspirations and pain of the people there.
    type: attribution
    span: the feelings and pain of these people that were the main motivating force behind our decision to recognise
      the independence of the Donbass people's republics
    span_verified: true
  - id: c19
    text: Putin accuses NATO countries of supporting far-right nationalists and neo-Nazis in Ukraine.
    type: attribution
    span: the leading NATO countries are supporting the far-right nationalists and neo-Nazis in Ukraine
    span_verified: true
  - id: c20
    text: Putin references Russia's assistance to Kazakhstan when it faced a challenge to its statehood and integrity.
    type: background
    span: the assistance we provided to Kazakhstan when it faced tragic events and a challenge in terms of its statehood
      and integrity
    span_verified: true
- doc_id: s040
  on_topic: true
  description: An opinion/analysis piece (PIC - Palestinian Information Center) framing Israel's military campaign
    in Gaza as genocide, situating it in historical and regional context.
  n_claims: 19
  n_span_verified: 19
  claims:
  - id: c1
    text: The Israeli occupation army announced the beginning of its large-scale assault on Gaza City on the 43rd
      anniversary of the Sabra and Shatila massacre.
    type: numeric
    span: the 43rd anniversary of the Sabra and Shatila massacre
    span_verified: true
  - id: c2
    text: The Israeli aggression has continued relentlessly for 23 months.
    type: numeric
    span: The Israeli aggression has continued relentlessly for 23 months
    span_verified: true
  - id: c3
    text: The article claims Israel now declares its project more explicitly as genocide, destruction, and displacement
      of the Palestinian people.
    type: evaluative
    span: genocide, destruction, and displacement of the Palestinian people
    span_verified: true
  - id: c4
    text: The document lists historical massacres including Deir Yassin in 1948, Kafr Qasim in 1956, and Sabra and
      Shatila in 1982 as part of a continuing colonial path.
    type: background
    span: from Deir Yassin in 1948 to Kafr Qasim in 1956, from Sabra and Shatila in 1982
    span_verified: true
  - id: c5
    text: Since October 2023, Israel has waged a full-scale war of extermination against the Palestinian people
      in Gaza, leaving over 250,000 people dead or wounded.
    type: numeric
    span: leaving over 250,000 people dead or wounded
    span_verified: true
  - id: c6
    text: The article states these casualty numbers are now acknowledged by Israeli leaders themselves after previously
      being dismissed when reported by Gaza's Ministry of Health.
    type: attribution
    span: numbers now acknowledged by Israeli leaders themselves with sadism and arrogance
    span_verified: true
  - id: c7
    text: Gaza has a small area of just 365 square kilometers.
    type: numeric
    span: Gaza, with its small area of just 365 km²
    span_verified: true
  - id: c8
    text: Gaza is described as one of the world's oldest inhabited cities with roots dating back more than three
      millennia, home to the Canaanites and ancient Philistines.
    type: background
    span: one of the world’s oldest inhabited cities, with roots dating back more than three millennia
    span_verified: true
  - id: c9
    text: Israel is described as imposing enforcement of 'sovereignty' over the West Bank, tied to efforts to empty
      Gaza of its population.
    type: attribution
    span: imposes what it calls the enforcement of “sovereignty” over the West Bank
    span_verified: true
  - id: c10
    text: The article claims Israel has launched attacks on several Arab and Muslim countries as part of its 'Greater
      Israel' project.
    type: attribution
    span: Israel has launched blatant attacks on several Arab and Muslim countries and has threatened others, as
      part of its “Greater Israel” project
    span_verified: true
  - id: c11
    text: Israel's continued genocide, siege, and starvation of Gaza persists despite International Court of Justice
      orders.
    type: attribution
    span: Its continued genocide, siege, and starvation of Gaza despite International Court of Justice orders
    span_verified: true
  - id: c12
    text: The article states Israel discarded and broke the March 2025 agreement by reneging on its commitments
      and continuing aggression.
    type: numeric
    span: It discarded and broke the March 2025 agreement when it reneged on its commitments
    span_verified: true
  - id: c13
    text: The article accuses Israel of directly targeting negotiators through airstrikes and assassinations.
    type: attribution
    span: direct targeting of negotiators through airstrikes and assassinations including the negotiators themselves
    span_verified: true
  - id: c14
    text: Israel has assassinated around 250 Palestinian journalists and barred global media from entering Gaza,
      according to the article.
    type: numeric
    span: It has assassinated around 250 Palestinian journalists and barred global media from entering Gaza
    span_verified: true
  - id: c15
    text: The article characterizes captives held by the resistance as occupying soldiers captured after participating
      in killing and bombing Palestinians, not innocent hostages.
    type: evaluative
    span: these captives are merely occupying soldiers captured by the resistance after participating in killing
      and bombing Palestinians
    span_verified: true
  - id: c16
    text: The piece argues the claim of Israel's 'right to self-defense' has collapsed, invoking the colonial phrase
      'a land without a people for a people without a land.'
    type: quote
    span: “a land without a people for a people without a land”
    span_verified: true
  - id: c17
    text: The article states that millions have taken to the streets globally in the largest protests since the
      Vietnam War, demanding an end to the genocide.
    type: numeric
    span: Millions have taken to the streets in the largest protests since the Vietnam War
    span_verified: true
  - id: c18
    text: The article claims waves of global solidarity have swept across five continents, from New York to London,
      Cape Town, and Sydney.
    type: background
    span: from New York to London, Cape Town, and Sydney
    span_verified: true
  - id: c19
    text: The article states that international legal norms, including the prohibition of land acquisition by force,
      are being undermined by Israel's actions with open American and Western military support.
    type: attribution
    span: The open American and Western military support not only shields Israel but risks turning the world into
      a new arena of global chaos
    span_verified: true
