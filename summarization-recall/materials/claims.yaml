    span: voter turnout for the 2023 district council elections plummeted to 27.5 percent of eligible voters, compared
      to 71 percent in the 2019 election
    span_verified: true
  - id: c11
    text: In summer 2019, Hong Kong saw its largest protests ever, sparked by a proposed extradition bill to China.
    type: evaluative
    span: In the summer of 2019, Hong Kong saw its largest protests ever
    span_verified: true
  - id: c12
    text: Then Chief Executive Carrie Lam withdrew the extradition bill in September 2019, but protests continued
      until COVID-19's outbreak.
