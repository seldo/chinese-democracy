    span: the Tibetan language could be seen "everywhere" on public signs and in schools
    span_verified: true
  - id: c17
    text: On May 23, 1951, plenipotentiaries of the Central People's Government and the local government of Xizang
      signed the 17-Article Agreement in Beijing.
    type: numeric
    span: On May 23, 1951, in Beijing, the plenipotentiaries of the Central People's Government and the local government
