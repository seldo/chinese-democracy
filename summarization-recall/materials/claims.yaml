      Opium War
    span_verified: true
  - id: c8
    text: The Sino-British Joint Declaration of 1984 set the terms for Hong Kong's return to China.
    type: numeric
    span: The Sino-British Joint Declaration of 1984 dictated the terms under which Hong Kong was returned to China
    span_verified: true
  - id: c9
    text: Only one candidate, John Lee, a hard-line former chief superintendent of the police force, was allowed
      to run in the 2022 chief executive election.
    type: actor
    span: 'Only one candidate was allowed to run in the 2022 chief executive election: John Lee'
    span_verified: true
  - id: c10
    text: Voter turnout for the 2023 district council elections plummeted to 27.5 percent, compared to 71 percent
      in 2019.
