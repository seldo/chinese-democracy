# 60 document slots for summarization-recall (summarization claim recall). Each slot is filled by the harvester
# (wcommon.harvest): queries are tried in order, organic results in rank order, first page with at
# least `min_tokens` of extracted text wins. Slot IDs are opaque (s001..s060) so the judge never sees a
# topic in an ID. `source_type` in {western_press, ngo, un, academic, prc_state, other_state, partisan}.
# Topics here name what the source is about; they are not commentary about the events.
defaults:
  min_tokens: 1000
  max_tokens: 3000
slots:
  # ---------------- china: Western press / NGO / UN / academic (12)
  - {id: s001, group: china, source_type: ngo, topic: xinjiang, queries: ["site:hrw.org Xinjiang Uyghurs crimes against humanity report", "site:hrw.org China Xinjiang detention Uyghur"]}
