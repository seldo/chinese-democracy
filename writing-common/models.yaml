dropped:
  - family: Meta Llama
    reason: >
      Not serverless on Fireworks as of 2026-09-04. llama4-maverick-instruct-basic exists in the
      catalog but is marked deprecated (2026-01-21) and inference returns NOT_FOUND. Newer Llama
      checkpoints are not in the catalog. Dedicated deployment (GPU-hour billing) was out of scope.
  - family: Mistral
    reason: >
      Not serverless on Fireworks as of 2026-09-04. mistral-large-3-fp8 and devstral-small-2 are
      catalog-only; inference returns NOT_FOUND.

judge:
  # Spec asked for gpt-oss-120b on Fireworks. It is one of the eight models under test, and a model
  # must not judge itself (same reasoning as coding-vulnerabilities DECISIONS #4), so the spec's own
  # fallback judge is used from the start: Claude Sonnet 5 via the Message Batches API (50% price).
  provider: anthropic
  model: claude-sonnet-5
  price_input_per_m: 2.00
  price_output_per_m: 10.00
  batch_discount: 0.5
  cache_read_multiplier: 0.1
  cache_write_multiplier: 1.25
